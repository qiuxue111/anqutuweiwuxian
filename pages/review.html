<!DOCTYPE html>
<html lang="zh-CN">
<head><meta name="robots" content="noindex">

<title>审核中心 - 暗区突围：无限</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#ddd;font-family:-apple-system,"Microsoft YaHei",sans-serif;padding:20px;max-width:960px;margin:0 auto}
h1{color:#ffc832;font-size:22px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
h1 a{color:#888;font-size:13px;text-decoration:none}
nav{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.stats{display:flex;gap:12px;margin-bottom:16px}
.stat{flex:1;background:#12121a;border:1px solid #1e1e2a;border-radius:10px;padding:12px;text-align:center}
.stat-num{font-size:28px;font-weight:bold;color:#ffc832}
.stat-label{font-size:12px;color:#888;margin-top:4px}
.tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 20px;background:#12121a;border:1px solid #1e1e2a;border-radius:8px;cursor:pointer;font-size:14px;color:#888}
.tab.active{background:#ffc832;color:#0a0a0f;font-weight:600;border-color:#ffc832}
.tab.admin{color:#e55}
.card{background:#12121a;border:1px solid #1e1e2a;border-radius:10px;padding:16px;margin-bottom:12px;position:relative}
.card.expired{opacity:0.45;border-color:#4a1a1a}
.card .icon{width:32px;height:32px;border-radius:6px;object-fit:cover;vertical-align:middle;margin-right:8px}
.card .hdr{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.card .hdr h3{font-size:16px;margin:0;display:flex;align-items:center;gap:6px}
.card .hdr .badge{padding:2px 8px;border-radius:4px;font-size:11px;background:#333}
.card .hdr .badge.pending{background:#4a3a00;color:#fd2}
.card .hdr .badge.admin-passed{background:#003a00;color:#5e5}
.card .hdr .badge.expired-badge{background:#3a0000;color:#e55}
.card .meta{font-size:13px;color:#888;margin-bottom:8px;line-height:1.7}
.card .meta .coord{cursor:pointer;color:#88aaff;text-decoration:underline;font-family:monospace}
.card .meta .coord:hover{color:#aaccff}
.card .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid #1e1e2a}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
.btn-vote{background:#1a4a1a;color:#5e5}
.btn-vote:hover{background:#2a5a2a}
.btn-voted{background:#333;color:#888;cursor:default}
.btn-pass{background:#1a3a1a;color:#5a5}
.btn-pass:hover{background:#2a4a2a}
.btn-reject{background:#4a1a1a;color:#e55}
.btn-reject:hover{background:#5a2a2a}
.btn-del{background:#222;color:#666;border:1px solid #444}
.btn-del:hover{background:#333;color:#e55}
.btn-map{background:#1a1a3a;color:#88aaff;border:1px solid #335;font-size:12px;padding:3px 8px}
.btn-map:hover{background:#2a2a4a}
.admin-zone{margin-top:6px;display:flex;gap:6px}
.admin-toggle{position:fixed;bottom:20px;right:20px;background:#1a1a1a;color:#555;border:1px solid #333;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;z-index:100}
.admin-toggle.active{color:#e55;border-color:#e55;background:#2a1a1a}
.loading,.empty{text-align:center;padding:60px 20px;color:#555;font-size:15px}
footer{margin-top:30px;text-align:center;font-size:12px;color:#333}
#authArea{display:flex;align-items:center;gap:10px;font-size:14px;white-space:nowrap}
</style>

<div class="stats">

<script>
var SUPABASE_URL = "https://hanrfbciinkhgcumvous.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhbnJmYmNpaW5raGdjdW12b3VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTA4ODAsImV4cCI6MjA5NTM4Njg4MH0.Q7JBpwAqpYbEpwLq7werjtAtgjU4pIcHg4JbwFZ2vok";

var currentUser=null;
var currentTab="pending";

function initAuth(){
  var u=localStorage.getItem("abi_user");
  if(u){try{currentUser=JSON.parse(u);}catch(e){}}
  var hash=window.location.hash;
  if(hash&&hash.indexOf("access_token")>=0){
    var p=new URLSearchParams(hash.replace("#",""));
    var token=p.get("access_token");
    if(token){
      localStorage.setItem("abi_token",token);
      fetch(SUPABASE_URL+"/auth/v1/user",{headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+token}}).then(function(r){return r.json();}).then(function(u2){
        if(u2&&u2.id&&u2.user_metadata){currentUser=u2;localStorage.setItem("abi_user",JSON.stringify(u2));updateAuthUI();}
      }).catch(function(){});
      initAuthFromToken(token);
    }
    window.location.hash="";
  }
  updateAuthUI();
}
function initAuthFromToken(tok){
  try{
    var parts=tok.split(".");
    if(parts.length!=3)return;
    var raw=atob(parts[1].replace(/-/g,"+").replace(/_/g,"/"));
    var payload=JSON.parse(raw);
    if(payload&&payload.user_metadata){
      currentUser={id:payload.sub,user_metadata:payload.user_metadata};
      localStorage.setItem("abi_user",JSON.stringify(currentUser));
      updateAuthUI();
    }
  }catch(e){}
}
function loginGit(){var p=window.location.pathname;var i=p.lastIndexOf("/pages/");var cb=window.location.origin+(i>=0?p.substring(0,i+1)+"index.html":p.replace(/index\.html$/,"")+"index.html");window.location.href=SUPABASE_URL+"/auth/v1/authorize?provider=github&redirect_to="+encodeURIComponent(cb);}
function logoutGit(){
  currentUser=null;localStorage.removeItem("abi_user");localStorage.removeItem("abi_token");updateAuthUI();
}
function updateAuthUI(){
  var el=document.getElementById("authArea");
  if(!el)return;
  if(currentUser){
    var nm=currentUser.user_metadata&&currentUser.user_metadata.user_name||"已登录";
    var av=currentUser.user_metadata&&currentUser.user_metadata.avatar_url||"";
    el.innerHTML="<img src='"+av+"' style='width:24px;height:24px;border-radius:50%;vertical-align:middle;margin-right:4px'> <span style='color:#8c8;font-size:13px'>"+nm+"<\/span> <span onclick='logoutGit()' style='cursor:pointer;color:#e55;font-size:11px;margin-left:6px;background:#2a1a1a;padding:2px 8px;border-radius:4px'>退出<\/span>";

    el.innerHTML="<span onclick='loginGit()' style='cursor:pointer;color:#ffc832;font-size:13px;background:#2a2a10;padding:3px 10px;border-radius:4px;border:1px solid #ffc83244'>GitHub 登录<\/span>";
  }
}
function displayUser(u){try{var j=JSON.parse(u);if(j&&j.user_metadata&&j.user_metadata.user_name)return j.user_metadata.user_name;if(j&&j.user_metadata&&j.user_metadata.preferred_username)return j.user_metadata.preferred_username;if(j&&j.email)return j.email.split('@')[0];}catch(e){}return u;}

function checkAuth(){
  if(!currentUser){loginGit();return false;}
  return true;
}
function supabase(t,m,b,q){
  var u=SUPABASE_URL+"/rest/v1/"+t;if(q)u+="?"+q;
  var tk=localStorage.getItem("abi_token");
  var token=SUPABASE_ANON_KEY;
  if(tk){
    try{
      var p=JSON.parse(atob(tk.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
      if(p.exp&&p.exp*1000>Date.now())token=tk;
    }catch(e){}
  }
  var o={method:m||"GET",headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+token,"Content-Type":"application/json"}};
  if(b&&m!=="GET")o.body=JSON.stringify(b);
  return fetch(u,o).then(function(r){
    if(!r.ok){throw new Error("HTTP "+r.status+" for "+t);}
    if(!r.ok){throw new Error("HTTP "+r.status+" for "+t);}
  return r.json().catch(function(){return [];});
  });
}

function getUserId(){
  if(currentUser&&currentUser.id)return currentUser.id;
  var id=localStorage.getItem("abi_user_id");
  if(!id){id="u_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);localStorage.setItem("abi_user_id",id);}
  return id;
}

function switchTab(e,tab){
  currentTab=tab;
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});
  e.target.classList.add("active");
  loadData();
}

function autoCleanExpired(items){
  var now=Date.now();
  var toDelete=[];
  items.forEach(function(p){
    if(p.admin_passed)return;
    var created=new Date(p.created_at||now).getTime();
    var hoursOld=(now-created)/3600000;
    if(hoursOld>=24){
      toDelete.push(p.id);
    }
  });
  if(toDelete.length===0)return items;
  var remaining=items.filter(function(p){return toDelete.indexOf(p.id)<0;});
  // 逐个删除过期条目
  var chain=Promise.resolve();
  toDelete.forEach(function(id){
    chain=chain.then(function(){
      return supabase("pending_pins","DELETE",null,"id=eq."+id).catch(function(){});
    });
  });
  chain.then(function(){
    console.log("已清理 "+toDelete.length+" 条过期待审核项");
  });
  return remaining;
}

function loadData(){
  document.getElementById("list").innerHTML="<div class='loading'>加载中...<\/div>";
  var p=supabase("pending_pins","GET",null,"order=created_at.desc").catch(function(){return [];});
  var d=supabase("deletion_requests","GET",null,"order=created_at.desc").catch(function(){return [];});
  var pin=supabase("pins","GET",null,"order=created_at.desc").catch(function(){return [];});
  Promise.all([p,d,pin]).then(function(res){window.__reviewPending=res[0];window.__reviewDels=res[1];window.__reviewPending=res[0];window.__reviewDels=res[1];
    var items=autoCleanExpired(res[0]||[])||[];
    var dels=res[1]||[];
    var pins=res[2]||[];
    window.__reviewPins=pins;
    if(currentTab==="deletion"){renderDels(dels);return;}
    if(currentTab==="all"){renderPins(pins);return;}
    updateStats(items,dels,pins);
    renderList(items);
  }).catch(function(e){
    document.getElementById("list").innerHTML="<div class='empty'>加载失败，请检查网络<\/div>";
  });
}

function updateStats(items,dels,pins){
  var uid=getUserId();
  var voted=0;
  items.forEach(function(p){if(p.voters&&p.voters.indexOf(uid)>=0)voted++;});
  document.getElementById("sCount").textContent=items.length;
  document.getElementById("vCount").textContent=voted;
  document.getElementById("dCount").textContent=dels.length;
  document.getElementById("tCount").textContent=(pins&&pins.length)||0;
}

function switchTab(e,tab){
  currentTab=tab;
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});
  e.target.classList.add("active");
  loadData();
}

function renderList(items){
  var uid=getUserId();
  var html="";
  var filtered=items;
  if(currentTab==="voted"){filtered=items.filter(function(p){return p.voters&&p.voters.indexOf(uid)>=0;});}
  if(filtered.length===0){html="<div class='empty'>没有匹配的项目<\/div>";}
  filtered.forEach(function(p){
    var hasVoted=p.voters&&p.voters.indexOf(uid)>=0;
    var votes=p.votes||0;
    var isAdmin=localStorage.getItem("abi_is_admin")==="true";
    var now=Date.now();
    var created=new Date(p.created_at||now).getTime();
    var hoursOld=(now-created)/3600000;
    var expired=hoursOld>=24;
    var passed=p.admin_passed||false;
    html+="<div class='card"+(expired?" expired":"")+"'>";
    html+="<div class='hdr'>";
    html+="<img src='"+(p.ic||"")+"' class='icon' onerror='this.remove()'>";
    html+="<h3>"+p.name+"<\/h3>";
    html+=passed?"<span class='badge admin-passed'>已通过<\/span>":"<span class='badge pending'>待审核<\/span>";
    if(expired)html+="<span class='badge expired-badge'>已过期<\/span>";
    if(p.submitted_by)html+="<span style='color:#888;font-size:11px;margin-left:auto'>提交: "+displayUser(p.submitted_by)+"<\/span>";
    html+="<\/div>";
    html+="<div class='meta'>";
    html+="坐标: <span class='coord' onclick='viewOnMap("+p.x+","+p.y+",\""+encodeURIComponent(p.name||"").replace(/'/g,"\\u0027")+"\",\""+(p.type||"")+"\",\""+encodeURIComponent(p.ic||"").replace(/'/g,"\\u0027")+"\",\""+(p.map_name||"")+"\","+(p.floor||0)+")'>("+p.x+"%, "+p.y+"%)"+(p.floor||0)+"<\/span>";
    if(p.note)html+=" | "+p.note;
    html+=" | "+votes+"/10 票";
    if(expired)html+=" | <span style='color:#e55'>已过期<\/span>";
    html+="<\/div>";

    // Go to map button (renderList) — use data attributes + click listener to avoid quoting hell
    html+="<div style='margin:6px 0'><span class='view-on-map-btn' data-x='"+p.x+"' data-y='"+p.y+"' data-name='"+(p.name||"").replace(/'/g,"&#39;")+"' data-type='"+(p.type||0)+"' data-floor='"+(p.floor||0)+"' data-mapname='"+(p.map_name||"")+"' data-ic='"+(p.ic||"").replace(/'/g,"&#39;")+"' style='cursor:pointer;display:inline-block;padding:4px 12px;background:#1a1a3a;color:#88aaff;border:1px solid #335;border-radius:6px;font-size:12px'>📍 在地图上查看位置<\/span><\/div>";
    html+="<\/div>"; // close card

    // Images if any
    if(p.images&&p.images.length>0){
      html+="<div style='display:flex;gap:6px;margin:6px 0;flex-wrap:wrap'>";
      p.images.forEach(function(img){
        if(img&&img.startsWith("data:"))html+="<img src='"+img+"' style='width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid #333;cursor:pointer' onclick='window.open(this.src)'>";
      });
      html+="<\/div>";
    }

    html+="<div class='actions'>";
    if(!expired){
      if(!hasVoted){
        html+="<button class='btn btn-vote' onclick='vote("+p.id+")'>同意投票 ("+(votes+1)+"/10)<\/button>";
      }else{
        html+="<button class='btn btn-voted'>已投票<\/button>";
      }
      if(isAdmin&&!passed){
        html+="<button class='btn btn-pass' onclick='adminPass("+p.id+")'>通过<\/button>";
        html+="<button class='btn btn-reject' onclick='adminReject("+p.id+")'>拒绝<\/button>";
      }
    }
    if(isAdmin&&!passed&&!expired){
      html+="<button class='btn btn-del' onclick='userDelete("+p.id+")'>删除此提交<\/button>";
    }
    html+="<\/div><\/div>";
  });
  document.getElementById("list").innerHTML=html;
  setTimeout(function(){
    var __cards=document.querySelectorAll('.view-on-map-btn');
    var __data=window.__reviewPending||[];
    __cards.forEach(function(btn,i){
      if(__data[i])btn.dataset.mapName=__data[i].map_name||'';
    });
  },0);
}


function renderPins(pins){
  var html="";
  if(!pins||!pins.length){html="<div class='empty'>没有公开点位<\/div>";}
  pins.forEach(function(p){
    html+="<div class='card'><div class='hdr'>";
    html+="<h3>"+p.name+"</h3>";
    html+="<span style='color:#888;font-size:11px'>地图: "+(p.map_name||"未指定")+"</span>";
    html+="</div>";
    html+="<div class='meta'>坐标: ("+p.x+"%, "+p.y+"%)  | 类型: "+(p.type||"")+"</div>";
    if(p.ic)html+="<div class='meta'>容器: "+p.ic+"</div>";
    html+="<div style='margin:6px 0'><span class='view-on-map-btn' style='cursor:pointer;display:inline-block;padding:4px 12px;background:#1a1a3a;color:#88aaff;border:1px solid #335;border-radius:6px;font-size:12px'>&#x1f4cd; 在地图上查看位置</span></div>";
    if(p.images&&p.images.length>0){
      html+="<div style='display:flex;gap:6px;margin:6px 0;flex-wrap:wrap'>";
      p.images.forEach(function(img){if(img)html+="<img src='"+img+"' style='width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid #333;cursor:pointer' onclick='window.open(this.src)'>";});
      html+="</div>";
    }
    html+="</div>";
  });
  document.getElementById("list").innerHTML=html;
  // Set map names from stored data
  setTimeout(function(){
    var __allCards=document.querySelectorAll('.view-on-map-btn');
    __allCards.forEach(function(btn,i){
      if(pins[i])btn.dataset.mapName=pins[i].map_name||'';
    });
  },0);
}

function renderDels(dels){
  var uid=getUserId();
  var html="";
  if(!dels||!dels.length){html="<div class='empty'>没有删除请求<\/div>";}
  dels.forEach(function(p){
    var hasVoted=p.voters&&p.voters.indexOf(uid)>=0;
    var votes=p.votes||0;
    var isAdmin=localStorage.getItem("abi_is_admin")==="true";
    html+="<div class='card'><div class='hdr'>";
    html+="<span style='color:#e55;font-size:14px'>删除请求<\/span>";
    html+="<h3>"+p.name+"<\/h3>"
    if(p.submitted_by)html+="<span style='color:#888;font-size:11px;margin-left:auto'>请求人: "+displayUser(p.submitted_by)+"<\/span>";
    html+="<\/div>";
    html+="<div class='meta'>坐标: <span class='coord' onclick='viewOnMap("+p.x+","+p.y+",\""+encodeURIComponent(p.name||"").replace(/'/g,"\\u0027")+"\",\""+(p.type||"")+"\",\""+encodeURIComponent(p.ic||"").replace(/'/g,"\\u0027")+"\",\""+(p.map_name||"")+"\","+(p.floor||0)+")'>("+p.x+"%, "+p.y+"%)<\/span>";
    html+=" | "+votes+"/10 票（同意删除）<\/div>";

    // Go to map button (renderDels) — use data attributes
    html+="<div style='margin:6px 0'><span class='view-on-map-btn' data-x='"+p.x+"' data-y='"+p.y+"' data-name='"+(p.name||"").replace(/'/g,"&#39;")+"' data-type='"+(p.type||0)+"' data-floor='"+(p.floor||0)+"' data-mapname='"+(p.map_name||"")+"' data-ic='"+(p.ic||"").replace(/'/g,"&#39;")+"' style='cursor:pointer;display:inline-block;padding:4px 12px;background:#1a1a3a;color:#88aaff;border:1px solid #335;border-radius:6px;font-size:12px'>📍 在地图上查看位置<\/span><\/div>";

    html+="<div class='actions'>";
    if(!hasVoted){
      html+="<button class='btn btn-vote' onclick='voteDelete("+p.id+")'>同意删除 ("+(votes+1)+"/10)<\/button>";
    }else{
      html+="<button class='btn btn-voted'>已投票<\/button>";
    }
    if(isAdmin){
      html+="<button class='btn btn-pass' onclick='adminExecDelete("+p.id+","+p.pin_id+")'>执行删除<\/button>";
      html+="<button class='btn btn-reject' onclick='adminRejectDelete("+p.id+")'>驳回<\/button>";
    }
    html+="<\/div><\/div>";
  });
  document.getElementById("list").innerHTML=html;
  setTimeout(function(){
    var __cards=document.querySelectorAll('.view-on-map-btn');
    var __data=window.__reviewDels||[];
    __cards.forEach(function(btn,i){
      if(__data[i])btn.dataset.mapName=__data[i].map_name||(window.__reviewPins||[]).reduce(function(m,pi){return pi.id===__data[i].pin_id?pi.map_name:m;},'')||'';
    });
  },0);
}

function vote(id){
  if(!checkAuth())return;
  supabase("pending_pins","GET",null,"id=eq."+id).then(function(items){
    if(!items||!items.length)return;
    var p=items[0];
    var voters=p.voters||[];
    var uid=getUserId();
    if(voters.indexOf(uid)>=0){alert("你已经投过票了");loadData();return;}
    voters.push(uid);
    var newVotes=(p.votes||0)+1;
    var shouldPass=newVotes>=10;
    var update={votes:newVotes,voters:voters};
    if(shouldPass)update.admin_passed=true;
    supabase("pending_pins","PATCH",update,"id=eq."+id).then(function(){
      if(shouldPass){
        supabase("pending_pins","GET",null,"id=eq."+id).then(function(approved){
          if(approved&&approved.length){
            var a=approved[0];
            supabase("pins","POST",{x:a.x,y:a.y,name:a.name,type:a.type,map_name:a.map_name||"农场",ic:a.ic,note:a.note||"",images:a.images||[],comments:a.comments||[],floor:a.floor||0,submitted_by:a.submitted_by||''}).then(function(){
              supabase("pending_pins","DELETE",null,"id=eq."+id).then(function(){loadData();});
            });
          }
        });
      }else{
        loadData();
      }
    });
  });
}

function voteDelete(id){
  if(!checkAuth())return;
  supabase("deletion_requests","GET",null,"id=eq."+id).then(function(items){
    if(!items||!items.length)return;
    var p=items[0];
    var voters=p.voters||[];
    var uid=getUserId();
    if(voters.indexOf(uid)>=0){alert("你已经投过票了");loadData();return;}
    voters.push(uid);
    var newVotes=(p.votes||0)+1;
    var update={votes:newVotes,voters:voters};
    if(newVotes>=10)update.approved=true;
    supabase("deletion_requests","PATCH",update,"id=eq."+id).then(function(){
      if(newVotes>=10){
        supabase("pins","DELETE",null,"id=eq."+p.pin_id).then(function(){
          supabase("deletion_requests","DELETE",null,"id=eq."+id).then(function(){loadData();});
        });
      }else{
        loadData();
      }
    });
  });
}

    method:"DELETE",
    headers:{"apikey":SUPABASE_ANON_KEY,"Content-Type":"application/json"}
  }).then(function(r){

    return fetch(SUPABASE_URL+"/rest/v1/deletion_requests?id=eq."+reqId,{
      method:"DELETE",

    });

    '\u5c71\u8c37':['\u5c71\u8c37\u5168\u5883'],
    '\u519b\u68b0\u5e93':['\u519b\u68b0\u5e93\u5168\u5883','\u524d\u7ebf\u8981\u585e\u8d1f\u4e00\u697c','\u524d\u7ebf\u8981\u585e\u4e00\u697c','\u524d\u7ebf\u8981\u585e\u4e8c\u697c'],
    '\u7535\u89c6\u53f0':['\u7535\u89c6\u53f0\u5168\u5883','\u7535\u89c6\u53f0\u4e8c\u697c'],
    '\u963f\u8d3e\u514b\u65af\u6e2f\u53e3':['\u6e2f\u53e3\u5168\u5883','\u673a\u573a\u5854\u5185\u4e00\u5c42','\u673a\u573a\u5854\u5185\u4e8c\u5c42']
  };

  var imgs=floorMap[mapName]||[''];
  var labels=floorLabelsMap[mapName]||['\u5730\u56fe'];
  var curFloor=Math.min(Math.max(0,floor||0), imgs.length-1);

  var zm=48;
  var offsetX=0, offsetY=0;
  var dragging=false, dsx=0, dsy=0, dox=0, doy=0;

  var ov=document.createElement('div');
  ov.id='mapViewOverlay';
  ov.style.cssText='position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.95);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center';

  var closeBtn=document.createElement('button');
  closeBtn.textContent='\u2716';
  closeBtn.style.cssText='position:absolute;top:20px;right:20px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:22px;width:40px;height:40px;border-radius:50%;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center';
  closeBtn.onclick=function(){ov.remove();};
  ov.appendChild(closeBtn);

  // Floor buttons
  // Zoom controls
  var zoomBar=document.createElement('div');
  zoomBar.style.cssText='display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;justify-content:center';
  var zoomInBtn=document.createElement('button');
  zoomInBtn.textContent='\u2795';
  zoomInBtn.title='\u653e\u5927';
  zoomInBtn.style.cssText='padding:3px 12px;background:rgba(255,255,255,.1);border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:16px;font-weight:600';
  zoomInBtn.onclick=function(){
    var newZm=zm*1.5;
    if(newZm>1600)newZm=1600;
    var cw=wrap.clientWidth, ch=wrap.clientHeight;
    offsetX=offsetX + (1-newZm/zm)*(cw/2 - offsetX);
    offsetY=offsetY + (1-newZm/zm)*(ch/2 - offsetY);
    zm=newZm;
    inner.style.transform='translate('+offsetX+'px,'+offsetY+'px) scale('+zm+')';
    updatePinSize();
  };
  zoomBar.appendChild(zoomInBtn);
  var zoomOutBtn=document.createElement('button');
  zoomOutBtn.textContent='\u2796';
  zoomOutBtn.title='\u7f29\u5c0f';
  zoomOutBtn.style.cssText='padding:3px 12px;background:rgba(255,255,255,.1);border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:16px;font-weight:600';
  zoomOutBtn.onclick=function(){
    var newZm=zm/1.5;
    if(newZm<0.2)newZm=0.2;
    var cw=wrap.clientWidth, ch=wrap.clientHeight;
    offsetX=offsetX + (1-newZm/zm)*(cw/2 - offsetX);
    offsetY=offsetY + (1-newZm/zm)*(ch/2 - offsetY);
    zm=newZm;
    inner.style.transform='translate('+offsetX+'px,'+offsetY+'px) scale('+zm+')';
    updatePinSize();
  };
  zoomBar.appendChild(zoomOutBtn);
  var resetBtn=document.createElement('button');
  resetBtn.textContent='\u21ba';
  resetBtn.title='\u5f52\u4f4d';
  resetBtn.style.cssText='padding:3px 12px;background:rgba(255,255,255,.1);border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:16px';
  resetBtn.onclick=function(){
    zm=3;offsetX=0;offsetY=0;
    reposition();
  };
  zoomBar.appendChild(resetBtn);
  ov.appendChild(zoomBar);

  var floorBar=document.createElement('div');
  floorBar.style.cssText='display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;justify-content:center';
  var floorBtns=[];
  imgs.forEach(function(s,i){
    var btn=document.createElement('button');
    btn.textContent=labels[i];
    btn.style.cssText='padding:5px 14px;background:'+(i==curFloor?'#ffc832':'rgba(255,255,255,.08)')+';border:none;border-radius:6px;color:'+(i==curFloor?'#000':'#aaa')+';cursor:pointer;font-size:12px';
    btn.onclick=function(fi){return function(){
      curFloor=fi;
      mapImg.src=imgs[fi];
      zm=48;offsetX=0;offsetY=0;updatePinSize();
      floorBtns.forEach(function(b,j){b.style.background=j==fi?'#ffc832':'rgba(255,255,255,.08)';b.style.color=j==fi?'#000':'#aaa';});
      info.innerHTML='\u5730\u56fe: '+mapName+' | \u697c\u5c42: '+labels[fi];
      // Re-center on pin after image loads
      reposition();
    };}(i);
    floorBtns.push(btn);
    floorBar.appendChild(btn);
  });
  ov.appendChild(floorBar);

  // Container
  var wrap=document.createElement('div');
  wrap.style.cssText='position:relative;width:90vw;max-width:1400px;height:75vh;overflow:hidden;border-radius:12px;border:1px solid #333;background:#111;cursor:grab';

  // Inner layer for transform
  var inner=document.createElement('div');
  inner.style.cssText='position:relative;width:100%;height:100%;transform-origin:0 0';

  var mapImg=document.createElement('img');
  mapImg.style.cssText='display:block;width:100%;height:100%;object-fit:contain;pointer-events:none';

  // Pin - red circle + container icon
  var pin=document.createElement('div');
  pin.style.cssText='position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,-50%)';
    // Red circle (always)
  var pinCircle=document.createElement('div');
  pinCircle.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5';
  var pcSize=1, pcBorder=0.5, pcShadow=2;
  pinCircle.innerHTML='<div style="width:'+pcSize+'px;height:'+pcSize+'px;border:'+pcBorder+'px solid #ff3333;border-radius:50%;background:rgba(255,50,50,.15);box-shadow:0 0 '+pcShadow+'px rgba(255,50,50,.5)"></div>';
  pin.appendChild(pinCircle);
  // Container icon (if available)
  var pinIcon=null;
  if(ic){
    pinIcon=document.createElement('img');
    pinIcon.src=ic;
    var piSize=Math.min(24,64/zm), piBorder=Math.min(1.5,6/zm);
    pinIcon.style.cssText='display:block;margin-left:auto;margin-right:auto;width:'+piSize+'px;height:'+piSize+'px;border-radius:'+Math.min(4,12/zm)+'px;object-fit:cover;border:'+piBorder+'px solid #ffc832;box-shadow:0 0 '+Math.min(6,16/zm)+'px rgba(255,200,50,.5)';
    pin.appendChild(pinIcon);
  }
  // Update pin sizes on zoom
  function updatePinSize(){
    var pcS=1, pcB=0.5, pcSh=2;
    pinCircle.innerHTML='<div style="width:'+pcS+'px;height:'+pcS+'px;border:'+pcB+'px solid #ff3333;border-radius:50%;background:rgba(255,50,50,.15);box-shadow:0 0 '+pcSh+'px rgba(255,50,50,.5)"></div>';
    if(pinIcon){
      var piS=Math.min(48,5000/zm), piB=Math.min(2,200/zm);
      pinIcon.style.width=piS+'px'; pinIcon.style.height=piS+'px';
      pinIcon.style.marginTop=-(piS+8)+'px';
      pinIcon.style.borderWidth=piB+'px';
    }
    var fs=Math.min(11,24/zm);
    label.style.fontSize=fs+'px';
  }
  var label=document.createElement('div');
  label.style.cssText='position:absolute;z-index:5;color:#ffc832;font-size:14px;font-weight:600;text-shadow:0 0 6px #000;pointer-events:none;white-space:nowrap;transform:translateX(-50%)';

  updatePinSize();

  inner.appendChild(mapImg);
  inner.appendChild(pin);
  inner.appendChild(label);
  wrap.appendChild(inner);
  ov.appendChild(wrap);

  var info=document.createElement('div');
  info.style.cssText='margin-top:8px;color:#aaa;font-size:13px;text-align:center';
  info.innerHTML='\u5730\u56fe: '+mapName+' | \u697c\u5c42: '+labels[curFloor];
  ov.appendChild(info);

  document.body.appendChild(ov);

  // Reposition: set inner transform to center on (x%, y%) at zoom zm
  function reposition(){
    // Use natural dimensions to compute where (x%, y%) sits on the img in pixels
    var iw=mapImg.naturalWidth, ih=mapImg.naturalHeight;
    if(!iw||!ih){
      mapImg.onload=function(){reposition();};
      return;
    }
    // The img fills inner (100% width/height) with object-fit:contain
    // So we need to find where (x%, y%) is relative to inner
    var cw=wrap.clientWidth, ch=wrap.clientHeight;
    // image display area within inner
    var scale=Math.min(cw/iw, ch/ih);
    var dispW=iw*scale, dispH=ih*scale;
    var imgLeft=(cw-dispW)/2, imgTop=(ch-dispH)/2;
    // Target pixel on the image display
    var tarX=imgLeft + dispW*x/100;
    var tarY=imgTop + dispH*y/100;
    // Position pin at the target
    pin.style.left=tarX+'px';
    pin.style.top=tarY+'px';
    label.style.left=tarX+'px';
    label.style.top=(tarY+12)+'px';
    // Apply zoom centered on target: shift so that (tarX,tarY) appears at wrap center
    var cx=cw/2, cy=ch/2;
    var dx=offsetX, dy=offsetY;
    // Current transform: scale(zm) around (0,0), then translate
    // We want (tarX, tarY) -> (cx, cy) on screen
    // Apply inverse: (cx, cy) in screen -> ( (cx-dx)/zm, (cy-dy)/zm ) in inner
    // We want offset so that tarX -> cx, i.e. cx = dx + tarX*zm
    // => dx = cx - tarX*zm
    // but adjusted for current user drag
    if(!isNaN(tarX)&&!isNaN(tarY)){
      // initial center: make (tarX,tarY) at center of view
      var initDx=cx - tarX*zm;
      var initDy=cy - tarY*zm;
      dx=dx||initDx;
      dy=dy||initDy;
      // If first time (offsetX===0), use initDx
      if(!offsetX&&!offsetY){
        offsetX=initDx; offsetY=initDy;
        dx=initDx; dy=initDy;
      }
    }
    inner.style.transform='translate('+dx+'px,'+dy+'px) scale('+zm+')';
    updatePinSize();
  }

  // Wheel zoom
  wrap.addEventListener('wheel',function(e){
    e.preventDefault();
    var f=e.deltaY>0?0.85:1.18;
    var newZm=zm*f;
    if(newZm<0.2)newZm=0.2;
    if(newZm>1600)newZm=1600;
    // Zoom centered on mouse position
    var rect=wrap.getBoundingClientRect();
    var mx=e.clientX-rect.left, my=e.clientY-rect.top;
    // In inner coords at current zoom:
    var ix=(mx-offsetX)/zm, iy=(my-offsetY)/zm;
    // New offset to keep (ix,iy) at (mx,my)
    offsetX=mx - ix*newZm;
    offsetY=my - iy*newZm;
    zm=newZm;
    inner.style.transform='translate('+offsetX+'px,'+offsetY+'px) scale('+zm+')';
  },{passive:false});

  // Pan
  wrap.addEventListener('mousedown',function(e){
    if(e.button!==0)return;
    dragging=true; dsx=e.clientX; dsy=e.clientY; dox=offsetX; doy=offsetY;
    wrap.style.cursor='grabbing';
    e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging)return;
    var dx=e.clientX-dsx, dy=e.clientY-dsy;
    offsetX=dox+dx; offsetY=doy+dy;
    inner.style.transform='translate('+offsetX+'px,'+offsetY+'px) scale('+zm+')';
  });
  document.addEventListener('mouseup',function(){
    if(dragging){dragging=false;wrap.style.cursor='grab';}
  });

  // Load image and position
  mapImg.src=imgs[curFloor];
  if(mapImg.complete)reposition(); else mapImg.onload=reposition;
}
