<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索 — 暗区突围：无限攻略站</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .search-page { margin-top: 60px; max-width: 700px; margin-left: auto; margin-right: auto; padding: 2rem 1rem; }
    .search-page h1 { color: #ffc832; text-align: center; margin-bottom: 2rem; }
    .search-box {
      display: flex; gap: 0.5rem; margin-bottom: 2rem;
    }
    .search-box input {
      flex: 1; padding: 0.8rem 1.2rem; border-radius: 8px;
      border: 1px solid #1e1e2a; background: #12121a;
      color: #fff; font-size: 1rem; outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: #ffc832; }
    .search-box input::placeholder { color: #555; }
    .search-box button {
      padding: 0.8rem 1.5rem; background: #ffc832; color: #0a0a0f;
      border: none; border-radius: 8px; font-weight: 700; cursor: pointer;
      font-size: 0.95rem; transition: background 0.2s;
    }
    .search-box button:hover { background: #ffd950; }

    .search-result-item {
      display: flex; align-items: center; gap: 0.8rem;
      background: #12121a; border: 1px solid #1e1e2a;
      border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 0.8rem;
      text-decoration: none; transition: border-color 0.2s;
    }
    .search-result-item:hover { border-color: rgba(255,200,50,0.3); }
    .sr-type {
      display: inline-block; padding: 0.2rem 0.7rem; border-radius: 4px;
      font-size: 0.75rem; font-weight: 600; min-width: 42px; text-align: center;
      background: #2a2a3a; color: #aaa;
    }
    .sr-title { color: #fff; font-weight: 600; font-size: 0.95rem; flex-shrink: 0; }
    .sr-desc { color: #888; font-size: 0.82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-empty {
      text-align: center; color: #666; padding: 3rem 0;
    }
    .search-hint { text-align: center; color: #555; font-size: 0.85rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><a href="index.html" style="color:#ffc832;text-decoration:none;">暗区无限</a> <span>攻略站</span></div>
    
        <ul class="nav-links">
      <li><a href="index.html">首页</a></li>
      <li><a href="pages/maps.html">地图</a></li>
      <li><a href="pages/weapons.html">帖子</a></li>
      <li><a href="pages/strategy.html">技巧</a></li>
      <li><a href="pages/gear.html">攻略</a></li>
      <li><a href="search.html" style="color:#ffc832;">🔍</a></li>
    </ul>
    <button id="loginBtn" onclick="loginGitHub()" style="padding:0.2rem 0.5rem;background:#333;color:#ccc;border:1px solid #555;border-radius:4px;font-size:0.75rem;cursor:pointer;margin-left:auto;margin-left:auto;flex-shrink:0;">登录</button>
  
  </nav>

  <div class="search-page">
    <h1>🔍 搜索攻略</h1>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="搜索地图、枪械、技巧、配装… 例如：北山、H416、跑刀" autofocus>
      <button onclick="doSearch(document.getElementById('search-input').value)">搜索</button>
    </div>
    <div id="search-results"></div>
    <div class="search-hint">
      支持模糊搜索 · 试试搜 "北山" "H416" "跑刀" "四级弹" "架枪"
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0">
(function(){
  var h=window.location.hash;
  if(h&&h.includes('access_token=')){
    var p=new URLSearchParams(h.replace('#',''));
    var t=p.get('access_token');
    if(t){
      try{
        var payload=JSON.parse(atob(t.split('.')[1]));
        localStorage.setItem('abi_token',t);
        localStorage.setItem('abi_user',p.get('email')||payload.email||'');location.reload();
        history.replaceState(null,'',window.location.pathname);
      }catch(err){}
    }
  }
})();

</script>
  <script src="js/search.js"></script>
  <script>
    // 页面加载后自动显示所有分类作为预览
    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        renderResults(searchIndex.slice(0, 8), "search-results");
      }, 300);
    });

function loginGitHub(){
  var cb=window.location.origin+window.location.pathname;
  var u="https://hanrfbciinkhgcumvous.supabase.co/auth/v1/authorize?provider=github&redirect_to="+encodeURIComponent(cb);
  window.location.href=u;
}
(function authCheck(){
  var h=window.location.hash;
  if(h&&h.includes("access_token=")){
    var p=new URLSearchParams(h.replace("#",""));
    var t=p.get("access_token");
    if(t){
      try{
        var payload=JSON.parse(atob(t.split(".")[1]));
        localStorage.setItem("abi_token",t);
        localStorage.setItem("abi_user",payload.email||payload.user_metadata?.email||"");location.reload();
        history.replaceState(null,"",window.location.pathname);
      }catch(err){}
    }
  }
  var token=localStorage.getItem("abi_token");
  if(token){
    document.querySelectorAll("#loginBtn").forEach(function(b){b.style.display="none"});
  }
})();
  </script>

  <footer>
    <p>暗区突围攻略站 · 持续更新中</p>
  </footer>

</body>
</html>
