*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#ddd;font-family:-apple-system,"Microsoft YaHei",sans-serif}

.ctrl{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0f0f16;border-top:1px solid #1e1e2a;flex-wrap:wrap}
.ctrl button{background:#1e1e2a;border:none;color:#ccc;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px}

.ly-btn{position:absolute;top:8px;right:8px;z-index:10;background:rgba(0,0,0,.6);border:1px solid #333;color:#ddd;padding:16px 40px;border-radius:16px;cursor:pointer;font-size:52px}
.crosshair{display:none;position:fixed;z-index:9997;pointer-events:none;width:40px;height:40px;transform:translate(-50%,-50%)}
.crosshair.show{display:block}
.crosshair .ch-h,.crosshair .ch-v{position:absolute;background:rgba(255,200,50,.8)}
.crosshair .ch-h{top:50%;left:0;width:100%;height:2px;transform:translateY(-50%)}
.crosshair .ch-v{top:0;left:50%;width:2px;height:100%;transform:translateX(-50%)}
.crosshair .ch-dot{position:absolute;top:50%;left:50%;width:10px;height:10px;border:2px solid #ffc832;border-radius:50%;transform:translate(-50%,-50%);background:rgba(255,200,50,.15)}
.ly-btn:hover{background:rgba(0,0,0,.8);color:#ffc832}

.ly-pop .ly-card-hdr{display:flex;align-items:center;gap:10px;padding:6px 8px 10px;border-bottom:1px solid rgba(255,200,50,.15);margin-bottom:4px;font-size:22px;color:#ffc832;font-weight:600}

.pd-img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pd-img-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid #1e1e2a;cursor:pointer}
.pd-img-grid img:hover{border-color:#ffc832}
.pd-add-img{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border:2px dashed #333;border-radius:6px;cursor:pointer;color:#666;font-size:28px}
.pd-add-img:hover{border-color:#ffc832;color:#ffc832}
.pd-comments{margin-top:16px;border-top:1px solid #1e1e2a;padding-top:12px}
.pd-comments .pdc-title{color:#ffc832;font-size:15px;font-weight:600;margin-bottom:8px}
.pd-comments textarea{width:100%;min-height:40px;background:#0a0a10;border:1px solid #1e1e2a;border-radius:8px;color:#ddd;padding:8px;font-size:13px;resize:vertical;font-family:inherit}
.pd-comments textarea:focus{outline:none;border-color:#ffc832}
.pd-comments .pdc-btn{padding:4px 12px;background:#ffc832;color:#0a0a0f;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:12px;margin-top:4px}
.pd-comments .pdc-list{margin-top:8px;max-height:200px;overflow-y:auto}

/* ─── 地图全局评论区 ─── */
.map-comments{margin:1rem auto;max-width:1200px;background:#12121a;border:1px solid #1e1e2a;border-radius:12px;padding:16px}
.map-comments h3{color:#ffc832;font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.map-comments textarea{width:100%;min-height:60px;background:#0a0a10;border:1px solid #1e1e2a;border-radius:8px;color:#ddd;padding:10px;font-size:14px;resize:vertical;font-family:inherit}
.map-comments textarea:focus{outline:none;border-color:#ffc832}
.map-comments .mc-actions{display:flex;gap:8px;margin-top:6px;align-items:center}
.map-comments .mc-actions button{padding:6px 16px;background:#ffc832;color:#0a0a0f;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px}

<script>
(function authCheck(){
  var h=window.location.hash;
  if(h&&h.includes('access_token=')){
    var p=new URLSearchParams(h.replace('#',''));
    var t=p.get('access_token');
    if(t){
      try{
        var payload=JSON.parse(atob(t.split('.')[1]));
        localStorage.setItem('abi_token',t);
        localStorage.setItem('abi_user',payload.email||payload.user_metadata?.email||'');location.reload();
        history.replaceState(null,'',window.location.pathname);
      }catch(err){}
    }
  }
})();

  {cat:"保险箱", items:[

    {id:"军用主机",name:"军用主机",ic:"../assets/icons/军用主机.png"},
    {id:"家用机箱",name:"家用机箱",ic:"../assets/icons/家用机箱.png"},
  ]},
  {cat:"衣服", items:[
    {id:"小衣服",name:"小衣服",ic:"../assets/icons/小衣服.png"},

// 平铺所有 item 方便查找
var TYPE={},ALL_ITEMS=[];
TYPES.forEach(function(g){g.items.forEach(function(t){TYPE[t.id]=t;ALL_ITEMS.push(t);});});
var layerSt={};ALL_ITEMS.forEach(function(t){layerSt[t.id]=true;});
var pins=[],curPinIdx=null,mode="view",pp=null,scale=1,panX=0,panY=0,dg=false,dx=0,dy=0,sx=0,sy=0;
var mapComments=[];
var mv=document.getElementById("mv");

function renderLayers(){
  var list=document.getElementById("lp");list.innerHTML="";
  // 全选按钮
  var allOn=true;ALL_ITEMS.forEach(function(t){if(!layerSt[t.id])allOn=false;});
  var al=document.createElement("label");al.className="all-label";
  var ac=document.createElement("input");ac.type="checkbox";ac.checked=allOn;
  ac.onchange=function(){var v=ac.checked;ALL_ITEMS.forEach(function(t){layerSt[t.id]=v;});renderMarkers();renderLayers();};
  al.appendChild(ac);al.appendChild(document.createTextNode(" 全选"));list.appendChild(al);
  // 分组卡片
  TYPES.forEach(function(g){
    var card=document.createElement("div");card.className="ly-card";
    // 组标题 + 组全选
    var hdr=document.createElement("div");hdr.className="ly-card-hdr";
    var hc=document.createElement("input");hc.type="checkbox";
    var gAllOn=true;g.items.forEach(function(t){if(!layerSt[t.id])gAllOn=false;});
    hc.checked=gAllOn;
    hc.onchange=function(){var v=hc.checked;g.items.forEach(function(t){layerSt[t.id]=v;});renderMarkers();renderLayers();};
    var ht=document.createElement("span");ht.textContent=g.cat;
    hdr.appendChild(hc);hdr.appendChild(ht);card.appendChild(hdr);
    // 组内项目
    g.items.forEach(function(t){
      if(layerSt[t.id]===undefined)layerSt[t.id]=false;
      var la=document.createElement("label");
      var cb=document.createElement("input");cb.type="checkbox";cb.checked=layerSt[t.id];
      cb.onchange=(function(id){return function(){layerSt[id]=cb.checked;renderMarkers();};})(t.id);
      la.appendChild(cb);
      var isEmoji=t.ic&&t.ic.indexOf("emoji:")===0;
      if(isEmoji){
        var sp=document.createElement("span");sp.className="ly-icon e";sp.textContent=t.ic.replace("emoji:","");la.appendChild(sp);
      }else{
        var im=document.createElement("img");im.className="ly-icon";im.src=t.ic;la.appendChild(im);
      }
      la.appendChild(document.createTextNode(t.name));card.appendChild(la);
    });
    list.appendChild(card);
  });
}
document.getElementById("lbb").onclick=function(){document.getElementById("lp").classList.toggle("show");renderLayers();};
document.addEventListener("click",function(e){var el=document.getElementById("lp"),btn=document.getElementById("lbb");if(el.classList.contains("show")&&!el.contains(e.target)&&e.target!==btn)el.classList.remove("show");});

function renderMarkers(){
  var box=document.getElementById("mb");
  if(!box){box=document.createElement("div");box.id="mb";box.style.cssText="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none";document.querySelector(".map-wrap img").parentNode.appendChild(box);}
  box.innerHTML="";
  pins.forEach(function(p,i){
    if(layerSt[p.type]===false)return;
    var el=document.createElement("div");
    var td=TYPE[p.type]||{name:p.name,ic:p.ic||"emoji:❓"};
    var ic=td.ic||p.ic;
    var isEmoji=ic&&ic.indexOf("emoji:")===0;
    if(isEmoji){
      el.className="pin-el";el.style.cssText="position:absolute;font-size:18px;transform:translate(-50%,-50%);left:"+p.x+"%;top:"+p.y+"%;pointer-events:auto;cursor:pointer;z-index:10;text-shadow:0 0 4px rgba(0,0,0,.8)";
      el.textContent=ic.replace("emoji:","");
    }else{
      el.className="pin-el";el.style.cssText="position:absolute;background-image:url("+ic+");background-size:cover;background-position:center;background-color:rgba(0,0,0,.4);border:1.5px solid rgba(0,0,0,.6);border-radius:5px;transform:translate(-50%,-50%);left:"+p.x+"%;top:"+p.y+"%;pointer-events:auto;cursor:pointer;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.5)";el.style.width="28px";el.style.height="28px";
    }
    el.title=p.name;
    el.onclick=(function(idx){return function(e){e.stopPropagation();showPinDetail(idx);};})(i);
    box.appendChild(el);
  });
}

function updateTransform(){
  mv.style.transform="translate("+panX+"px,"+panY+"px) scale("+scale+")";
  var dots=document.querySelectorAll("#mb .pin-el");
  var sz=28/scale;
  dots.forEach(function(el){
    el.style.width=sz+"px";
    el.style.height=sz+"px";
    el.style.fontSize=Math.max(8,20/scale)+"px";
    el.style.borderWidth=Math.max(0.3,1.5/scale)+"px";
    el.style.borderRadius=Math.max(1,5/scale)+"px";
  });
}
function zoom(f){
  var ns=Math.min(8,Math.max(0.2,scale*f));
  if(ns===scale)return;
  var vp=mv.parentElement;
  var cx=vp.clientWidth/2,cy=vp.clientHeight/2;
  var ix=(cx-panX)/scale,iy=(cy-panY)/scale;
  scale=ns;panX=cx-ix*scale;panY=cy-iy*scale;
  updateTransform();
  document.getElementById("zr").value=Math.round(scale*100);
  document.getElementById("zl").textContent=Math.round(scale*100)+"%";
}
function zoomTo(v){
  scale=v/100;panX=0;panY=0;updateTransform();
  document.getElementById("zl").textContent=Math.round(scale*100)+"%";
}
function resetView(){
  scale=1;panX=0;panY=0;updateTransform();
  document.getElementById("zr").value=100;document.getElementById("zl").textContent="100%";
}
document.querySelector(".map-wrap").addEventListener("wheel",function(e){
  e.preventDefault();
  var r=mv.parentElement.getBoundingClientRect();
  var cx=e.clientX-r.left,cy=e.clientY-r.top;
  var ns=scale*(e.deltaY<0?1.1:0.91);
  ns=Math.min(8,Math.max(0.2,ns));
  if(ns===scale)return;
  var ix=(cx-panX)/scale,iy=(cy-panY)/scale;
  scale=ns;panX=cx-ix*scale;panY=cy-iy*scale;
  updateTransform();
  document.getElementById("zr").value=Math.round(scale*100);

function initAuthFromToken(tok){
  try{

    var b64=parts[1].replace(/-/g,"+").replace(/_/g,"/");
    var raw=atob(b64);
    var payload=JSON.parse(raw);
    if(payload&&payload.user_metadata){
      currentUser={id:payload.sub,user_metadata:payload.user_metadata};
      localStorage.setItem("abi_user",JSON.stringify(currentUser));
      updateAuthUI();
    }
  }catch(e){}
}

function supabase(t,m,b,q){
  var u=SUPABASE_URL+"/rest/v1/"+t;if(q)u+="?"+q;
  var tk=localStorage.getItem("abi_token");
  var token=SUPABASE_ANON_KEY;
  if(tk){
    try{
      var p=JSON.parse(atob(tk.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
      if(p.exp&&p.exp*1000>Date.now())token=tk;
    }catch(e){}
  }
  var o={method:m||"GET",headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+token,"Content-Type":"application/json"}};
  if(b&&m!=="GET")o.body=JSON.stringify(b);
  return fetch(u,o).then(function(r){
    if(!r.ok){throw new Error("HTTP "+r.status+" for "+t);}
    return r.json().catch(function(){return [];});
  });
}

function addPinImages(files){
  if(curPinIdx===null||!files.length)return;
  var done=0,total=files.length;
  for(var i=0;i<files.length;i++){
    (function(file){
      var reader=new FileReader();
      reader.onload=function(e){
        pins[curPinIdx].images.push(e.target.result);
        done++;
        if(done===total){savePins();renderPinImages();}
      };
      reader.readAsDataURL(file);
    })(files[i]);
  }
}

function jumpToFromUrl(){
  var s=new URLSearchParams(window.location.search);
  var x=s.get("x"),y=s.get("y"),name=s.get("name"),type=s.get("type"),ic=s.get("ic");
  if(!x||!y)return;
  var xf=parseFloat(x),yf=parseFloat(y);
  // Zoom to 800% and center on the point
  scale=8;
  var container=document.querySelector(".map-wrap");
  var r=container.getBoundingClientRect();
  var centerX=r.width/2,centerY=r.height/2;
  var img=document.getElementById("mapImg");
  var iw=img.clientWidth,ih=img.clientHeight;
  panX=centerX-xf/100*iw*scale;
  panY=centerY-yf/100*ih*scale;
  updateTransform();
  document.getElementById("zr").value=800;
  document.getElementById("zl").textContent="800%";
  // Add a temporary marker pin at the target location
  addTempMarker(xf,yf,ic);
  // If we have name+type+ic, show floating info card (no pin detail popup)
  if(name){
    showPinInfo(xf,yf,name,type,ic);
    return;
  }
  // Try to find matching pin
  for(var i=0;i<pins.length;i++){
    var d=Math.abs(pins[i].x-xf)+Math.abs(pins[i].y-yf);
    if(d<3){showPinDetail(i);return;}
  }
  pp={x:xf,y:yf};
  showPicker();
}

// Show a non-editable pin info popup (for review center jumps)
// Add a temporary red marker dot at percentage coords
function addTempMarker(x,y,ic){
  var box=document.getElementById("mb")||document.querySelector(".map-wrap div:last-child");
  if(!box)return;
  var s=1/scale; // inverse scale: at 800% (scale=8), show 1/8 size
  var el=document.createElement("div");
  if(ic){
    el.style.cssText="position:absolute;left:"+x+"%;top:"+y+"%;transform:translate(-50%,-50%);width:"+(48*s)+"px;height:"+(48*s)+"px;z-index:999;pointer-events:none;background-image:url("+ic+");background-size:cover;border:"+(2*s)+"px solid #ff4444;border-radius:"+(5*s)+"px;box-shadow:0 0 "+(12*s)+"px rgba(255,0,0,.6)";
  }else{
    el.style.cssText="position:absolute;left:"+x+"%;top:"+y+"%;transform:translate(-50%,-50%);width:"+(24*s)+"px;height:"+(24*s)+"px;z-index:999;pointer-events:none;background:#ff4444;border:"+(3*s)+"px solid #fff;border-radius:50%;box-shadow:0 0 "+(12*s)+"px rgba(255,0,0,.6)";
  }
  box.appendChild(el);
  // Pulsing animation via keyframe
  var sty=document.createElement("style");
  sty.textContent="@keyframes pulseMarker{0%{opacity:1}50%{opacity:0.4}100%{opacity:1}}";
  if(!document.getElementById("pulseStyle")){sty.id="pulseStyle";document.head.appendChild(sty);}
  el.style.animation="pulseMarker 1.5s infinite";
}
