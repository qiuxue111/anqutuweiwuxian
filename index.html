<script>if(location.hash.indexOf('access_token')>=0||location.search.indexOf('access_token')>=0){
  var raw=(location.hash||location.search).replace(/^[#?]/,'');
  var idx=raw.indexOf('access_token=');
  if(idx>=0){
    var t=raw.substring(idx+13);
    var amp=t.indexOf('&');
    if(amp>=0)t=t.substring(0,amp);
    try{
      var b64=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
      while(b64.length%4)b64+='=';
      localStorage.setItem('abi_token',t);
      localStorage.setItem('abi_user',JSON.stringify(JSON.parse(atob(b64))));
      history.replaceState(null,'',location.pathname+location.search);
      location.href=location.pathname+location.search;
    }catch(e){}
  }
}</script>

  var auth=useToken&&token?'Bearer '+token:'Bearer '+SUPABASE_ANON;

async function openPostModal(postId){
  var token=localStorage.getItem('abi_token');

    document.getElementById('modalBody').textContent=p.content||'';
    document.getElementById('modalAuthor').textContent=(p.author||'\u533f\u540d');
    document.getElementById('modalDate').textContent=p.created_at?new Date(p.created_at).toLocaleDateString('zh-CN'):'';

    var catNames={'general':'\u6742\u8c08','question':'\u95ee\u7b54','guide':'\u653b\u7565','showoff':'\u70ab\u8000'};
    var cn=catNames[cat]||'\u6742\u8c08';
    var hue=cat==='guide'?'#4a9eff':cat==='question'?'#ff6b6b':cat==='showoff'?'#ffc832':'#888';

    var imgEl=document.getElementById('modalImages');

    if(!el)return;
    if(!comments||comments.length===0){
      el.innerHTML='<div style="color:#555;font-size:0.8rem;padding:4px 0;">暂无评论</div>';
      return;
    }
    var userName=getUserName();
    var token=localStorage.getItem('abi_token');
    el.innerHTML=comments.map(function(c){
      var delBtn=(token&&c.author===userName)?'<button style="background:none;border:none;color:#f55;font-size:0.65rem;cursor:pointer;margin-left:8px;" onclick="deleteComment('+c.id+',\''+containerId+'\','+postId+')">删除</button>':'';
      var cimgs=(c.images&&typeof c.images==='string')?JSON.parse(c.images):[];
      var cimgHTML=cimgs.length?'<div style="display:flex;gap:4px;margin-top:2px;">'+cimgs.map(function(u){return '<img src="'+u+'" style="max-width:80px;max-height:60px;border-radius:4px;object-fit:cover;cursor:pointer;border:1px solid #1e1e2a;" onclick="window.open(this.src)">';}).join('')+'</div>':'';
      return '<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);">'+
        '<span style="color:#ffc832;font-size:0.8rem;white-space:nowrap;">'+esc(c.author)+'</span>'+
        '<div style="flex:1;"><span style="color:#ccc;font-size:0.85rem;">'+esc(c.content)+'</span>'+cimgHTML+'</div>'+
        '<span style="color:#555;font-size:0.65rem;">'+(c.created_at?new Date(c.created_at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'')+'</span>'+
        delBtn+'</div>';
    }).join('');
  }catch(e){}
}

async function deleteComment(commentId, containerId, postId){
  if(!confirm('确定删除这条评论？'))return;
  try{
    var r=await fetch(SUPABASE_URL+'/rest/v1/rpc/delete_my_comment',{
      method:'POST',
      headers:{'apiKey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({comment_id:commentId})
    });
    if(r.ok||r.status===204){
      alert('评论已删除');
      loadComments(postId, containerId);
    }else alert('删除评论失败');
  }catch(e){alert('删除失败: '+e.message);}
}

async function deletePostFromModal(){
  if(!confirm('确定删除这条帖子？'))return;
  try{
    var r=await fetch(SUPABASE_URL+'/rest/v1/rpc/delete_my_post',{
      method:'POST',
      headers:{'apiKey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({post_id:currentModalPostId})
    });
    if(r.ok||r.status===204){
      alert('\uD83D\uDDD1 帖子已删除');
      closePostModal();
      loadHotPosts();
    }else alert('删除失败');
  }catch(e){alert('删除失败: '+e.message);}
}

function previewCommentFiles(input){
  var preview=document.getElementById('commentFilePreview');
  if(!preview)return;
  if(!input.files||!input.files.length){preview.innerHTML='';return;}
  preview.innerHTML='';
  for(var i=0;i<input.files.length;i++){
    (function(file){
      var reader=new FileReader();
      reader.onload=function(e){
        var img=document.createElement('img');
        img.style.cssText='width:50px;height:50px;border-radius:4px;object-fit:cover;border:1px solid #1e1e2a;';
        img.src=e.target.result;
        preview.appendChild(img);
      };
      reader.readAsDataURL(file);
    })(input.files[i]);
  }
}

</script>

<div id="postModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:10000;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow-y:auto;">
  <div class="modal-content">
    <button class="close-btn" onclick="closePostModal()">✕</button>
    <h2 id="modalTitle"></h2>
    <div class="post-meta">
      <span id="modalCategory" style="font-size:0.7rem;padding:2px 6px;border-radius:4px;"></span>
      <span id="modalAuthor"></span>
      <span id="modalDate"></span>
      <span id="modalLikes" class="like-btn" onclick="toggleLike()">❤️ 0</span>
      <button id="modalDelBtn" style="margin-left:auto;padding:2px 8px;background:#3a1a1a;color:#f66;border:none;border-radius:4px;cursor:pointer;font-size:0.7rem;display:none;" onclick="deletePostFromModal()">删除</button>
    </div>
    <div id="modalImages" class="post-images"></div>
    <div id="modalBody" class="post-body"></div>
    <h4>💬 评论</h4>
    <div id="modalComments" class="post-comments"></div>
    <div style="display:flex;gap:6px;align-items:center;margin-top:8px;">
      <input id="modalCommentInput" placeholder="输入评论..." style="flex:1;padding:8px 12px;background:#1a1a22;color:#fff;border:1px solid #333;border-radius:8px;font-size:0.85rem;" onkeydown="if(event.key==='Enter')addCommentFromModal()">
      <button class="file-btn" style="width:34px;height:34px;border-radius:50%;background:rgba(255,200,50,0.12);color:#ffc832;border:1px solid rgba(255,200,50,0.15);font-size:1.2rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;" onclick="document.getElementById('commentImages').click()">+</button>
      <input id="commentImages" type="file" accept="image/*" multiple style="display:none;" onchange="previewCommentFiles(this)">
      <button style="padding:8px 16px;background:#ffc832;color:#0a0a0f;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:0.85rem;" onclick="addCommentFromModal()">评论</button>
    </div>
    <div id="commentFilePreview" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;"></div>
  </div>
</div>

<!-- ===== 感谢名单 ===== -->
<div id="thanksSection" style="margin-top:3rem;padding:2rem 0;border-top:1px solid rgba(255,255,255,0.04);">
  <h2 style="color:#ffc832;font-size:1.1rem;margin-bottom:1.5rem;text-align:center;">🎉 感谢名单</h2>
  <div id="thanksContainer" style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:60px;"></div>
</div>

<!-- 编辑按钮（仅管理员可见） -->
<div id="thanksEditBtn" style="display:none;position:fixed;right:16px;bottom:16px;z-index:9999;width:48px;height:48px;border-radius:50%;background:rgba(255,200,50,0.15);border:1px solid rgba(255,200,50,0.25);color:#ffc832;font-size:1.4rem;cursor:pointer;align-items:center;justify-content:center;" onclick="openThanksEditor()">✏️</div>

<!-- 编辑弹窗 -->
<div id="thanksEditor" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:10001;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow-y:auto;">
  <div style="max-width:550px;margin:60px auto;background:#12121a;border:1px solid #1e1e2a;border-radius:14px;padding:1.5rem;position:relative;">
    <button class="close-btn" onclick="closeThanksEditor()" style="position:absolute;top:12px;right:14px;background:none;border:none;color:#888;font-size:1.5rem;cursor:pointer;">✕</button>
    <h2 style="color:#ffc832;margin:0 0 1rem 0;font-size:1.1rem;">✏️ 编辑感谢名单</h2>
    <div id="thanksEditorList"></div>
    <button onclick="addThanksMember()" style="width:100%;padding:10px;background:rgba(255,200,50,0.1);border:1px dashed rgba(255,200,50,0.3);border-radius:8px;color:#ffc832;cursor:pointer;font-size:0.9rem;margin-top:8px;">+ 添加成员</button>
    <div style="display:flex;gap:8px;margin-top:1rem;justify-content:flex-end;">
      <button onclick="closeThanksEditor()" style="padding:8px 20px;background:transparent;border:1px solid #333;border-radius:6px;color:#ccc;cursor:pointer;">取消</button>
      <button onclick="saveThanksMembers()" style="padding:8px 20px;background:#ffc832;border:none;border-radius:6px;color:#0a0a0f;cursor:pointer;font-weight:600;">保存</button>
    </div>
  </div>
</div>

<script>
// ===== 感谢名单 =====
var ADMINS=['qiuxue111'];

function isAdmin(){
  try{
    var u=localStorage.getItem('abi_user');
    if(!u)return false;
    var p=JSON.parse(u);
    var name=p.user_metadata&&p.user_metadata.preferred_username||p.user_metadata&&p.user_metadata.user_name||p.email||'';
    return name&&ADMINS.indexOf(name)>=0;
  }catch(e){return false;}
}

var thanksData = [];

async function loadThanks(){
  try{
    var r=await db('GET','thanks_members',null,'order=sort_order.asc');
    if(!r.ok)throw new Error(r.status);
    thanksData=await r.json();
    renderThanks();
  }catch(e){console.log('loadThanks:',e.message);}
}

function renderThanks(){
  var el=document.getElementById('thanksContainer');
  if(!el||!thanksData||!thanksData.length){
    if(el)el.innerHTML='<span style="color:#555;font-size:0.85rem;">暂无感谢名单</span>';
    return;
  }
  el.innerHTML=thanksData.map(function(m){
    var hasLink=m.link&&m.link.trim();
    return '<div class="thanks-ball" onclick="showThanksDetail('+i+')" style="width:60px;height:60px;border-radius:50%;background:rgba(255,200,50,0.1);border:1px solid rgba(255,200,50,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s;font-size:0.75rem;color:#ffc832;text-align:center;word-break:break-all;padding:4px;position:relative;animation:thanksBounce 2s ease-in-out infinite;overflow:hidden;" title="'+esc(m.detail||'')+'">'+esc(m.name)+'</div>';
  }).join('');
}

// 动画
var styleSheet=document.createElement('style');
styleSheet.textContent='@keyframes thanksBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.thanks-ball:hover{background:rgba(255,200,50,0.2)!important;transform:scale(1.1);box-shadow:0 0 20px rgba(255,200,50,0.15)}';
document.head.appendChild(styleSheet);

// 详情弹窗
function showThanksDetail(idx){
  var m=thanksData[idx];
  if(!m)return;
  if(m.link&&m.link.trim()){
    window.open(m.link);
    return;
  }
  var msg=m.detail||'暂无介绍';
  // Simple modal
  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;z-index:10002;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);';
  overlay.onclick=function(){document.body.removeChild(overlay);};
  var box=document.createElement('div');
  box.style.cssText='background:#12121a;border:1px solid #1e1e2a;border-radius:14px;padding:2rem;max-width:400px;text-align:center;';
  box.onclick=function(e){e.stopPropagation();};
  box.innerHTML='<div style="width:60px;height:60px;border-radius:50%;background:rgba(255,200,50,0.1);border:1px solid rgba(255,200,50,0.2);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;color:#ffc832;font-size:0.85rem;">'+esc(m.name)+'</div>'+
    '<div style="color:#ccc;font-size:0.9rem;margin-bottom:1.5rem;">'+esc(msg)+'</div>'+
    '<button onclick="document.body.removeChild(this.parentNode.parentNode.parentNode)" style="padding:6px 20px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#ccc;cursor:pointer;font-size:0.8rem;">关闭</button>';
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

// 编辑功能
function openThanksEditor(){
  var el=document.getElementById('thanksEditor');
  if(!el)return;
  el.style.display='block';
  renderEditorList();
}

function closeThanksEditor(){
  // Reload from server (discard local changes)
  document.getElementById('thanksEditor').style.display='none';
  document.body.style.overflow='';
  loadThanks();
}

function renderEditorList(){
  var el=document.getElementById('thanksEditorList');
  if(!el)return;
  document.body.style.overflow='hidden';
  if(!thanksData||!thanksData.length){
    el.innerHTML='<div style="color:#555;font-size:0.85rem;text-align:center;padding:1rem;">名单为空，点击下方添加</div>';
    return;
  }
  el.innerHTML=thanksData.map(function(m,i){
    return '<div style="background:rgba(20,20,30,0.6);border:1px solid rgba(255,255,255,0.05);border-radius:10px;padding:12px;margin-bottom:8px;">'+
      '<div style="display:flex;gap:8px;align-items:center;">'+
      '<input value="'+esc(m.name)+'" placeholder="名字" style="flex:1;padding:6px 10px;background:#1a1a22;color:#fff;border:1px solid #333;border-radius:6px;font-size:0.85rem;" oninput="thanksData['+i+'].name=this.value">'+
      '<button onclick="removeThanksMember('+i+')" style="padding:4px 10px;background:rgba(255,50,50,0.15);border:1px solid rgba(255,50,50,0.3);border-radius:4px;color:#f55;cursor:pointer;font-size:0.75rem;">删除</button>'+
      '</div>'+
      '<input value="'+esc(m.detail||'')+'" placeholder="详细介绍（悬停显示）" style="width:100%;margin-top:6px;padding:6px 10px;background:#1a1a22;color:#aaa;border:1px solid #333;border-radius:6px;font-size:0.8rem;" oninput="thanksData['+i+'].detail=this.value">'+
      '<input value="'+esc(m.link||'')+'" placeholder="跳转链接（可选）" style="width:100%;margin-top:4px;padding:6px 10px;background:#1a1a22;color:#888;border:1px solid #333;border-radius:6px;font-size:0.8rem;" oninput="thanksData['+i+'].link=this.value">'+
      '</div>';
  }).join('');
}

function addThanksMember(){
  if(!thanksData)thanksData=[];
  thanksData.push({name:'新成员',detail:'',link:''});
  renderEditorList();
}

function removeThanksMember(idx){
  if(!confirm('确定移除此成员?'))return;
  thanksData.splice(idx,1);
  renderEditorList();
}

async function saveThanksMembers(){
  var token=localStorage.getItem('abi_token');
  if(!token){alert('请先登录后再保存');return;}
  try{
    // First get all existing IDs
    var getAll=await fetch(SUPABASE_URL+'/rest/v1/thanks_members?select=id',{
      headers:{'Authorization':'Bearer '+token,'apiKey':SUPABASE_ANON}
    });
    if(!getAll.ok)throw new Error('fetch ids: '+getAll.status);
    var existing=await getAll.json();
    // Delete each one individually (Supabase requires WHERE clause)
    for(var di=0;di<existing.length;di++){
      var dd=await fetch(SUPABASE_URL+'/rest/v1/thanks_members?id=eq.'+existing[di].id,{
        method:'DELETE',
        headers:{'Authorization':'Bearer '+token,'apiKey':SUPABASE_ANON,'Content-Type':'application/json'}
      });
      if(!dd.ok&&dd.status!==204)throw new Error('delete id='+existing[di].id+': '+dd.status);
    }
    // Insert all
    for(var i=0;i<thanksData.length;i++){
      var m=thanksData[i];
      var r=await fetch(SUPABASE_URL+'/rest/v1/thanks_members',{
        method:'POST',
        headers:{'Authorization':'Bearer '+token,'apiKey':SUPABASE_ANON,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify({name:m.name,detail:m.detail||'',link:m.link||'',sort_order:i})
      });
      if(!r.ok)throw new Error('insert '+i+': '+r.status+' '+await r.text().catch(function(){return'';}));
    }
    closeThanksEditor();
    loadThanks();
    alert('保存成功');
  }catch(e){alert('保存失败: '+e.message);}
}

// 管理员可见编辑按钮
(function(){
  setTimeout(function(){
    var btn=document.getElementById('thanksEditBtn');
    if(btn)btn.style.display=isAdmin()?'flex':'none';
  },600);
  loadThanks();
})();
</script>

</body>
