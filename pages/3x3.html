<!DOCTYPE html>
<html lang="zh-CN">
<head><meta name="robots" content="noindex">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画布看板 - 暗区突围：无限</title>
<link rel="icon" href="../favicon.ico" type="image/jpeg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#ffc832;--bg-page:#0a0a0f;--text-body:#ddd;--card-bg:rgba(20,20,30,.75);--btn-blue-text:#4a9eff;--btn-red-text:#ff6b6b;--btn-green-text:#51cf66;--btn-purple-text:#cc5de8}
body{background:var(--bg-page);color:var(--text-body);font-family:-apple-system,"Microsoft YaHei",sans-serif;overflow:hidden;user-select:none}

/* 深色主题星空背景（仿主页） */
.scene-starry{position:fixed;inset:0;z-index:0;pointer-events:none}
.scene-starry .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--dur) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0.1}50%{opacity:0.8}}
.scene-clean{display:none}

/* 顶栏 */
.app-bar{position:fixed;top:0;left:0;right:0;z-index:1000;background:color-mix(in srgb, var(--bg-page) 95%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid #222;display:flex;align-items:center;padding:8px 16px;gap:12px;height:48px}
.app-bar .app-title{color:var(--accent);font-size:20px;font-weight:700;flex:1;white-space:nowrap;text-shadow:0 0 12px rgba(255,200,50,0.3)}
.app-bar .btn{padding:4px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px;white-space:nowrap}
.btn-edit{background:color-mix(in srgb, var(--accent) 15%, #1a1a22);color:var(--accent)}
.btn-save{background:#1a4a1a;color:#4f4}
.btn-cancel{background:#3a1a1a;color:#f44}
.btn-add-card{background:#1a3a1a;color:#4f4}
.bg-switch{background:#1e1e2a;color:#88aaff;padding:4px 10px;border-radius:6px;border:none;cursor:pointer;font-size:13px;white-space:nowrap;transition:background .15s}
.bg-switch:hover{background:color-mix(in srgb, var(--accent) 15%, #1a1a22);color:var(--accent)}

/* 画布切换面板 */
.canvas-panel{display:none;position:fixed;top:52px;left:50px;z-index:9998;background:rgba(0,0,0,0.9);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:9px;padding:6px;min-width:200px;box-shadow:0 4px 24px rgba(0,0,0,0.5)}
.canvas-panel.show{display:block}
.cp-list{max-height:400px;overflow-y:auto}
.cp-item{padding:6px 10px;color:#ccc;font-size:12px;cursor:pointer;border-radius:5px;display:flex;align-items:center;gap:6px}
.cp-item:hover{background:rgba(255,255,255,0.06);color:#fff}
.cp-item.active{color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, transparent)}
.cp-del{cursor:pointer;color:#555;margin-left:auto;padding:0 4px;font-size:11px}
.cp-del:hover{color:#f66}
.cp-add{padding:6px 10px;color:#6f6;font-size:12px;cursor:pointer;border-radius:5px}
.cp-add:hover{background:rgba(100,255,100,0.08)}
.cp-rename{padding:6px 10px;color:var(--accent);font-size:12px;cursor:pointer;border-radius:5px}
.cp-rename:hover{background:rgba(255,200,50,0.08)}

/* 视口 */
.viewport{position:fixed;top:48px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
.viewport.dragging{cursor:grabbing}
.canvas{position:absolute;top:0;left:0;transform-origin:0 0;width:200vw;height:200vh;background:#111;background-image:radial-gradient(circle at 25px 25px,rgba(100,130,200,0.12) 2px,transparent 2px);background-size:40px 40px;min-width:100000px;min-height:100000px}

/* 卡片 - 固定宽高 300×260 */
.card{position:absolute;width:300px;height:260px;background:var(--card-bg,rgba(20,20,30,.75));border:1.5px solid rgba(255,255,255,.08);border-radius:14px;cursor:pointer;z-index:2;overflow:hidden;transition:box-shadow .2s,border-color .2s;display:flex;flex-direction:column}
.card:hover{box-shadow:0 0 20px color-mix(in srgb, var(--accent) 18%, transparent);border-color:color-mix(in srgb, var(--accent) 30%, transparent)}
.card.selected{border-color:var(--accent)!important;box-shadow:0 0 30px color-mix(in srgb, var(--accent) 40%, transparent)!important}
/* 图片卡片 */
.card-image{width:300px;height:260px;position:absolute;border-radius:14px;overflow:hidden;cursor:pointer;z-index:2;border:1.5px solid rgba(255,255,255,.08);background:#111}
.card-image:hover{border-color:color-mix(in srgb, var(--accent) 30%, transparent);box-shadow:0 0 20px color-mix(in srgb, var(--accent) 18%, transparent)}
.card-image.selected{border-color:var(--accent)!important;box-shadow:0 0 30px color-mix(in srgb, var(--accent) 40%, transparent)!important}
.card-image img{width:100%;height:100%;object-fit:cover;display:block}
.card-image .img-title{position:absolute;bottom:0;left:0;right:0;padding:8px 12px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font-size:14px;font-weight:700;text-align:center;letter-spacing:.5px;pointer-events:none}
.card-image .card-actions-bar{position:absolute;top:6px;right:6px;z-index:10;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.card-image:hover .card-actions-bar{opacity:1}
/* 小标题卡片 */
.card-title-only{width:300px;height:130px;position:absolute;border-radius:14px;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1.5px solid rgba(255,255,255,.08);background:var(--card-bg,rgba(20,20,30,.75))}
.card-title-only:hover{border-color:color-mix(in srgb, var(--accent) 30%, transparent);box-shadow:0 0 20px color-mix(in srgb, var(--accent) 18%, transparent)}
.card-title-only.selected{border-color:var(--accent)!important;box-shadow:0 0 30px color-mix(in srgb, var(--accent) 40%, transparent)!important}
.card-title-only .cto-title{text-align:center;padding:10px 16px;font-weight:900;letter-spacing:2px;word-break:break-word;line-height:1.3;max-height:120px;overflow:hidden;transition:text-shadow .2s}
.card-title-only .card-actions-bar{position:absolute;top:6px;right:6px;z-index:10;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.card-title-only:hover .card-actions-bar{opacity:1}
/* 弹窗 - 图片/标题卡片编辑 */
.modal .card-type-tabs{display:flex;gap:8px;margin-bottom:14px}
.modal .card-type-tabs button{padding:5px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#aaa;cursor:pointer;font-size:12px}
.modal .card-type-tabs button.active{background:color-mix(in srgb, var(--accent) 15%, transparent);border-color:var(--accent);color:var(--accent);font-weight:600}
.modal .img-upload-area{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px;border:2px dashed rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.02);margin:8px 0}
.modal .img-upload-area.dragover{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 5%, transparent)}
.modal .img-upload-area img{max-width:100%;max-height:180px;border-radius:8px;object-fit:contain}
.modal .img-upload-area .upload-hint{color:#666;font-size:12px}
.modal .img-upload-area .upload-btn{padding:6px 20px;border-radius:6px;border:1px solid var(--accent);background:color-mix(in srgb, var(--accent) 15%, transparent);color:var(--accent);cursor:pointer;font-size:13px}
.modal .img-upload-area .upload-btn:hover{background:color-mix(in srgb, var(--accent) 30%, transparent)}
.modal .title-style-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0;padding:10px;background:rgba(255,255,255,.03);border-radius:8px}
.modal .title-style-controls label{font-size:11px;color:#888;margin:0}
.modal .title-style-controls input,.modal .title-style-controls select{width:100%;padding:4px 6px;background:rgba(255,255,255,.05);border:1px solid #333;border-radius:5px;color:#ddd;font-size:12px;outline:none}
.modal .title-style-controls input[type="color"]{height:30px;padding:2px;cursor:pointer}


/* 卡片操作按钮 */
.card-actions-bar{position:absolute;top:6px;right:6px;z-index:10;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.card:hover .card-actions-bar{opacity:1}
.card.ca{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:5px;color:#aaa;cursor:pointer;padding:2px 6px;font-size:11px}
.card.ca:hover{color:var(--accent);background:color-mix(in srgb, var(--accent) 15%, transparent)}
.card.ca-del:hover{color:#f44;background:rgba(255,50,50,.15)}

/* 卡片标题 */
.card-title{padding:12px 14px 6px;font-size:17px;font-weight:700;color:var(--text-body,#fff);text-align:center;letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}

/* 卡片子内容 - 可换行滚动 */
.card-body{flex:1;padding:6px 14px 8px;font-size:12px;color:var(--text-body,#999);line-height:1.6;overflow-y:auto;word-break:break-word;white-space:pre-wrap}


/* 子任务卡片 */
.card-subtask{padding:10px 14px;margin:4px 0;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04);border-radius:8px;cursor:pointer;font-size:14px;color:var(--text-body,#ccc);transition:all .15s;white-space:pre-wrap;word-break:break-word;line-height:1.4}
.card-subtask:hover{background:rgba(255,255,255,.06);border-color:var(--accent);color:var(--accent)}
.card-subtask:first-child{margin-top:0}
.card-subtask:last-child{margin-bottom:0}

.card-body::-webkit-scrollbar{width:3px}
.card-body::-webkit-scrollbar-thumb{background:#333;border-radius:2px}

/* 卡片底部 - 评论计数 */
.card-footer{padding:4px 14px 8px;border-top:1px solid rgba(255,255,255,.04);flex-shrink:0;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-body,#666)}
.card-footer .comment-icon{font-size:12px}
.card-footer .comment-count{font-size:11px;color:var(--text-body,#888)}

/* 顶栏底部工具栏 - 编辑时显示 */
.edit-toolbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:none;gap:8px;background:rgba(10,10,15,.92);border:1px solid #333;border-radius:12px;padding:8px 14px;backdrop-filter:blur(8px);white-space:nowrap}
.edit-toolbar button{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;color:#ddd;transition:background .15s;white-space:nowrap}
.edit-toolbar .et-add{background:#1a3a1a;color:#4f4}
.edit-toolbar .et-del-batch{background:#3a1a1a;color:#f66}
.edit-toolbar button:hover{filter:brightness(1.2)}

/* 弹窗 - 编辑卡片 */
.modal-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.8);z-index:9999;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#1a1a24;border:1px solid #333;border-radius:14px;padding:20px;width:460px;max-width:90vw;max-height:85vh;overflow-y:auto}
.modal h2{color:var(--accent);font-size:16px;margin-bottom:14px}
.modal label{display:block;color:#aaa;font-size:12px;margin:8px 0 4px}
.modal input,.modal textarea{width:100%;padding:7px 10px;background:rgba(255,255,255,.05);border:1px solid #333;border-radius:8px;color:#ddd;font-size:13px;outline:none;font-family:inherit}
.modal input:focus,.modal textarea:focus{border-color:var(--accent)}
.modal .btn-row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.modal .btn-row button{padding:6px 16px;border:none;border-radius:6px;cursor:pointer;font-size:12px}
.modal .btn-save-m{background:var(--accent);color:#000;font-weight:600}
.modal .btn-cancel-m{background:rgba(255,255,255,.08);color:#aaa}

/* 弹窗 - 评论区 */
.comment-modal .modal{width:480px}
.comment-modal .comment-list{max-height:300px;overflow-y:auto;margin:10px 0}
.comment-modal .comment-list::-webkit-scrollbar{width:3px}
.comment-modal .comment-list::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.cm-item{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04)}
.cm-item:last-child{border-bottom:none}
.cm-author{font-size:11px;color:var(--accent);margin-bottom:2px}
.cm-content{font-size:12px;color:#ccc;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.cm-time{font-size:10px;color:#555;margin-top:2px}
.cm-input-wrap{display:flex;gap:8px;margin-top:8px}
.cm-input-wrap input{flex:1;padding:7px 10px;background:rgba(255,255,255,.05);border:1px solid #333;border-radius:8px;color:#ddd;font-size:12px;outline:none}
.cm-input-wrap input:focus{border-color:var(--accent)}
.cm-input-wrap button{padding:6px 14px;background:var(--accent);color:#000;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}

/* 缩放信息 */
.zoom-info{position:fixed;bottom:70px;right:20px;z-index:100;color:#555;font-size:11px;background:rgba(10,10,15,.8);padding:4px 10px;border-radius:8px;border:1px solid #222}

/* 汉堡菜单 */
/* 画布区域 */
.card-zone{position:absolute;border-radius:12px;border:1.5px solid rgba(255,255,255,.08);z-index:1;pointer-events:none;display:flex;align-items:flex-start;justify-content:center;padding-top:8px}
.card-zone.zone-edit{pointer-events:auto;cursor:move;border-style:dashed;border-color:rgba(255,200,50,.3)}
.card-zone.zone-edit:hover{border-color:rgba(255,200,50,.6)}
.zone-label{position:absolute;top:-48px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:36px;font-weight:900;letter-spacing:3px;text-shadow:0 0 25px currentColor,0 0 50px currentColor;background:rgba(0,0,0,.5);padding:4px 20px;border-radius:10px;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);z-index:10}
.zone-resize{position:absolute;bottom:4px;right:4px;width:12px;height:12px;background:rgba(255,200,50,.5);border-radius:2px;cursor:nwse-resize}
.zone-del{position:absolute;top:-12px;right:-12px;width:28px;height:28px;border-radius:50%;background:rgba(255,50,50,.85);border:2px solid rgba(255,255,255,.2);color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;z-index:15;pointer-events:auto}
.zone-edit:hover .zone-del{opacity:1}


.hamburger{position:fixed;top:54px;left:8px;z-index:9999;width:30px;height:30px;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.06);border-radius:7px;color:#ccc;cursor:grab;display:flex;align-items:center;justify-content:center;font-size:15px}
.hamburger:active{cursor:grabbing}
.hamburger:hover{background:color-mix(in srgb, var(--accent) 8%, transparent);border-color:var(--accent);color:var(--accent)}
.hamburger-menu{display:none;position:fixed;top:92px;left:8px;z-index:9998;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:9px;padding:8px;min-width:220px;box-shadow:0 4px 24px rgba(0,0,0,0.5)}
.hamburger-menu.show{display:block}
.hm-item{padding:8px 12px;color:#ccc;font-size:13px;cursor:pointer;border-radius:6px}
.hm-item:hover{background:rgba(255,255,255,0.06);color:#fff}
.hm-item.active{color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, transparent)}
.hm-sep{height:1px;background:rgba(255,255,255,0.06);margin:4px 8px}
.hm-group-wrap{margin-bottom:2px}
.hm-group-label{padding:8px 12px;color:#ccc;font-size:13px;border-radius:6px}
.hm-group-label:hover{background:rgba(255,255,255,0.06);color:#fff}
.hm-group-label.active{color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, transparent)}
.hm-sub{max-height:0;overflow:hidden;transition:max-height 0.2s ease}
.hm-sub.open{max-height:300px}
.hm-sub .hm-item{padding:6px 12px 6px 24px;font-size:12px}

.hamburger:active{cursor:grabbing}
.hamburger:hover{background:color-mix(in srgb, var(--accent) 8%, transparent);border-color:var(--accent);color:var(--accent)}
.hamburger-menu{display:none;position:fixed;top:92px;left:8px;z-index:9998;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:9px;padding:8px;min-width:220px;box-shadow:0 4px 24px rgba(0,0,0,0.5)}
.hamburger-menu.show{display:block}
.hm-item{padding:8px 12px;color:#ccc;font-size:13px;cursor:pointer;border-radius:6px}
.hm-item:hover{background:rgba(255,255,255,0.06);color:#fff}
.hm-item.active{color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, transparent)}
.hm-sep{height:1px;background:rgba(255,255,255,0.06);margin:4px 8px}
.loading{position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-page);z-index:9999;color:#666;font-size:14px}

/* 框选 */
.selection-box{position:fixed;border:1.5px solid var(--accent);background:color-mix(in srgb, var(--accent) 8%, transparent);pointer-events:none;z-index:999;display:none}

/* 选择计数 */
.sel-count{display:none;color:var(--accent);font-size:11px;margin-left:8px}
.align-btn{background:#2a2a3a;color:#aaf!important}
.space-btn{background:#2a3a2a;color:#6f6!important}
.arrange-btn{background:#3a2a1a;color:#fc8!important}
/* ── 手机触控专用样式 ── */
@media (max-width: 767px) {
  body.touch-mobile .app-bar{padding:4px 8px;height:40px;gap:6px}
  body.touch-mobile .app-bar .app-title{font-size:14px}
  body.touch-mobile .app-bar .btn{font-size:10px;padding:2px 8px}
  body.touch-mobile .edit-toolbar{bottom:12px;padding:5px 10px;gap:5px;flex-wrap:wrap;justify-content:center;max-width:96vw}
  body.touch-mobile .edit-toolbar button{font-size:10px;padding:4px 8px;white-space:nowrap}
  body.touch-mobile .hamburger{top:46px;left:4px;width:26px;height:26px;font-size:13px}
  body.touch-mobile .hamburger-menu{top:80px;left:4px;min-width:180px}
  body.touch-mobile .hm-item{font-size:12px;padding:6px 10px}
  body.touch-mobile .modal{width:calc(100vw - 16px);min-width:auto;padding:14px;max-width:100vw}
  body.touch-mobile .modal h2{font-size:14px}
  body.touch-mobile .modal input,body.touch-mobile .modal textarea{font-size:12px}
  body.touch-mobile .modal button{font-size:11px}
  body.touch-mobile .canvas-panel{left:4px;top:46px;min-width:140px}
  body.touch-mobile .cp-item{font-size:11px;padding:4px 8px}
  body.touch-mobile .zoom-info{font-size:9px;padding:3px 8px;bottom:60px;right:8px}
  body.touch-mobile .viewport{top:40px!important}
  body.touch-mobile .card{width:220px;height:auto;min-height:180px}
  body.touch-mobile .card-image{width:220px;height:auto;min-height:200px}
  body.touch-mobile .card-title-only{width:220px;height:110px}
  body.touch-mobile .zone-label{font-size:24px;top:-36px}
}
/* ── 手机触控 - 阻止浏览器默认行为 ── */
.touch-mobile{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:none;-webkit-overflow-scrolling:touch}
.touch-mobile .viewport{touch-action:none!important;overscroll-behavior:none}
/* ─── 广告卡片 ─── */
.ad-card{
  position:fixed;
  left:12px;bottom:12px;
  z-index:99998;
  width:200px;
  height:80px;
  background:rgba(10,10,15,0.72);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:8px 12px;
  transition:border-color .2s,box-shadow .2s;
  box-shadow:0 2px 12px rgba(0,0,0,0.4);
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}
.ad-card:hover{border-color:rgba(255,200,50,0.3);box-shadow:0 2px 16px rgba(255,200,50,0.08)}
.ad-card:active{transform:scale(0.97)}
.ad-card img{width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;pointer-events:none}
.ad-card .ad-text{flex:1;min-width:0;pointer-events:none}
.ad-card .ad-text .ad-title{color:#eee;font-size:12px;font-weight:600;line-height:1.3;margin-bottom:2px}
.ad-card .ad-text .ad-desc{color:#888;font-size:10px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ad-card .ad-badge{position:absolute;top:-5px;right:-5px;background:#ffc832;color:#000;font-size:8px;font-weight:700;padding:1px 5px;border-radius:4px;pointer-events:none}

/* ====== 画布切换 ====== */
function renderCanvasPanel(){
  var p = document.getElementById("canvasPanel");
  if(!p.classList.contains("show")) return;
  p.innerHTML = "";
  var list = document.createElement("div");
  list.className = "cp-list";
  canvasList.forEach(function(cv){
    var item = document.createElement("div");
    item.className = "cp-item"+(cv.id===currentCanvas?" active":"");
    item.textContent = cv.label;
    if(cv.id!==currentCanvas){
      var del = document.createElement("span");
      del.className = "cp-del"; del.textContent = "✕";
      (function(cid,clabel){del.onclick=function(e){e.stopPropagation();if(!confirm('确定删除「'+clabel+'」？'))return;deleteCanvasDB(cid).then(function(){canvasList=canvasList.filter(function(x){return x.id!==cid});renderCanvasPanel()}).catch(function(e){console.error(e)})}})(cv.id,cv.label);
      item.appendChild(del);
    }
    (function(cid){item.onclick=function(){p.classList.remove("show");switchCanvas(cid)}})(cv.id);
    list.appendChild(item);
  });
  p.appendChild(list);
  if(canEdit()){
    var addBtn = document.createElement("div");
    addBtn.className = "cp-add"; addBtn.textContent = "+ 新建画布";
    addBtn.onclick = function(){
      var name = prompt("新建画布名称："); if(!name||!name.trim()) return;
      var tk=localStorage.getItem('abi_token'); if(!tk){if(confirm('需要登录。去登录？'))loginGitHub();return;}
      if(canvasList.some(function(x){return x.label===name.trim()})){alert('已存在同名画布');return;}
      var id='cv_'+Date.now();
      canvasList.push({id:id,label:name.trim()});
      fetch(SUPABASE_URL+'/rest/v1/task_canvases',{method:'POST',headers:{'apikey':SUPABASE_ANON,'Content-Type':'application/json'},body:JSON.stringify({id:id,label:name.trim(),color:'#aaa'})}).catch(function(e){console.error(e)});
      renderCanvasPanel();
    };
    p.appendChild(addBtn);
  }
  if(currentCanvas && currentCanvas!=='default'){
    var rnBtn = document.createElement("div");
    rnBtn.className = "cp-rename"; rnBtn.textContent = "✏ 重命名";
    rnBtn.onclick = function(){
      var cv = canvasList.find(function(x){return x.id===currentCanvas}); if(!cv) return;
      var name = prompt("新名称：",cv.label); if(!name||!name.trim()) return;
      if(canvasList.some(function(x){return x.id!==currentCanvas&&x.label===name.trim()})){alert('已存在同名');return;}
      cv.label=name.trim(); var tk=localStorage.getItem('abi_token');
      if(tk) fetch(SUPABASE_URL+'/rest/v1/task_canvases?id=eq.'+encodeURIComponent(currentCanvas),{method:'PATCH',headers:{'apikey':SUPABASE_ANON,'Content-Type':'application/json'},body:JSON.stringify({label:name.trim()})}).catch(function(e){console.error(e)});
      renderCanvasPanel();
    };
    p.appendChild(rnBtn);
  }
}

/* ====== 画布切换按钮 ====== */
function bindCanvasSwitch(){
  document.getElementById("canvasLabel").addEventListener("click",function(e){
    e.stopPropagation();
    var p=document.getElementById("canvasPanel");
    p.classList.toggle("show");
    if(p.classList.contains("show")) renderCanvasPanel();
  });
  document.addEventListener("click",function(e){
    if(!e.target.closest("#canvasLabel")&&!e.target.closest("#canvasPanel")) document.getElementById("canvasPanel").classList.remove("show");
  });
}

function deleteCanvasDB(id){
  var tk=localStorage.getItem('abi_token');if(!tk){if(confirm('需要登录。去登录？'))loginGitHub();return Promise.reject();}
  var h={'apikey':SUPABASE_ANON,'Content-Type':'application/json'};
  return Promise.all([
    fetch(SUPABASE_URL+'/rest/v1/task_cards?canvas_id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:h}),
    fetch(SUPABASE_URL+'/rest/v1/task_connections?canvas_id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:h}),
    fetch(SUPABASE_URL+'/rest/v1/task_comments?card_id=in.('+cards.filter(function(c){return true}).map(function(c){return "'"+c.id+"'"}).join(',')+')',{method:'DELETE',headers:h}).catch(function(){}),
    fetch(SUPABASE_URL+'/rest/v1/task_canvases?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:h})
  ]);
}

function switchCanvas(id){
  if(id===currentCanvas) return;
  currentCanvas = id;
  document.getElementById("canvasLabel").textContent = "";
  var cv = canvasList.find(function(x){return x.id===id});
  if(cv) document.getElementById("canvasLabel").textContent = cv.label;
  loadData();
}

/* ====== 生成星空背景（深色主题） ====== */
function initScene(){
  var bgPage = getComputedStyle(document.documentElement).getPropertyValue('--bg-page').trim();
  var isDark = !bgPage || bgPage.indexOf('08080e')>=0 || bgPage.indexOf('0a0a0f')>=0 || parseInt(bgPage.replace('#',''),16) < 0x222222;
  
  // 移除旧星空
  var old = document.querySelector('.scene-starry');
  if(old) old.remove();
  var oldBg = document.getElementById('themeBg');
  if(oldBg) oldBg.remove();
  
  if(!isDark) return; // 浅色主题留白
  
  // 创建星空容器
  var el = document.createElement('div');
  el.className = 'scene-starry';
  document.body.insertBefore(el, document.body.firstChild);
  
  // 深色渐变背景
  var darkBg = document.createElement('div');
  darkBg.id = 'themeBg';
  darkBg.style.cssText = 'position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 0%,#1a1a2e 0%,#08080e 100%)';
  document.body.insertBefore(darkBg, document.body.firstChild);
  
  // 生成星星
  for(var i=0;i<80;i++){
    var s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = 'left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;width:'+(1+Math.random()*2)+'px;height:'+(1+Math.random()*2)+'px;--dur:'+(2+Math.random()*4)+'s;animation-delay:-'+(Math.random()*4)+'s';
    el.appendChild(s);
  }
}

/* ====== 初始化 ====== */
function init(){
  initScene();
  applyEditVisibility();
  bindCanvasSwitch();
  document.getElementById("loading").style.display = "flex";
  db('GET','task_canvases','','order=created_at').then(function(rows){
    if(rows&&rows.length>0){
      canvasList = rows.map(function(r){return{id:r.id,label:r.label||r.id,color:r.color||'#888'}});
    } else {
      canvasList = [{id:'default',label:'默认画布',color:'var(--accent)'}];
    }
    currentCanvas = canvasList[0].id;
    document.getElementById("canvasLabel").textContent = canvasList[0].label;
    loadData();
  }).catch(function(e){
    console.error('Init error',e);
    canvasList = [{id:'default',label:'默认画布',color:'var(--accent)'}];
    currentCanvas = 'default';
    loadData();
  });
}

/* ====== 数据库操作 ====== */
function loadData(){
  var lp = function(p,t){
    var b = document.getElementById("loadingBar");
    var l = document.getElementById("loadingText");
    var pct = document.getElementById("loadingPercent");
    if(b) b.style.width = Math.min(p,98)+"%";
    if(l && t) l.textContent = t;
    if(pct) pct.textContent = Math.round(p)+"%";
  };
  if(!currentCanvas){document.getElementById("loading").style.display="none";return;}
  document.getElementById("loading").style.display = "flex";
  lp(5,"连接服务器...");
  
  // 请求等待时，进度条慢慢蠕动（给用户真实反馈感）
  var creep = 5;
  var creepTimer = setInterval(function(){
    creep += 0.3 + Math.random() * 0.5;
    if(creep >= 75) { clearInterval(creepTimer); return; }
    lp(creep, "连接服务器...");
  }, 125);
  
  var cid = encodeURIComponent(currentCanvas);
  Promise.all([
    db('GET','task_cards','','canvas_id=eq.'+cid+'&order=created_at'),
    db('GET','task_connections','','canvas_id=eq.'+cid),
    db('GET','task_comments','','order=created_at')
  ]).then(function(results){
    if(creepTimer) clearInterval(creepTimer);
    lp(30,"解析卡片数据...");
    var cardRows = results[0] || [];
    var connRows = results[1] || [];
    var commentRows = results[2] || [];
    if(cardRows.length > 0){
      cards = cardRows.map(function(r){ return {id:r.id, title:r.name||'', body:r.description||'', x:r.x, y:r.y, type:r.card_type||'normal', imageData:r.image_data||'', fontSize:r.font_size||42, fontColor:r.font_color||'#ffc832', glow:r.glow===true||r.glow===1||r.glow===undefined||r.glow===null?true:false, bgColor:r.bg_color||''}; });

    } else {
      cards = [];
    }
    connections = connRows.map(function(r){ return {from:r.from_card, to:r.to_card}; });
    comments = {};
    commentRows.filter(function(cr){ return cards.some(function(c){ return c.id === cr.card_id }) }).forEach(function(cr){
      if(!comments[cr.card_id]) comments[cr.card_id] = [];
      comments[cr.card_id].push({id:cr.id, author:cr.author||'', content:cr.content||'', created_at:cr.created_at});
    });
    lp(70,"渲染界面...");
    docscroll();
    renderAll();
    lp(100,"完成");
    setTimeout(function(){
      document.getElementById("loading").style.display = "none";
    }, 300);
  }).catch(function(e){
    console.warn('Load error, using localStorage',e);
    try{var lc=localStorage.getItem('3x3_cards');if(lc && lc!=='[]'){cards=JSON.parse(lc);} else {cards=[];var nid='c'+Date.now();cards.push({id:nid,title:'示例卡片',body:'右键此卡片试试连线功能',x:100,y:100});}var lconn=localStorage.getItem('3x3_connections');if(lconn){connections=JSON.parse(lconn);}}catch(le){cards=[];}
    docscroll();
    renderAll();
    document.getElementById("loading").style.display = "none";
  });
}

/* ====== 保存到云端 ====== */
function saveToCloud(){
  var tk = localStorage.getItem('abi_token');
  if(!tk){ alert('需要 GitHub 登录才能保存到云端。请点击右上角 GitHub 图标登录。'); return; }
  var btn = document.getElementById('saveCloudBtn');
  if(btn) btn.textContent = '⏳ 保存中...';
  var cid = encodeURIComponent(currentCanvas);
  var ah = {'apikey':SUPABASE_ANON,'Content-Type':'application/json'};
  var task = Promise.resolve();
  task = task.then(function(){ return fetch(SUPABASE_URL+'/rest/v1/task_cards?canvas_id=eq.'+cid, {method:'DELETE',headers:ah}).catch(function(){return null;}); });
  task = task.then(function(){ return fetch(SUPABASE_URL+'/rest/v1/task_connections?canvas_id=eq.'+cid, {method:'DELETE',headers:ah}).catch(function(){return null;}); });
  task = task.then(function(){
    var ps = [];
    cards.forEach(function(c){
      ps.push(fetch(SUPABASE_URL+'/rest/v1/task_cards', {method:'POST',headers:ah, body:JSON.stringify({id:c.id,canvas_id:currentCanvas,name:c.title||'',description:c.body||'',x:c.x,y:c.y,card_type:c.type||'normal',image_data:c.imageData||null,font_size:c.fontSize||null,font_color:c.fontColor||null,glow:c.glow!==false,bg_color:c.bgColor||null})}));
    });
    connections.forEach(function(cn){
      ps.push(fetch(SUPABASE_URL+'/rest/v1/task_connections', {method:'POST',headers:ah, body:JSON.stringify({id:Date.now()+''+Math.random().toString(36).slice(2),canvas_id:currentCanvas,from_card:cn.from,to_card:cn.to})}));
    });
    return Promise.all(ps);
  });
  task.then(function(){
    if(btn) btn.textContent = '✔ 已保存';
    setTimeout(function(){ if(btn) btn.textContent = '☁ 保存'; }, 2000);
  }).catch(function(e){
    console.error('Save failed',e);
    if(btn) btn.textContent = '✘ 失败';
  });
}


/* ====== 框选 + 排列功能 ====== */
function confirmSelection(){
  var sb = document.getElementById("selectionBox");
  var l = parseFloat(sb.style.left);
  var t = parseFloat(sb.style.top);
  var r = l + parseFloat(sb.style.width);
  var b = t + parseFloat(sb.style.height);
  if(isNaN(l) || r - l < 5) return;
  selectedCardIds = {};
  document.querySelectorAll(".card.selected").forEach(function(el){el.classList.remove("selected");});
  var vpRect = document.getElementById("viewport").getBoundingClientRect();
  cards.forEach(function(c){
    var el = document.getElementById("card_"+c.id);
    if(!el) return;
    var corners = [
      {x:c.x, y:c.y},
      {x:c.x + el.offsetWidth, y:c.y},
      {x:c.x, y:c.y + el.offsetHeight},
      {x:c.x + el.offsetWidth, y:c.y + el.offsetHeight}
    ];
    var inSel = false;
    for(var i = 0; i < 4; i++){
      var sx = corners[i].x * scale + panX + vpRect.left;
      var sy = corners[i].y * scale + panY + vpRect.top;
      if(sx >= l && sx <= r && sy >= t && sy <= b){ inSel = true; break; }
    }
    if(inSel){ selectedCardIds[c.id] = true; el.classList.add("selected"); }
  });
  updateBatchBtn();
}

function alignCards(dir){
  var ids = Object.keys(selectedCardIds);
  if(ids.length < 2) return;
  var selected = [];
  ids.forEach(function(id){
    var c = cards.find(function(x){ return x.id === id; });
    if(c) selected.push(c);
  });
  if(dir === 'h'){
    var sum = 0;
    selected.forEach(function(c){ sum += c.y; });
    var avg = sum / selected.length;
    selected.forEach(function(c){ c.y = avg; });
  } else {
    var sum = 0;
    selected.forEach(function(c){ sum += c.x; });
    var avg = sum / selected.length;
    selected.forEach(function(c){ c.x = avg; });
  }
  pushUndo();
  renderAll();
}

function spaceEvenly(dir){
  var ids = Object.keys(selectedCardIds);
  if(ids.length < 3) return;
  var sel = [];
  ids.forEach(function(id){
    var c = cards.find(function(x){ return x.id === id; });
    if(c) sel.push(c);
  });
  if(dir === 'h'){
    sel.sort(function(a,b){ return a.x - b.x; });
    var min = sel[0].x, max = sel[sel.length-1].x;
    var gap = (max - min) / (sel.length - 1);
    sel.forEach(function(c, i){ c.x = min + gap * i; });
  } else {
    sel.sort(function(a,b){ return a.y - b.y; });
    var min = sel[0].y, max = sel[sel.length-1].y;
    var gap = (max - min) / (sel.length - 1);
    sel.forEach(function(c, i){ c.y = min + gap * i; });
  }
  pushUndo();
  renderAll();
}

function autoArrange(){
  var ids = Object.keys(selectedCardIds);
  if(ids.length < 2) return;
  var sel = [];
  ids.forEach(function(id){
    var c = cards.find(function(x){ return x.id === id; });
    if(c) sel.push(c);
  });
  sel.sort(function(a,b){
    if(Math.abs(a.y - b.y) < 30) return b.x - a.x;
    return a.y - b.y;
  });
  var startX = sel[0].x;
  var startY = sel[0].y;
  var cardW = 300, gap = 30;
  var total = sel.length;
  var cols = Math.min(Math.max(Math.ceil(Math.sqrt(total)), 2), 6);
  var idx = 0;
  for(var row = 0; idx < total; row++){
    var remain = total - idx;
    var thisCols = remain < cols ? remain : cols;
    for(var col = 0; col < thisCols && idx < total; col++){
      sel[idx].x = startX + col * (cardW + gap);
      sel[idx].y = startY + row * (130 + gap);
      idx++;
    }
  }
  pushUndo();
  renderAll();
}

function saveData(){
  var tk = localStorage.getItem('abi_token');
  if(!tk){ if(confirm('需要GitHub登录才能保存。去登录？')) loginGitHub(); return; }
  var authHeaders = {'apikey':SUPABASE_ANON,'Content-Type':'application/json'};
  var cid = encodeURIComponent(currentCanvas);
  /* 统一的失败处理 - 未登录时静默失败 */
  var safefetch = function(u,o){ return fetch(u,o).catch(function(){}); };
  /* 1. 删除旧数据 */
  var deletes = [
    safefetch(SUPABASE_URL+'/rest/v1/task_cards?canvas_id=eq.'+cid, {method:'DELETE', headers:authHeaders}),
    safefetch(SUPABASE_URL+'/rest/v1/task_connections?canvas_id=eq.'+cid, {method:'DELETE', headers:authHeaders}),
    safefetch(SUPABASE_URL+'/rest/v1/task_zones?canvas_id=eq.'+cid, {method:'DELETE', headers:authHeaders})
  ];
  if(cards.length){
    var cardIds = cards.map(function(c){return "'"+c.id+"'"}).join(',');
    deletes.push(safefetch(SUPABASE_URL+'/rest/v1/task_comments?card_id=in.('+cardIds+')',{method:'DELETE',headers:authHeaders}));
  }
  Promise.all(deletes).then(function(){
    /* 2. 写入新数据 */
    var upserts = [];
    cards.forEach(function(c){
      upserts.push(safefetch(SUPABASE_URL+'/rest/v1/task_cards',{
        method:'POST', headers:authHeaders,
        body:JSON.stringify({id:c.id, canvas_id:currentCanvas, name:c.title||'', description:c.body||'', x:c.x, y:c.y, card_type:c.type||'normal', image_data:c.imageData||null, font_size:c.fontSize||null, font_color:c.fontColor||null, glow:c.glow!==false, bg_color:c.bgColor||null})
      }));
    });
    connections.forEach(function(cn){
      upserts.push(safefetch(SUPABASE_URL+'/rest/v1/task_connections',{
        method:'POST', headers:authHeaders,
        body:JSON.stringify({id:Date.now()+''+Math.random().toString(36).slice(2), canvas_id:currentCanvas, from_card:cn.from, to_card:cn.to})
      }));
    });
    Object.keys(comments).forEach(function(cardId){
      (comments[cardId]||[]).forEach(function(cm){
        upserts.push(safefetch(SUPABASE_URL+'/rest/v1/task_comments',{
          method:'POST', headers:authHeaders,
          body:JSON.stringify({id:cm.id, card_id:cardId, author:cm.author||'', content:cm.content||''})
        }));
      });
    });
    return Promise.all(upserts);
  }).then(function(){
    editMode = false;
    document.getElementById("editToggle").style.display = "inline-block";
    document.getElementById("saveBtn").style.display = "none";
    document.getElementById("cancelBtn").style.display = "none";
    document.getElementById("editToolbar").style.display = "none";
    renderAll();
  }).catch(function(e){
    console.warn('saveData complete', e);
  });

}

function startZoneDraw(e){
  if(!editMode) return;
  isZoneDrawing = true;
  var rect = document.getElementById("viewport").getBoundingClientRect();
  zoneStartX = (e.clientX - rect.left - panX) / scale;
  zoneStartY = (e.clientY - rect.top - panY) / scale;
  /* 创建临时区域 */
  var tempId = "_zone_temp";
  zones.push({id:tempId, label:"", color:"rgba(255,200,50,0.15)", left:zoneStartX, top:zoneStartY, width:0, height:0, cardIds:[]});
  renderAll();
}

function updateZoneDraw(e){
  if(!isZoneDrawing) return;
  var rect = document.getElementById("viewport").getBoundingClientRect();
  var cx = (e.clientX - rect.left - panX) / scale;
  var cy = (e.clientY - rect.top - panY) / scale;
  var z = zones.find(function(x){return x.id==="_zone_temp"});
  if(z){
    z.left = Math.min(zoneStartX, cx);
    z.top = Math.min(zoneStartY, cy);
    z.width = Math.abs(cx - zoneStartX);
    z.height = Math.abs(cy - zoneStartY);
    renderAll();
  }
}

        function mu(){ document.removeEventListener("mousemove",mm); document.removeEventListener("mouseup",mu); }
        document.addEventListener("mousemove",mm); document.addEventListener("mouseup",mu);
        e.preventDefault();
        return;
      }
      /* 非编辑模式 - 不做任何事，阻止冒泡防止画布拖动 */
      e.stopPropagation();
    });
  })(div, c);

  /* 阻止卡片内滚轮缩放到画布 */
  div.addEventListener("wheel", function(e){ e.stopPropagation(); }, {passive:true});

  cvs.appendChild(div);

/* ====== 卡片操作 ====== */
function addCard(type){
  var id = "c"+Date.now()+Math.random().toString(36).slice(2,6);
  var vp = document.getElementById("viewport");
  var cx = (vp.clientWidth - 300)/4, cy = (vp.clientHeight - 260)/4;
  if(!type){ var sel = document.getElementById("cardTypeSelect"); if(sel) type = sel.value; }
  if(type === 'image'){
    cards.push({id:id, type:'image', title:'图片卡片', imageData:'', x:cx, y:cy});
  } else if(type === 'title'){
    cards.push({id:id, type:'title', title:'新标题', fontSize:42, fontColor:'#ffc832', glow:true, x:cx, y:cy});
  } else {
    cards.push({id:id, type:'normal', title:'新卡片', body:'点击编辑填写内容', x:cx, y:cy});
  }
  pushUndo();
  renderAll();
  openEditModal(id);
}

function deleteCard(id){
  var idx = cards.findIndex(function(c){ return c.id === id });
  if(idx >= 0) cards.splice(idx,1);
  delete comments[id];
  pushUndo();
  renderAll();
}

function batchDelete(){
  var ids = Object.keys(selectedCardIds);
  if(!ids.length) return;
  if(!confirm("确定删除 "+ids.length+" 张选中卡片？")) return;
  ids.forEach(function(id){
    var idx = cards.findIndex(function(c){ return c.id === id });
    if(idx >= 0) cards.splice(idx,1);
    delete comments[id];
  });
  selectedCardIds = {};
  pushUndo();
  renderAll();
  updateBatchBtn();
}

function updateBatchBtn(){
  var cnt = Object.keys(selectedCardIds).length;
  var selCount = document.getElementById("selCount");
  var showAlign = cnt >= 2;
  var showSpace = cnt >= 3;
  if(cnt > 0){
    document.getElementById("batchDelBtn").textContent = "🗑 批量删除 ("+cnt+")";
    document.getElementById("batchDelBtn").style.display = "inline-block";
    selCount.textContent = "已选 "+cnt+" 张";
    selCount.style.display = "inline";
  } else {
    document.getElementById("batchDelBtn").style.display = "none";
    selCount.style.display = "none";
  }
  document.getElementById("alignBtn").style.display = showAlign ? "inline-block" : "none";
  document.getElementById("alignBtnV").style.display = showAlign ? "inline-block" : "none";
  document.getElementById("arrangeBtn").style.display = showAlign ? "inline-block" : "none";
  document.getElementById("spaceBtnH").style.display = showSpace ? "inline-block" : "none";
  document.getElementById("spaceBtnV").style.display = showSpace ? "inline-block" : "none";
}

function pushUndo(){
  undoStack.push(JSON.stringify({cards:cards,connections:connections,comments:comments}));
  if(undoStack.length>20) undoStack.shift();
}

function undoLast(){
  if(undoStack.length<2) return;
  undoStack.pop();
  var prev = JSON.parse(undoStack[undoStack.length-1]);
  cards = prev.cards;
  connections = prev.connections;
  comments = prev.comments || {};
  renderAll();
}

function clearConns(){
  if(!confirm("确定清空所有连线？")) return;
  connections = [];
  pushUndo();
  renderAll();
}

/* ====== Viewport 事件 ====== */
var vp = document.getElementById("viewport");
vp.addEventListener("mousedown", function(e){
  if(e.target.closest(".card") && editMode) return;
  if(e.button !== 0) return;
  /* 区域模式 */
  if(zoneMode && editMode && !e.target.closest(".card-zone")){
    startZoneDraw(e);
    e.preventDefault();
    return;
  }
  /* Ctrl+点击 = 框选 */
  if(e.ctrlKey || e.metaKey){
    if(!editMode) return;
    isSelecting = true;
    selStartX = e.clientX; selStartY = e.clientY;
    var sb = document.getElementById("selectionBox");
    sb.style.left = e.clientX+"px";
    sb.style.top = e.clientY+"px";
    sb.style.width = "0px";
    sb.style.height = "0px";
    sb.style.display = "block";
    e.preventDefault();
    return;
  }
  isPanning = true;
  panStartX = e.clientX; panStartY = e.clientY;
  panOX = panX; panOY = panY;
  this.classList.add("dragging");
});
document.addEventListener("mousemove", function(e){
  if(isZoneDrawing){ updateZoneDraw(e); return; }
  if(isSelecting){
    var sb = document.getElementById("selectionBox");
    var l = Math.min(selStartX, e.clientX);
    var t = Math.min(selStartY, e.clientY);
    var r = Math.max(selStartX, e.clientX);
    var b = Math.max(selStartY, e.clientY);
    sb.style.left = l+"px";
    sb.style.top = t+"px";
    sb.style.width = (r-l)+"px";
    sb.style.height = (b-t)+"px";
    return;
  }
  if(!isPanning) return;
  panX = panOX + e.clientX - panStartX;
  panY = panOY + e.clientY - panStartY;

});

/* ── 触控单指拖拽 + 双指缩放 ── */
(function(){
  var vp = document.getElementById("viewport");
  if (!vp) return;
  var tStartX=0, tStartY=0, tDist=0, tScale=1, tMoved=false, tMode='none';
  var tPanX=0, tPanY=0;
  var lastMidX=0, lastMidY=0;
  vp.addEventListener('touchstart', function(e){
    tMoved = false;
    tMode = (e.touches.length === 2) ? 'pinch' : 'drag';
    if (e.touches.length === 1) {
      tStartX = e.touches[0].clientX;
      tStartY = e.touches[0].clientY;
      tPanX = panX; tPanY = panY;
    } else if (e.touches.length === 2) {
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      tDist = Math.hypot(dx, dy);
      tScale = scale;
      lastMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      lastMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    }
  }, {passive: true});
  vp.addEventListener('touchmove', function(e){
    if (e.touches.length === 1 && tMode === 'drag') {
      var dx = e.touches[0].clientX - tStartX;
      var dy = e.touches[0].clientY - tStartY;
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) { tMoved = true; }
      if (tMoved) {
        panX = tPanX + dx;
        panY = tPanY + dy;
        updateTransform();
      }
    } else if (e.touches.length === 2) {
      tMoved = true;
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      var dist = Math.hypot(dx, dy);
      var midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      var midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      var ns = tScale * dist / tDist;
      if (ns < 0.15) ns = 0.15;
      if (ns > 10) ns = 10;
      var oldScale = scale;
      scale = ns;
      panX = midX - (midX - tPanX) * (ns/oldScale);
      panY = midY - (midY - tPanY) * (ns/oldScale);
      tPanX = panX; tPanY = panY;
      tScale = ns; tDist = dist;
      lastMidX = midX; lastMidY = midY;
      updateTransform();
    }
  }, {passive: false});
  vp.addEventListener('touchend', function(e){
    tMode = 'none';
  }, {passive: true});
})();vp.addEventListener("wheel", function(e){
  e.preventDefault();
  var rect = vp.getBoundingClientRect();
  var mx = e.clientX - rect.left, my = e.clientY - rect.top;
  var oldScale = scale;
  scale = Math.max(0.15, Math.min(10, scale * (e.deltaY < 0 ? 1.12 : 0.89)));
  panX = mx - (mx - panX) * (scale/oldScale);
  panY = my - (my - panY) * (scale/oldScale);
  updateTransform();
}, {passive:false});

function uploadImgToGitHub(base64Data, ext, cb){
  if(!base64Data) return cb(null);
  // base64Data format: data:image/png;base64,iVBOR...
  var actualBase64 = base64Data.split(',')[1] || base64Data;
  var filename = 'img_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)+'.'+(ext||'png');
  var path = GITHUB_PATH + filename;
  var url = 'https://api.github.com/repos/'+GITHUB_REPO+'/contents/'+path;
  var token = getGitHubToken();
  if(!token){ alert('请先设置 GitHub Token：浏览器 F12 → Application → Local Storage → 添加 gh_token'); cb(null); return; }
  
  fetch(url, {
    method: 'PUT',
    headers: {'Authorization': 'Bearer '+token, 'Content-Type': 'application/json'},
    body: JSON.stringify({
      message: 'upload '+filename,
      content: actualBase64,
      branch: GITHUB_BRANCH
    })
  }).then(function(r){
    if(r.status === 201 || r.status === 200) return r.json();
    return r.text().then(function(t){ throw new Error(t); });
  }).then(function(data){
    var rawUrl = GITHUB_RAW + path;
    cb(rawUrl);
  }).catch(function(err){
    console.error('GitHub upload failed', err);
    cb(null);
  });
}

<script>
(function(){
  var card = document.getElementById('adCard');
  if (!card) return;
  var isDragging = false, tMoved = false;
  var tStartX = 0, tStartY = 0, tLeft = 0, tBottom = 0;
  var mm = null, mu = null;

  function startDrag(e) {
    isDragging = false; tMoved = false;
    var rect = card.getBoundingClientRect();
    tStartX = e.clientX || (e.touches && e.touches[0].clientX);
    tStartY = e.clientY || (e.touches && e.touches[0].clientY);
    tLeft = parseInt(card.style.left) || parseInt(card.getAttribute('data-left')) || 12;
    tBottom = parseInt(card.style.bottom) || parseInt(card.getAttribute('data-bottom')) || 12;
    // save original position
    card.setAttribute('data-left', tLeft);
    card.setAttribute('data-bottom', tBottom);

    mm = function(ev) {
      var cx = ev.clientX || (ev.touches && ev.touches[0].clientX);
      var cy = ev.clientY || (ev.touches && ev.touches[0].clientY);
      if (!cx && cx !== 0) return;
      var dx = cx - tStartX, dy = cy - tStartY;
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) { isDragging = true; tMoved = true; }
      if (isDragging) {
        card.style.left = (tLeft + dx) + 'px';
        card.style.bottom = (tBottom - dy) + 'px';
        card.style.right = 'auto';
        card.style.top = 'auto';
      }
    };
    mu = function() {
      document.removeEventListener('mousemove', mm);
      document.removeEventListener('mouseup', mu);
      card.removeEventListener('touchmove', mm);
      card.removeEventListener('touchend', mu);
      if (isDragging) {
        // save position
        card.setAttribute('data-left', parseInt(card.style.left) || tLeft);
        card.setAttribute('data-bottom', parseInt(card.style.bottom) || tBottom);
      }
      // if didn't move, trigger click
      if (!tMoved) {
        window.open('https://example.com','_blank');
      }
      isDragging = false;
    };
    if (e.type === 'mousedown' && e.button === 0) {
      document.addEventListener('mousemove', mm);
      document.addEventListener('mouseup', mu);
    } else if (e.type === 'touchstart') {
      card.addEventListener('touchmove', mm, {passive:false});
      card.addEventListener('touchend', mu, {passive:true});
    }
    e.preventDefault();
  }

  card.addEventListener('mousedown', startDrag);
  card.addEventListener('touchstart', startDrag, {passive:false});
  // 禁止卡片自身的 click 冒泡（click 由 drag 结束逻辑触发）
  card.addEventListener('click', function(e){ if (tMoved) e.stopPropagation(); });
})();
</script>
