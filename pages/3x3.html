<!DOCTYPE html>
<html lang="zh-CN">
<head><meta name="robots" content="noindex">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3×3 一图流 - 暗区突围：无限</title>
<link rel="icon" href="../favicon.ico" type="image/jpeg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#ddd;font-family:-apple-system,"Microsoft YaHei",sans-serif;overflow:hidden}
.app-bar{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(10,10,15,.95);backdrop-filter:blur(8px);border-bottom:1px solid #222;display:flex;align-items:center;padding:8px 16px;gap:12px;height:48px}
.app-bar h1{color:#ffc832;font-size:18px;font-weight:600;flex:1}
.app-bar a{color:#888;text-decoration:none;font-size:13px}
.app-bar .btn{padding:4px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px}
.btn-edit{background:#2a2a3a;color:#88aaff}
.btn-save{background:#1a4a1a;color:#4f4}
.btn-cancel{background:#3a1a1a;color:#f44}

.viewport{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
.viewport.dragging{cursor:grabbing}

/* 画布 — 包含所有卡片和SVG，整体缩放平移 */
.canvas{position:absolute;top:0;left:0;transform-origin:0 0;width:100vw;height:100vh;background: #111; background-image: radial-gradient(circle at 25px 25px, #1a1a4a 2px, transparent 2px); background-size: 40px 40px; min-width:1000000px; min-height:1000000px}

#connSvg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
#connSvg path{stroke:#ff8833;stroke-width:3.5;fill:none;stroke-linecap:round;opacity:0.85;filter:drop-shadow(0 0 4px rgba(255,136,51,.3))}
#connSvg polygon{fill:#ff8833;opacity:0.85}

.card{position:absolute;width:240px;min-height:130px;background:rgba(18,18,28,.96);border:1.5px solid rgba(255,255,255,.08);border-radius:14px;cursor:pointer;z-index:2;overflow:hidden;transition:box-shadow .2s,border-color .2s;user-select:none}
.card:hover{box-shadow:0 0 20px rgba(255,200,50,.18);border-color:rgba(255,200,50,.3)}
.card.editing{border-color:#ffc832;box-shadow:0 0 30px rgba(255,200,50,.35)}

.card-title{padding:12px 14px 4px;font-size:15px;font-weight:600;color:#fff;text-align:center;letter-spacing:1px}
.card-desc{padding:0 14px 14px;font-size:12px;color:#999;line-height:1.5;text-align:left;word-break:break-all;min-height:24px}

.card-actions{position:absolute;bottom:0;left:0;right:0;height:30px;display:none;align-items:center;justify-content:space-between;padding:0 4px;z-index:5}
.card.editing .card-actions{display:flex}
.card-dot{width:22px;height:22px;border-radius:50%;border:3px solid #111;cursor:crosshair;transition:transform .15s,box-shadow .15s;z-index:6}
.card-dot:hover{transform:scale(1.2);box-shadow:0 0 10px currentColor}
.dot-blue{background:#4488ff;margin-left:6px}
.dot-green{background:#22cc66;margin-right:6px}

.card-edit-btn{position:absolute;top:6px;right:6px;z-index:10;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:5px;color:#aaa;cursor:pointer;padding:3px 7px;font-size:11px;display:none}
.card.editing .card-edit-btn{display:block}
.card-edit-btn:hover{color:#ffc832;background:rgba(255,200,50,.15)}
.card-del-btn{position:absolute;top:6px;left:6px;z-index:10;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:5px;color:#f66;cursor:pointer;padding:3px 7px;font-size:11px;display:none}
.card.editing .card-del-btn{display:block}
.card-del-btn:hover{color:#ff3333;background:rgba(255,50,50,.15)}

.toolbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:none;gap:8px;background:rgba(10,10,15,.92);border:1px solid #333;border-radius:12px;padding:8px 14px;backdrop-filter:blur(8px);white-space:nowrap}
.toolbar button{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;color:#ddd;transition:background .15s}
.toolbar .add-btn{background:#1a3a1a;color:#4f4}
.toolbar .conn-toggle{background:#2a3a2a;color:#aaf}
.toolbar .undo-btn{background:#2a2a3a;color:#aaa}
.toolbar .clear-btn{background:#3a1a1a;color:#f66}
.toolbar .btn-align{background:#2a2a3a;color:#aaf}
.toolbar .btn-space{background:#2a3a2a;color:#6f6}
.toolbar .btn-arrange{background:#3a2a1a;color:#fc8}
.toolbar button:hover{filter:brightness(1.2)}

/* 框选 */
.selection-box{position:fixed;border:1.5px solid #ffc832;background:rgba(255,200,50,.08);pointer-events:none;z-index:999;display:none}
.card.selected{border-color:#ffc832!important;box-shadow:0 0 30px rgba(255,200,50,.4)!important}

/* 汉堡菜单 */
.hamburger{position:fixed;top:56px;left:8px;z-index:9999;width:30px;height:30px;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.06);border-radius:7px;color:#ccc;cursor:grab;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.hamburger:active{cursor:grabbing}
.hamburger:hover{background:rgba(255,200,50,0.08);border-color:#ffc832;color:#ffc832}
.hm-menu{display:none;position:fixed;top:94px;left:8px;z-index:9998;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:9px;padding:8px;min-width:220px;box-shadow:0 4px 24px rgba(0,0,0,0.5)}
.hm-menu.show{display:block}
.hm-item{padding:8px 12px;color:#ccc;font-size:13px;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:8px}
.hm-item:hover{background:rgba(255,255,255,0.06);color:#fff}
.hm-item.active{color:#ffc832;background:rgba(255,200,50,0.1)}
.hm-item .hm-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hm-sep{height:1px;background:rgba(255,255,255,0.06);margin:4px 8px}

.modal-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.8);z-index:9999;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#1a1a24;border:1px solid #333;border-radius:14px;padding:20px;width:380px;max-width:90vw;max-height:80vh;overflow-y:auto}
.modal h2{color:#ffc832;font-size:16px;margin-bottom:14px}
.modal label{display:block;color:#aaa;font-size:12px;margin:8px 0 4px}
.modal input,.modal textarea{width:100%;padding:7px 10px;background:rgba(255,255,255,.05);border:1px solid #333;border-radius:8px;color:#ddd;font-size:12px;outline:none}
.modal input:focus,.modal textarea:focus{border-color:#ffc832}
.modal textarea{min-height:60px;resize:vertical}
.modal .btn-row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.modal .btn-row button{padding:6px 16px;border:none;border-radius:6px;cursor:pointer;font-size:12px}
.modal .btn-save-m{background:#ffc832;color:#000;font-weight:600}
.modal .btn-cancel-m{background:rgba(255,255,255,.08);color:#aaa}
.loading{position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0f;z-index:9999;color:#666;font-size:14px}

.zoom-info{position:fixed;bottom:20px;right:20px;z-index:100;color:#555;font-size:11px;background:rgba(10,10,15,.8);padding:4px 10px;border-radius:8px;border:1px solid #222}

/* 画布切换面板 — 手风琴 */
.canvas-panel-btn{position:relative;margin-left:4px;padding:4px 10px;border-radius:6px;border:none;cursor:pointer;font-size:13px;background:#1e1e2a;color:#88aaff;white-space:nowrap;transition:background .15s}
.canvas-panel-btn:hover{background:#2a2a3a;color:#aaf}
.canvas-panel{display:none;position:fixed;top:52px;left:50px;z-index:9998;background:rgba(0,0,0,0.9);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:9px;padding:6px;min-width:200px;box-shadow:0 4px 24px rgba(0,0,0,0.5)}
.canvas-panel.show{display:block}
.cp-accordion{cursor:pointer;padding:7px 10px;color:#ffc832;font-size:13px;font-weight:600;border-radius:6px;display:flex;align-items:center;gap:6px;user-select:none}
.cp-accordion:hover{background:rgba(255,200,50,0.08)}
.cp-accordion .arrow{transition:transform .2s;font-size:10px}
.cp-accordion.open .arrow{transform:rotate(90deg)}
.cp-list{overflow:hidden;max-height:0;transition:max-height .3s ease}
.cp-list.open{max-height:500px}
.cp-item{padding:6px 10px 6px 22px;color:#ccc;font-size:12px;cursor:pointer;border-radius:5px;display:flex;align-items:center;gap:6px}
.cp-item:hover{background:rgba(255,255,255,0.06);color:#fff}
.cp-item.active{color:#ffc832;background:rgba(255,200,50,0.1)}
.cp-item .cp-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cp-item .cp-del{cursor:pointer;color:#555;margin-left:auto;padding:0 4px;font-size:11px}
.cp-item .cp-del:hover{color:#f66}
.cp-add{padding:6px 10px 6px 22px;color:#6f6;font-size:12px;cursor:pointer;border-radius:5px}
.cp-add:hover{background:rgba(100,255,100,0.08)}
.cp-rename{padding:6px 10px 6px 22px;color:#ffc832;font-size:12px;cursor:pointer;border-radius:5px}
.cp-rename:hover{background:rgba(255,200,50,0.08)}

/* 导航汉堡 */
.hamburger{position:fixed;top:56px;left:8px;z-index:9999;width:30px;height:30px;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.06);border-radius:7px;color:#ccc;cursor:grab;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.hamburger:active{cursor:grabbing}
.hamburger:hover{background:rgba(255,200,50,0.08);border-color:#ffc832;color:#ffc832}
.hamburger-menu{display:none;position:fixed;top:94px;left:8px;z-index:9998;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:9px;padding:8px;min-width:260px;max-height:90vh;overflow-y:auto;box-shadow:0 4px 24px rgba(0,0,0,0.5)}
.hamburger-menu.show{display:block}
.hamburger-menu::-webkit-scrollbar{width:2px}
.hamburger-menu::-webkit-scrollbar-thumb{background:#333}
.hm-group-label{padding:8px 12px;color:#ccc;font-size:13px;cursor:default;border-radius:6px;display:flex;align-items:center;gap:6px}
.hm-group-label[onclick]{cursor:pointer}
.hm-group-label:hover{background:rgba(255,255,255,0.04)}
.hm-group-label.active{color:#ffc832;background:rgba(255,200,50,0.1)}
.hm-sep{height:1px;background:rgba(255,255,255,0.06);margin:4px 8px}
.hm-group-wrap{margin-bottom:2px}
.hm-sub{overflow:hidden;max-height:0;transition:max-height .3s ease}
.hm-sub.open{max-height:400px}
.hm-item{padding:6px 12px 6px 30px;color:#999;font-size:12px;cursor:pointer;border-radius:5px}
.hm-item:hover{background:rgba(255,255,255,0.04);color:#fff}
.hm-item.active{color:#ffc832}

/* 地图导航 — 田字格 */
.map-nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:9997;display:grid;grid-template-columns:repeat(3,auto);gap:6px;background:rgba(10,10,15,.88);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:6px;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.map-nav a{text-decoration:none;padding:6px 14px;border-radius:7px;font-size:11px;color:#888;text-align:center;transition:all .15s;white-space:nowrap;border:1px solid transparent}
.map-nav a:hover{background:rgba(255,200,50,0.1);color:#ffc832;border-color:rgba(255,200,50,0.2)}
.map-nav a:active{transform:scale(0.96)}
</style>
</head>

<script>

<script>
var cards = [];
var connections = [];
var editMode = false;
var editingCardId = null;
var selectedConnFrom = null;
var undoStack = [];

/* Supabase */
var SUPABASE_URL='https://hanrfbciinkhgcumvous.supabase.co';var SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhbnJmYmNpaW5raGdjdW12b3VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTA4ODAsImV4cCI6MjA5NTM4Njg4MH0.Q7JBpwAqpYbEpwLq7werjtAtgjU4pIcHg4JbwFZ2vok';
function db(m,t,b,q){var u=SUPABASE_URL+'/rest/v1/'+t;var o={method:m||'GET',headers:{'apikey':SUPABASE_ANON,'Content-Type':'application/json'}};if(b){o.body=JSON.stringify(b);var tk=localStorage.getItem('abi_token');if(tk){o.headers['Authorization']='Bearer '+tk;}}if(q) u+='?'+q;return fetch(u,o).then(function(r){if(r.status>=400)throw new Error(r.status+' '+r.statusText);return r.text().then(function(t){if(!t||t==='[]'||t==='{}')return null;try{return JSON.parse(t);}catch(e){return null;}});});}
/* 首次加载时，从 localStorage 导入旧数据（如果数据库为空） */
var localDataImported = false;
function importLocalDataIfNeeded(){
  if(localDataImported) return Promise.resolve(false);
  var listRaw = localStorage.getItem('abi_3x3_canvas_list');
  if(!listRaw) return Promise.resolve(false);
  var canvases;
  try{
    canvases = JSON.parse(listRaw);
    if(!canvases || !canvases.length) return Promise.resolve(false);
  } catch(e){ return Promise.resolve(false); }
  /* 检查数据库是否已有数据（防止重复导入） */
  return db('GET','task_cards','','limit=1').then(function(rows){
    if(rows && rows.length > 0) return false; /* DB 已有数据，不导入 */
    /* 开始导入 */
    localDataImported = true;
    var tk = localStorage.getItem('abi_token');
    if(!tk){ console.log('未登录，跳过导入'); return false; }
    var allPromises = [];
    canvases.forEach(function(cv){
      if(cv.id !== 'default'){
        allPromises.push(fetch(SUPABASE_URL+'/rest/v1/task_canvases',{
          method:'POST', headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+tk,'Content-Type':'application/json'},
          body: JSON.stringify({id:cv.id, label:cv.label, color:cv.color||'#888'})
        }));
      }
      var key = 'abi_3x3_canvas_' + cv.id;
      var dataRaw = localStorage.getItem(key);
      if(!dataRaw) return;
      try {
        var data = JSON.parse(dataRaw);
        if(!data.cards || !data.cards.length) return;
        data.cards.forEach(function(c){
          allPromises.push(fetch(SUPABASE_URL+'/rest/v1/task_cards',{
            method:'POST', headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+tk,'Content-Type':'application/json'},
            body: JSON.stringify({id:c.id, canvas_id:cv.id, name:c.name||'', description:c.desc||'', x:c.x, y:c.y})
          }));
        });
        (data.connections||[]).forEach(function(conn){
          allPromises.push(fetch(SUPABASE_URL+'/rest/v1/task_connections',{
            method:'POST', headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+tk,'Content-Type':'application/json'},
            body: JSON.stringify({canvas_id:cv.id, from_card:conn.from, to_card:conn.to})
          }));
        });
      } catch(e){}
    });
    if(allPromises.length > 0){
      console.log('正在从 localStorage 导入 '+allPromises.length+' 条数据到数据库...');
      return Promise.all(allPromises).then(function(){ console.log('✅ 数据导入完成！'); return true; });
    }
    return Promise.resolve(false);
  }).catch(function(){ return false; });
}

/* 多画布 */
var currentCanvas = null;
var canvasList = [];

function loadCanvas(id){
  if(!id) { cards = []; connections = []; undoStack = []; renderAll(); document.getElementById("loading").style.display = "none"; return; }
  if(id === currentCanvas && cards.length) return;
  /* 先保存旧画布（仅在 currentCanvas 非空且与目标不同时） */
  var loadDone = function(){ renderAll(); document.getElementById("loading").style.display = "none"; };
  if(currentCanvas && currentCanvas !== id) {
    saveCanvas(currentCanvas).then(function(){ doLoadCanvas(id, loadDone); });
  } else {
    doLoadCanvas(id, loadDone);
  }
}

function doLoadCanvas(id, cb){
  currentCanvas = id;
  /* 从 Supabase 加载卡片 */
  Promise.all([
    db('GET','task_cards','','canvas_id=eq.'+encodeURIComponent(id)+'&order=created_at'),
    db('GET','task_connections','','canvas_id=eq.'+encodeURIComponent(id))
  ]).then(function(results){
    var cardRows = results[0] || [];
    var connRows = results[1] || [];
    cards = cardRows.map(function(r){ return {id:r.id, name:r.name||'', desc:r.description||'', x:r.x, y:r.y}; });
    connections = connRows.map(function(r){ return {id:r.id, from:r.from_card, to:r.to_card}; });
    undoStack = [];
    docscroll();
    if(cb) cb();
  }).catch(function(e){
    console.error('Load canvas error', e);
    cards = []; connections = []; undoStack = [];
    docscroll();
    if(cb) cb();
  });
}

function saveCanvas(id){
  if(!id) return Promise.resolve();
  var tk = localStorage.getItem('abi_token');
  if(!tk){
    if(confirm('需要 GitHub 登录才能保存。去登录？')){ loginGitHub(); }
    return Promise.reject('Not logged in');
  }
  /* 批量写入卡片和连线到 Supabase */
  var promises = [];
  /* 先删除当前画布的所有旧数据再重新写入（简单做法） */
  var authHeaders = {'apikey':SUPABASE_ANON,'Authorization':'Bearer '+tk,'Content-Type':'application/json'};
  promises.push(fetch(SUPABASE_URL+'/rest/v1/task_cards?canvas_id=eq.'+encodeURIComponent(id),{method:'DELETE', headers:authHeaders}));
  promises.push(fetch(SUPABASE_URL+'/rest/v1/task_connections?canvas_id=eq.'+encodeURIComponent(id),{method:'DELETE', headers:authHeaders}));
  return Promise.all(promises).then(function(){
    var cardPromises = cards.map(function(c){
      return fetch(SUPABASE_URL+'/rest/v1/task_cards',{
        method:'POST', headers:authHeaders,
        body: JSON.stringify({id:c.id, canvas_id:id, name:c.name||'', description:c.desc||'', x:c.x, y:c.y})
      });
    });
    var connPromises = connections.map(function(c){
      return fetch(SUPABASE_URL+'/rest/v1/task_connections',{
        method:'POST', headers:authHeaders,
        body: JSON.stringify({canvas_id:id, from_card:c.from, to_card:c.to})
      });
    });
    return Promise.all(cardPromises.concat(connPromises));
  }).catch(function(e){
    console.error('Save canvas error', e);
    if(e.status === 401 || e.message === '401'){
      if(confirm('保存失败，需要 GitHub 登录。去登录？')) loginGitHub();
    }
  });
}

/* Canvas transform */
var scale = 0.8;
var panX = 0, panY = 0;
var isPanning = false, panStartX = 0, panStartY = 0, panOX = 0, panOY = 0;
var selectedCardIds = {};
var isSelecting = false, selStartX = 0, selStartY = 0;

function loadData(){
  /* 从 URL 参数读取画布 */
  var urlParams = new URLSearchParams(window.location.search);
  var canvasParam = urlParams.get('canvas');
  if(canvasParam){
    var exists = canvasList.some(function(cv){ return cv.id === canvasParam; });
    if(exists) currentCanvas = canvasParam;
  }
  if(!currentCanvas && canvasList.length > 0) currentCanvas = canvasList[0].id;
  loadCanvas(currentCanvas);
}

function saveData(){
  saveCanvas(currentCanvas);
}

/* 删除画布（从数据库） */
function deleteCanvasDB(id){
  var tk = localStorage.getItem('abi_token');
  if(!tk){ if(confirm('需要登录才能删除。去登录？')) loginGitHub(); return Promise.reject('Not logged in'); }
  var authHeaders = {'apikey':SUPABASE_ANON,'Authorization':'Bearer '+tk,'Content-Type':'application/json'};
  return Promise.all([
    fetch(SUPABASE_URL+'/rest/v1/task_cards?canvas_id=eq.'+encodeURIComponent(id),{method:'DELETE', headers:authHeaders}),
    fetch(SUPABASE_URL+'/rest/v1/task_connections?canvas_id=eq.'+encodeURIComponent(id),{method:'DELETE', headers:authHeaders}),
    fetch(SUPABASE_URL+'/rest/v1/task_canvases?id=eq.'+encodeURIComponent(id),{method:'DELETE', headers:authHeaders})
  ]);
}

function renderAll(){
  var cvs = document.getElementById("canvas");
  cvs.querySelectorAll(".card").forEach(function(el){el.remove();});
  cards.forEach(function(c){ renderCard(c); });
  renderConns();
  updateTransform();
}

function renderCard(c){
  var cvs = document.getElementById("canvas");
  var div = document.createElement("div");
  div.className = "card" + (editMode ? " editing" : "");
  div.id = "card_" + c.id;
  div.style.left = c.x + "px";
  div.style.top = c.y + "px";

  // Edit button
  var editBtn = document.createElement("button");
  editBtn.className = "card-edit-btn";
  editBtn.textContent = "\u270e";
  editBtn.addEventListener("click", function(e){ e.stopPropagation(); openEditCard(c.id); });
  div.appendChild(editBtn);

  // Delete button
  var delBtn = document.createElement("button");
  delBtn.className = "card-del-btn";
  delBtn.textContent = "\u2716";
  delBtn.addEventListener("click", function(e){ e.stopPropagation(); deleteCard(c.id); });
  div.appendChild(delBtn);

  // Title
  var title = document.createElement("div");
  title.className = "card-title";
  title.textContent = c.name || "";
  div.appendChild(title);

  // Description
  if(c.desc){
    var descEl = document.createElement("div");
    descEl.className = "card-desc";
    descEl.textContent = c.desc;
    div.appendChild(descEl);
  }

  // Actions bar
  var actions = document.createElement("div");
  actions.className = "card-actions";

  var blueDot = document.createElement("div");
  blueDot.className = "card-dot dot-blue";
  blueDot.title = "\u8fde\u7ebf\u7ec8\u70b9";
  blueDot.addEventListener("click", function(e){ e.stopPropagation(); onDotClick(c.id, "in"); });
  actions.appendChild(blueDot);

  var greenDot = document.createElement("div");
  greenDot.className = "card-dot dot-green";
  greenDot.title = "\u8fde\u7ebf\u8d77\u70b9";
  greenDot.addEventListener("click", function(e){ e.stopPropagation(); onDotClick(c.id, "out"); });
  actions.appendChild(greenDot);

  div.appendChild(actions);

  // Drag card (only in edit mode) — 支持多卡一起拖
  if(editMode){
    (function(el, cd){
      el.addEventListener("mousedown", function(e){
        if(e.target.closest(".card-edit-btn,.card-del-btn,.card-dot")) return;
        if(e.button !== 0) return;
        /* 如果卡片没被选中，清空选中只拖这张 */
        if(!el.classList.contains("selected")){
          selectedCardIds = {};
          document.querySelectorAll(".card.selected").forEach(function(x){x.classList.remove("selected");});
        }
        /* 收集要拖的所有卡片 */
        var dragCards = [];
        cards.forEach(function(oc){
          if(selectedCardIds[oc.id] || oc.id === cd.id){
            selectedCardIds[oc.id] = true;
            var oel = document.getElementById("card_" + oc.id);
            if(oel && !oel.classList.contains("selected")) oel.classList.add("selected");
            dragCards.push({card:oc, el:oel, ox:oc.x, oy:oc.y});
          }
        });
        /* 如果没有选中其他卡，只拖当前卡 */
        if(dragCards.length === 0){
          dragCards.push({card:cd, el:el, ox:cd.x, oy:cd.y});
        }
        updateBatchBtn();

        var sx = e.clientX, sy = e.clientY;
        var moved = false;
        function mm(ev){
          var dx = (ev.clientX - sx) / scale;
          var dy = (ev.clientY - sy) / scale;
          dragCards.forEach(function(dc){
            dc.card.x = dc.ox + dx;
            dc.card.y = dc.oy + dy;
            dc.el.style.left = dc.card.x + "px";
            dc.el.style.top = dc.card.y + "px";
          });
          moved = true;
          renderConns();
        }
        function mu(){
          document.removeEventListener("mousemove", mm);
          document.removeEventListener("mouseup", mu);
          if(moved){ pushUndo(); }
        }
        document.addEventListener("mousemove", mm);
        document.addEventListener("mouseup", mu);
        e.preventDefault();
        e.stopPropagation();
      });
    })(div, c);
  }

  cvs.appendChild(div);
}

function renderConns(){
  var svg = document.getElementById("connSvg");
  svg.innerHTML = "";
  /* 标记有连线的卡片 */
  var connectedIds = {};
  connections.forEach(function(conn){
    connectedIds[conn.from] = true;
    connectedIds[conn.to] = true;
  });
  /* 更新所有纽扣颜色 */
  document.querySelectorAll(".dot-green, .dot-blue").forEach(function(dot){
    dot.style.background = dot.classList.contains("dot-blue") ? "#4488ff" : "#22cc66";
  });
  Object.keys(connectedIds).forEach(function(id){
    var el = document.getElementById("card_" + id);
    if(el){
      var bg = el.querySelector(".dot-blue");
      var gg = el.querySelector(".dot-green");
      if(bg) bg.style.background = "#ff8833";
      if(gg) gg.style.background = "#ff8833";
    }
  });
  connections.forEach(function(conn){
    var fromEl = document.getElementById("card_" + conn.from);
    var toEl = document.getElementById("card_" + conn.to);
    if(!fromEl || !toEl) return;

    var fromH = fromEl.offsetHeight;
    var fx = parseFloat(fromEl.style.left) + fromEl.offsetWidth;
    var fy = parseFloat(fromEl.style.top) + fromH - 15;
    var tx = parseFloat(toEl.style.left);
    var ty = parseFloat(toEl.style.top) + toEl.offsetHeight - 15;

    var midX = (fx + tx) / 2;
    var d = "M " + fx + " " + fy + " C " + midX + " " + fy + ", " + midX + " " + ty + ", " + tx + " " + ty;

    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    svg.appendChild(path);

    var angle = Math.atan2(ty - fy, tx - fx);
    var a = 12, w = 8;
    var p1x = tx - a * Math.cos(angle - w * Math.PI / 180);
    var p1y = ty - a * Math.sin(angle - w * Math.PI / 180);
    var p2x = tx - a * Math.cos(angle + w * Math.PI / 180);
    var p2y = ty - a * Math.sin(angle + w * Math.PI / 180);
    var arrow = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    arrow.setAttribute("points", tx + "," + ty + " " + p1x + "," + p1y + " " + p2x + "," + p2y);
    svg.appendChild(arrow);
  });
}

function updateTransform(){
  var cvs = document.getElementById("canvas");
  cvs.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + scale + ")";
  document.getElementById("zoomInfo").textContent = Math.round(scale * 100) + "%";
}

function docscroll(){
  /* Offset canvas to fill top-left with 4x zoom */
  panX = -203400;
  panY = -203400;
  updateTransform();
}

function toggleEdit(){
  if(!editMode && !canEdit()){
    if(!localStorage.getItem('abi_token')){
      if(confirm('需要 GitHub 登录才能编辑。去登录？')) loginGitHub();

var connFrom = null;
var connLine = null;
var connTimeout = null;

function startConnect(cardId){
  connFrom = cardId;
  document.querySelectorAll(".dot-green").forEach(function(el){el.classList.remove("active");});
  var el = document.querySelector("#card_" + cardId + " .dot-green");
  if(el) el.classList.add("active");
  if(!connLine){
    connLine = document.createElementNS("http://www.w3.org/2000/svg", "path");
    connLine.id = "connLine";
    connLine.setAttribute("stroke-width", "2");
    connLine.setAttribute("fill", "none");
    connLine.setAttribute("stroke-dasharray", "6,4");
    connLine.setAttribute("opacity", "0.5");
    connLine.style.stroke = "#22cc66";
    document.getElementById("connSvg").appendChild(connLine);
  }
}

function finishConnect(cardId){
  if(!connFrom) return;
  if(connFrom !== cardId){
    var dup = connections.some(function(c){ return c.from === connFrom && c.to === cardId; });
    if(!dup){
      connections.push({from:connFrom, to:cardId});
      pushUndo();
      renderConns();
    }
  }
  connFrom = null;
  document.querySelectorAll(".dot-green").forEach(function(el){el.classList.remove("active");});
  if(connLine){ connLine.remove(); connLine = null; }
}

function cancelConnect(){
  connFrom = null;
  document.querySelectorAll(".dot-green").forEach(function(el){el.classList.remove("active");});
  if(connLine){ connLine.remove(); connLine = null; }
}

document.addEventListener("mousemove", function(e){
  if(!connFrom) return;
  var fromEl = document.getElementById("card_" + connFrom);
  if(!fromEl) return;
  var rect = document.getElementById("viewport").getBoundingClientRect();
  var vx = e.clientX - rect.left;
  var vy = e.clientY - rect.top;
  var cx = (vx - panX) / scale;
  var cy = (vy - panY) / scale;

  var fh = fromEl.offsetHeight;
  var fx = parseFloat(fromEl.style.left) + fromEl.offsetWidth;
  var fy = parseFloat(fromEl.style.top) + fh - 15;
  var midX = (fx + cx) / 2;
  connLine.setAttribute("d", "M " + fx + " " + fy + " C " + midX + " " + fy + ", " + midX + " " + cy + ", " + cx + " " + cy);
});

/* Also clear on scroll/pan */
document.addEventListener("mousedown", function(e){
  var dot = e.target.closest(".dot-green");
  if(dot && editMode){
    var cardEl = dot.closest(".card");
    if(cardEl){
      var cid = cardEl.id.replace("card_", "");
      startConnect(cid);
    }
    return;
  }
  if(connFrom && !e.target.closest(".dot-blue")){
    cancelConnect();
  }
});
document.addEventListener("mouseup", function(e){
  if(!connFrom) return;
  var dot = e.target.closest(".dot-blue");
  if(dot){
    var cardEl = dot.closest(".card");
    if(cardEl){
      var tid = cardEl.id.replace("card_", "");
      var existing = connections.findIndex(function(c){ return c.from === connFrom && c.to === tid; });
      if(existing >= 0){
        connections.splice(existing, 1);
        pushUndo();
        renderConns();
        cancelConnect();
      } else {
        finishConnect(tid);
      }
    }
  }
});
document.addEventListener("mousedown", function(e){
  if(connFrom && !e.target.closest(".dot-green,.dot-blue")){
    cancelConnect();
  }
});

function clearConns(){
  if(!confirm("\u786e\u5b9a\u6e05\u7a7a\u6240\u6709\u8fde\u7ebf\uff1f")) return;
  connections = [];
  pushUndo();
  renderConns();
}

function addCard(){
  var id = "c" + Date.now() + Math.random().toString(36).slice(2,6);
  var vp = document.getElementById("viewport");
  var ccx = 10 + (vp.clientWidth - 480) / 4;
  var ccy = 10 + (vp.clientHeight - 260) / 4;

  renderAll();

}

function deleteCard(id){
  if(!confirm("\u786e\u5b9a\u5220\u9664\u8fd9\u5f20\u5361\u7247\uff1f")) return;
  var idx = cards.findIndex(function(c){ return c.id === id; });
  if(idx >= 0) cards.splice(idx, 1);
  connections = connections.filter(function(c){ return c.from !== id && c.to !== id; });
  pushUndo();
  renderAll();
}

function openEditCard(id){
  var c = cards.find(function(card){ return card.id === id; });
  if(!c) return;
  editingCardId = id;
  document.getElementById("modalTitle").textContent = "\u7f16\u8f91\u4efb\u52a1";
  document.getElementById("edName").value = c.name || "";
  document.getElementById("edDesc").value = c.desc || "";
  document.getElementById("modal").classList.add("show");
}

function saveCard(){
  var c = cards.find(function(card){ return card.id === editingCardId; });
  if(!c) return;
  c.name = document.getElementById("edName").value;
  c.desc = document.getElementById("edDesc").value;
  pushUndo();
  closeModal();
  renderAll();
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
  editingCardId = null;
}

function pushUndo(){
  undoStack.push(JSON.stringify({cards:cards, connections:connections}));
  if(undoStack.length > 20) undoStack.shift();
}

function undoLast(){
  if(undoStack.length < 2) return;
  undoStack.pop();
  var prev = JSON.parse(undoStack[undoStack.length - 1]);
  cards = prev.cards;
  connections = prev.connections;
  renderAll();
}

/* ====== Viewport events ====== */
var vp = document.getElementById("viewport");
var cvs = document.getElementById("canvas");

/* Pan — left drag on viewport (not on card) */
vp.addEventListener("mousedown", function(e){
  if(e.target.closest(".card")) return;
  if(e.button !== 0) return;
  /* Ctrl+左键 → 框选 */
  if(e.ctrlKey || e.metaKey){
    if(!editMode) return;
    isSelecting = true;
    selStartX = e.clientX;
    selStartY = e.clientY;
    var sb = document.getElementById("selectionBox");
    sb.style.left = e.clientX + "px";
    sb.style.top = e.clientY + "px";
    sb.style.width = "0px";
    sb.style.height = "0px";
    sb.style.display = "block";
    e.preventDefault();
    return;
  }
  isPanning = true;
  panStartX = e.clientX;
  panStartY = e.clientY;
  panOX = panX;
  panOY = panY;
  this.classList.add("dragging");
});

document.addEventListener("mousemove", function(e){
  if(isSelecting){
    var sb = document.getElementById("selectionBox");
    var l = Math.min(selStartX, e.clientX);
    var t = Math.min(selStartY, e.clientY);
    var r = Math.max(selStartX, e.clientX);
    var b = Math.max(selStartY, e.clientY);
    sb.style.left = l + "px";
    sb.style.top = t + "px";
    sb.style.width = (r - l) + "px";
    sb.style.height = (b - t) + "px";
    return;
  }
  if(!isPanning) return;
  panX = panOX + e.clientX - panStartX;
  panY = panOY + e.clientY - panStartY;
  updateTransform();
});

document.addEventListener("mouseup", function(){
  if(isSelecting){
    isSelecting = false;
    var sb = document.getElementById("selectionBox");
    sb.style.display = "none";
    confirmSelection();
    return;
  }
  if(isPanning){
    isPanning = false;
    vp.classList.remove("dragging");
  }
});

/* Zoom — scroll wheel */
vp.addEventListener("wheel", function(e){
  e.preventDefault();
  var rect = vp.getBoundingClientRect();
  var mx = e.clientX - rect.left;
  var my = e.clientY - rect.top;

  var oldScale = scale;
  var delta = e.deltaY < 0 ? 1.12 : 0.89;
  scale = Math.max(0.15, Math.min(10, scale * delta));

  /* Zoom toward mouse cursor */
  panX = mx - (mx - panX) * (scale / oldScale);
  panY = my - (my - panY) * (scale / oldScale);

  updateTransform();
}, {passive:false});

/* Right-click on viewport — add card at canvas coordinates */
vp.addEventListener("contextmenu", function(e){
  e.preventDefault();
  if(!editMode) return;
  var rect = vp.getBoundingClientRect();
  var vx = e.clientX - rect.left;
  var vy = e.clientY - rect.top;
  var cx = (vx - panX) / scale;
  var cy = (vy - panY) / scale;
  var id = "c" + Date.now() + Math.random().toString(36).slice(2,6);
  cards.push({id:id, name:"\u65b0\u4efb\u52a1", desc:"", x:cx - 120, y:cy - 65});
  pushUndo();
  renderAll();
  openEditCard(id);
});

/* 点击空白处取消选中 */
vp.addEventListener("mousedown", function(e){
  if(!editMode) return;
  if(e.target.closest(".card")) return;
  if(e.button !== 0) return;
  if(e.ctrlKey || e.metaKey) return;
  selectedCardIds = {};
  document.querySelectorAll(".card.selected").forEach(function(el){el.classList.remove("selected");});
  updateBatchBtn();
});

/* ====== 框选 ====== */
function confirmSelection(){
  var sb = document.getElementById("selectionBox");
  var l = parseFloat(sb.style.left);
  var t = parseFloat(sb.style.top);
  var r = l + parseFloat(sb.style.width);
  var b = t + parseFloat(sb.style.height);
  if(isNaN(l) || r - l < 5) return;

  selectedCardIds = {};
  document.querySelectorAll(".card.selected").forEach(function(el){el.classList.remove("selected");});

  cards.forEach(function(c){
    var el = document.getElementById("card_" + c.id);
    if(!el) return;
    var vp = document.getElementById("viewport");
    var vpr = vp.getBoundingClientRect();
    /* 卡片四个角在视口中的像素坐标 */
    var corners = [
      {x:c.x, y:c.y},
      {x:c.x + el.offsetWidth, y:c.y},
      {x:c.x, y:c.y + el.offsetHeight},
      {x:c.x + el.offsetWidth, y:c.y + el.offsetHeight}
    ];
    var inSel = false;
    for(var i = 0; i < 4; i++){
      var sx = corners[i].x * scale + panX + vpr.left;
      var sy = corners[i].y * scale + panY + vpr.top;
      if(sx >= l && sx <= r && sy >= t && sy <= b){
        inSel = true;
        break;
      }
    }
    if(inSel){
      selectedCardIds[c.id] = true;
      el.classList.add("selected");
    }
  });

  updateBatchBtn();
}

function updateBatchBtn(){
  var cnt = Object.keys(selectedCardIds).length;
  document.getElementById("batchDelBtn").style.display = cnt > 0 ? "inline-block" : "none";
  document.getElementById("alignBtn").style.display = cnt > 1 ? "inline-block" : "none";
  document.getElementById("alignBtnV").style.display = cnt > 1 ? "inline-block" : "none";
  document.getElementById("spaceBtnH").style.display = cnt > 2 ? "inline-block" : "none";
  document.getElementById("spaceBtnV").style.display = cnt > 2 ? "inline-block" : "none";
  document.getElementById("autoArrangeBtn").style.display = cnt > 1 ? "inline-block" : "none";
  if(cnt > 0){
    document.getElementById("batchDelBtn").textContent = "🗑 批量删除 (" + cnt + ")";
  }
}

function batchDelete(){
  var ids = Object.keys(selectedCardIds);
  if(!ids.length) return;
  if(!confirm("确定删除 " + ids.length + " 张选中卡片？")) return;
  ids.forEach(function(id){
    var idx = cards.findIndex(function(c){ return c.id === id; });
    if(idx >= 0) cards.splice(idx, 1);
    connections = connections.filter(function(c){ return c.from !== id && c.to !== id; });
  });
  selectedCardIds = {};
  pushUndo();
  renderAll();
  updateBatchBtn();
}

/* 平齐 */
function alignCards(dir){
  var ids = Object.keys(selectedCardIds);
  if(ids.length < 2) return;
  var selected = [];
  ids.forEach(function(id){
    var c = cards.find(function(x){ return x.id === id; });
    if(c) selected.push(c);
  });
  if(dir === 'h'){
    /* 横向平齐 — 所有卡片的 y 取平均值 */
    var sum = 0;
    selected.forEach(function(c){ sum += c.y; });
    var avg = sum / selected.length;
    selected.forEach(function(c){ c.y = avg; });
  } else {
    /* 纵向平齐 — 所有卡片的 x 取平均值 */
    var sum = 0;
    selected.forEach(function(c){ sum += c.x; });
    var avg = sum / selected.length;
    selected.forEach(function(c){ c.x = avg; });
  }
  pushUndo();
  renderAll();
}

/* 等间距排列 — 保留首尾位置，中间均匀分布 */
function spaceEvenly(dir){
  var ids = Object.keys(selectedCardIds);
  if(ids.length < 3) return;
  var sel = [];
  ids.forEach(function(id){
    var c = cards.find(function(x){ return x.id === id; });
    if(c) sel.push(c);
  });
  if(dir === 'h'){
    sel.sort(function(a,b){ return a.x - b.x; });
    var min = sel[0].x, max = sel[sel.length-1].x;
    var gap = (max - min) / (sel.length - 1);
    sel.forEach(function(c, i){ c.x = min + gap * i; });
  } else {
    sel.sort(function(a,b){ return a.y - b.y; });
    var min = sel[0].y, max = sel[sel.length-1].y;
    var gap = (max - min) / (sel.length - 1);
    sel.forEach(function(c, i){ c.y = min + gap * i; });
  }
  pushUndo();
  renderAll();
}

/* 自动整理 — 从最右上角的卡片开始，按卡片宽度+间距自动换行排列 */
function autoArrange(){
  var ids = Object.keys(selectedCardIds);
  if(ids.length < 2) return;
  var sel = [];
  ids.forEach(function(id){
    var c = cards.find(function(x){ return x.id === id; });
    if(c) sel.push(c);
  });
  /* 按右上优先排序：先 y 小（靠上），再 x 大（靠右） */
  sel.sort(function(a,b){
    if(Math.abs(a.y - b.y) < 30) return b.x - a.x;
    return a.y - b.y;
  });

  /* 取第一张卡片位置作为起点 */
  var startX = sel[0].x;
  var startY = sel[0].y;
  var cardW = 240;  /* 卡片宽度已知 */
  var gap = 30;

  /* 智能计算每行数量：尽量让每行数量相近 */
  var total = sel.length;
  var bestCols = Math.ceil(Math.sqrt(total));
  /* 尝试让行数接近列数，但不能超过6列 */
  var cols = Math.min(Math.max(Math.ceil(Math.sqrt(total)), 2), 6);

  /* 从右上开始，逐行从左到右排列 */
  var idx = 0;
  for(var row = 0; idx < total; row++){
    var remain = total - idx;
    var thisCols = remain < cols ? remain : cols;
    var rowWidth = thisCols * cardW + (thisCols - 1) * gap;
    for(var col = 0; col < thisCols && idx < total; col++){
      sel[idx].x = startX + col * (cardW + gap);
      sel[idx].y = startY + row * (130 + gap);
      idx++;
    }
  }

  pushUndo();
  renderAll();
}

/* ====== 画布切换面板（手风琴）===== */
function renderCanvasPanel(){

  var acc = document.createElement("div");
  acc.className = "cp-accordion open";

  arrow.textContent = "▶";

  list.className = "cp-list open";
  canvasList.forEach(function(cv){
    var item = document.createElement("div");
    item.className = "cp-item" + (cv.id === currentCanvas ? " active" : "");
    var dot = document.createElement("span");
    dot.className = "cp-dot";
    dot.style.background = cv.color || "#888";

      chk.style.color = "#ffc832";

    } else {
      /* 非当前画布可删除 */
        var del = document.createElement("span");
        del.className = "cp-del";
        del.textContent = "✕";
        (function(cvid, cvlabel){
          del.onclick = function(e){
            e.stopPropagation();
            if(!confirm('确定删除赛季任务「' + cvlabel + '」？')) return;
            deleteCanvasDB(cvid).then(function(){
              canvasList = canvasList.filter(function(x){ return x.id !== cvid; });
              renderCanvasPanel();
            }).catch(function(e){ console.error('Delete canvas error', e); });
          };
        })(cv.id, cv.label);
        item.appendChild(del);
    }
    (function(cid){
      item.onclick = function(){
        p.classList.remove("show");
        loadCanvas(cid);
        editMode = false;
        document.getElementById("editToggle").style.display = "inline-block";
        document.getElementById("saveBtn").style.display = "none";
        document.getElementById("cancelBtn").style.display = "none";
        document.getElementById("toolbar").style.display = "none";
      };
    })(cv.id);
    list.appendChild(item);
  });
  p.appendChild(list);

  /* 添加画布 */
  /* 添加画布（仅管理员） */
  if(canEdit()){
    var addBtn = document.createElement("div");
    addBtn.className = "cp-add";
    addBtn.textContent = "+ 新建赛季任务";
    addBtn.onclick = function(){
      var name = prompt("新建赛季任务名称：");
      if(!name || !name.trim()) return;
      name = name.trim();
      var tk = localStorage.getItem('abi_token');
      if(!tk){ if(confirm('需要登录才能创建。去登录？')) loginGitHub(); return; }
      /* 查重 */
      var dup = canvasList.some(function(cv){ return cv.label === name; });
      if(dup){ alert('已存在同名赛季任务「' + name + '」'); return; }
      var id = 'custom_' + Date.now();
      canvasList.push({id:id, label:name, color:'#aaa'});
      fetch(SUPABASE_URL+'/rest/v1/task_canvases',{
        method:'POST', headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+tk,'Content-Type':'application/json'},
        body: JSON.stringify({id:id, label:name, color:'#aaa'})
      }).catch(function(e){ console.error('Save new canvas error', e); });
      renderCanvasPanel();
    };
    p.appendChild(addBtn);
  }

  /* 重命名当前画布 */
  if(currentCanvas !== 'default'){
    var renameBtn = document.createElement("div");
    renameBtn.className = "cp-rename";
    renameBtn.textContent = "✏ 重命名当前赛季任务";
    renameBtn.onclick = function(){
      var cv = canvasList.find(function(x){ return x.id === currentCanvas; });
      if(!cv) return;
      var name = prompt("新名称：", cv.label);
      if(!name || !name.trim()) return;
      name = name.trim();
      /* 查重（排除自己） */
      var dup = canvasList.some(function(x){ return x.id !== currentCanvas && x.label === name; });
      if(dup){ alert('已存在同名赛季任务「' + name + '」'); return; }
      cv.label = name;
      var tk = localStorage.getItem('abi_token');
      if(tk){
        fetch(SUPABASE_URL+'/rest/v1/task_canvases?id=eq.'+encodeURIComponent(currentCanvas),{
          method:'PATCH', headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+tk,'Content-Type':'application/json'},
          body: JSON.stringify({label:name})
        }).catch(function(e){ console.error('Rename canvas error', e); });
      }
      renderCanvasPanel();
    };
    p.appendChild(renameBtn);
  }
}

function saveCanvasList(){
  /* 保存到 Supabase */
  var promises = canvasList
    .filter(function(cv){ return cv.id !== 'default'; })
    .map(function(cv){
      return db('POST','task_canvases',{id:cv.id, label:cv.label, color:cv.color||'#888'});
    });
  Promise.all(promises).catch(function(e){ console.error('Save canvas list error', e); });
}

function loadCanvasList(){
  importLocalDataIfNeeded().then(function(){
    return db('GET','task_canvases','','order=created_at');
  }).then(function(rows){
    if(rows && rows.length > 0){
      canvasList = rows.map(function(r){ return {id:r.id, label:r.label, color:r.color||'#888'}; });
    } else {
      /* 如果没有画布，创建一个默认的 */
      canvasList = [{id:'default', label:'默认赛季任务', color:'#ffc832'}];

    loadData();
  }).catch(function(e){
    console.error('Load canvas list error', e);
    canvasList = [{id:'default', label:'默认赛季任务', color:'#ffc832'}];
    loadData();
  });
}

/* 编辑权限检查：只有你的 GitHub 账号能编辑 */
var ALLOWED_GITHUB_USER = 'qiuxue111'; /* 你的 GitHub 用户名 */
function canEdit(){
  var token = localStorage.getItem('abi_token');
  if(!token) return false;
  try {
    var b64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length%4) b64 += '=';
    var payload = JSON.parse(atob(b64));
    return payload.email === ALLOWED_GITHUB_USER + '@users.noreply.github.com' || 
           payload.user_metadata && payload.user_metadata.user_name === ALLOWED_GITHUB_USER ||
           payload.preferred_username === ALLOWED_GITHUB_USER ||
           payload.email && payload.email.split('@')[0] === ALLOWED_GITHUB_USER;
  } catch(e){ return false; }
}

function toggleHamburger(){
  var m = document.getElementById('hamburgerMenu');
  if(!m) return;
  if(m.classList.contains('show')){ m.classList.remove('show'); return; }
  m.classList.add('show'); m.innerHTML = '';
  var curPath = window.location.pathname;
  var curFile = curPath.substring(curPath.lastIndexOf('/') + 1) || 'index.html';
  navGroups.forEach(function(g){
    if(g.sep){
      var sep = document.createElement('div'); sep.className = 'hm-sep';
      m.appendChild(sep);
      return;
    }
    if(g.sub){
      var wrap = document.createElement('div'); wrap.className = 'hm-group-wrap';
      var gl = document.createElement('div'); gl.className = 'hm-group-label';
      gl.textContent = g.label;
      wrap.appendChild(gl);
      var sub = document.createElement('div'); sub.className = 'hm-sub';
      g.items.forEach(function(it){
        var item = document.createElement('div'); item.className = 'hm-item';
        if(it.url && it.url.indexOf(curFile) >= 0) item.classList.add('active');
        item.textContent = it.label;
        (function(u){ item.onclick = function(){ window.location.href = u; }; })(it.url);
        sub.appendChild(item);
      });
      wrap.appendChild(sub);
      gl.style.cursor = 'pointer';
      gl.onclick = function(e){
        e.stopPropagation();
        this.parentNode.querySelector('.hm-sub').classList.toggle('open');
      };
      m.appendChild(wrap);
      return;
    }
    var gl = document.createElement('div'); gl.className = 'hm-group-label';
    gl.textContent = g.label;
    if(g.url && g.url.indexOf(curFile) >= 0) gl.classList.add('active');
    (function(u, a){
      gl.onclick = function(){
        if(a === 'logout'){
          if(typeof logout === 'function') logout();
          else { localStorage.removeItem('abi_token'); localStorage.removeItem('abi_user'); alert('已退出'); }
          return;
        }
        if(u) window.location.href = u;
      };
    })(g.url, g.action);
    gl.style.cursor = 'pointer';
    m.appendChild(gl);
  });
}

/* 汉堡可拖拽 */
(function(){
  var el = document.getElementById('hamburger');
  el.addEventListener('mousedown', function(e){
    if(e.button !== 0) return;
    var rect = el.getBoundingClientRect();
    var ox = e.clientX - rect.left, oy = e.clientY - rect.top;
    function mm(ev){
      el.style.left = (ev.clientX - ox) + 'px';
      el.style.top = (ev.clientY - oy) + 'px';
    }
    function mu(){ document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); }
    document.addEventListener('mousemove', mm);
    document.addEventListener('mouseup', mu);
  });
})();
