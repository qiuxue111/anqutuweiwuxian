<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暗区突围：无限 - 闲聊</title>
  <link rel="icon" href="../favicon.ico" type="image/jpeg">
  <link rel="stylesheet" href="../style.css">
  <style>
    .post-form { background:#12121a; border:1px solid #1e1e2a; border-radius:12px; padding:1.5rem; margin-bottom:2rem; }
    .post-form h3 { color:#ffc832; margin-bottom:1rem; }
    .post-form input, .post-form textarea, .post-form select {
      width:100%; padding:0.6rem; background:#1a1a22; color:#fff; border:1px solid #333; border-radius:6px; margin-bottom:0.8rem; font-size:0.9rem;
    }
    .post-form textarea { min-height:120px; resize:vertical; }
    .post-form button { padding:0.5rem 1.5rem; background:#ffc832; color:#0a0a0f; border:none; border-radius:6px; cursor:pointer; font-weight:600; }
    .post-form button:hover { background:#ffd84a; }
    .post-card { background:#12121a; border:1px solid #1e1e2a; border-radius:10px; padding:1.2rem; margin-bottom:1rem; }
    .post-card h3 { margin:0 0 0.3rem 0; font-size:1.1rem; }
    .post-card h3 a { color:#ffc832; text-decoration:none; }
    .post-card .meta { color:#666; font-size:0.8rem; margin-bottom:0.5rem; display:flex; gap:1rem; }
    .post-card .preview { color:#aaa; font-size:0.9rem; line-height:1.5; }
    .no-posts { color:#666; text-align:center; padding:3rem 0; font-size:1rem; }
    .login-hint { color:#888; text-align:center; padding:2rem; background:#12121a; border:1px solid #1e1e2a; border-radius:10px; margin-bottom:2rem; }
    .login-hint button { padding:0.4rem 1.2rem; background:#ffc832; color:#0a0a0f; border:none; border-radius:6px; cursor:pointer; }
    .post-card .actions { margin-top:0.5rem; }
    .post-card .actions button { padding:0.2rem 0.6rem; background:#3a1a1a; color:#f66; border:none; border-radius:4px; cursor:pointer; font-size:0.75rem; }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="logo"><a href="../index.html" style="color:#ffc832;text-decoration:none;">暗区无限</a> <span>攻略站</span></div>
  <ul class="nav-links">
    <li><a href="maps.html">地图</a></li>
    <li><a href="weapons.html">帖子</a></li>
    <li><a href="strategy.html">闲聊</a></li>
    <li><a href="gear.html">攻略</a></li>
    <li><a href="../search.html">🔍</a></li>
  </ul>
  <button id="loginBtn" onclick="loginGitHub()" style="padding:0.2rem 0.5rem;background:#333;color:#ccc;border:1px solid #555;border-radius:4px;font-size:0.75rem;cursor:pointer;margin-left:auto;flex-shrink:0;">登录</button>
</nav>

<section style="max-width:800px;margin:80px auto 0;padding:1rem;">
<div style="display:flex;align-items:center;">  <h2 style="color:#ffc832;margin-bottom:1.5rem;">💬 闲聊</h2>
  <button id="fabBtn-strategy" onclick="window.fabOpenPostForm()" style="display:none;width:36px;height:36px;border-radius:50%;background:#ffc832;color:#0a0a0f;border:none;font-size:1.5rem;cursor:pointer;line-height:1;margin-left:auto;flex-shrink:0;" title="发布帖子">+</button></div>


  <div id="loginHint" class="login-hint" style="display:none;">
    <p style="margin-bottom:1rem;">登录后可以发布帖子</p>
    <button onclick="loginGitHub()">GitHub 登录</button>
  </div>

  <div id="postForm" class="post-form" style="display:none;">
    <h3>发布帖子</h3>
    <input id="postTitle" type="text" placeholder="标题">
    <select id="postCategory">
      <option value="general">杂谈</option>
      <option value="question">问答</option>
      <option value="guide">攻略</option>
      <option value="showoff">炫耀</option>
    </select>
    <textarea id="postContent" placeholder="内容..."></textarea>
    <button onclick="submitPost()">发布</button>
  </div>

  <div id="postList"></div>
</section>

<footer style="margin-top:3rem;">
  <p>暗区突围：无限 攻略站 · 由 秋雪 制作 · 持续更新中</p>
  <p style="margin-top:0.3rem;">数据基于 PC 版本 · 仅供参考</p>
</footer>

<script>
var currentUser=null, currentToken=null;
function supabase(method, table, body, q) {
  var key='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhbnJmYmNpaW5raGdjdW12b3VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTA4ODAsImV4cCI6MjA5NTM4Njg4MH0.Q7JBpwAqpYbEpwLq7werjtAtgjU4pIcHg4JbwFZ2vok';
  var bearer=key;
  return fetch('https://hanrfbciinkhgcumvous.supabase.co/rest/v1/'+table+(q?'?'+q:''),{
    method:method, headers:{'Authorization':'Bearer '+bearer, 'apiKey':key, 'Content-Type':'application/json'},
    body:body?JSON.stringify(body):null});
}

function loginGitHub(){
  var cb=window.location.origin+window.location.pathname;
  var u='https://hanrfbciinkhgcumvous.supabase.co/auth/v1/authorize?provider=github&redirect_to='+encodeURIComponent(cb);
  window.location.href=u;}


  function init(){
  var h=window.location.hash;
  if(h&&h.includes('access_token=')){
    var p=new URLSearchParams(h.slice(1));
    var t=p.get('access_token');
    if(t){localStorage.setItem('abi_token',t);localStorage.setItem('abi_user',p.get('email')||'');window.location.hash='';location.reload();}
  }
  var t=localStorage.getItem('abi_token');currentToken=t;
  var u=localStorage.getItem('abi_user');if(u)currentUser=u;
  if(currentUser){var fb=document.getElementById('fabBtn-strategy');if(fb)fb.style.display='';}
  else{document.getElementById('loginHint').style.display='block';}
  loadPosts();
}

async function loadPosts(){
  try{
    var r=await supabase('GET','map_posts',null,'order=created_at.desc');
    if(!r.ok)return;
    var posts=await r.json();if(!Array.isArray(posts))return;
    var h='';
    if(posts.length===0){h='<div class="no-posts">还没有帖子，快来发布第一条！</div>';}
    else{posts.forEach(function(p){h+=
      '<div class="post-card"><h3><a href="#post-'+p.id+'">'+esc(p.title)+'</a></h3>'+
      '<div class="meta"><span>'+esc(p.author||'匿名')+'</span><span>'+p.category+'</span><span>'+new Date(p.created_at).toLocaleDateString('zh-CN')+'</span></div>'+
      '<div class="preview">'+esc(p.content).substring(0,200)+(p.content.length>200?'...':'')+'</div>'+
      (currentUser?'<div class="actions"><button onclick="deletePost('+p.id+')">删除</button></div>':'')+
      '</div>';});}
    document.getElementById('postList').innerHTML=h;
  }catch(e){}
}

function esc(s){var d=document.createElement('div');d.appendChild(document.createTextNode(s||''));return d.innerHTML;}

async function submitPost(){
  var title=document.getElementById('postTitle').value.trim();
  var content=document.getElementById('postContent').value.trim();
  var category=document.getElementById('postCategory').value;
  if(!title||!content){alert('标题和内容不能为空');return;}
  try{
    var r=await supabase('POST','map_posts',{title:title,content:content,category:category,author:currentUser||'匿名',map_name:'general'});
    if(r.ok||r.status===201){document.getElementById('postTitle').value='';document.getElementById('postContent').value='';loadPosts();alert('发布成功！');}
    else{var t=await r.text();alert('发布失败: '+t);}
  }catch(e){alert('发布失败');}
}

async function deletePost(id){
  if(!confirm('确定删除？'))return;
  try{var r=await supabase('DELETE','map_posts',null,'id=eq.'+id);if(r.ok||r.status===204)loadPosts();else alert('删除失败');}
  catch(e){alert('删除失败');}
}

document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
