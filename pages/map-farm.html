<html lang="zh-CN">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#ddd;font-family:-apple-system,"Microsoft YaHei",sans-serif}
nav{display:flex;justify-content:space-between;align-items:center;padding:0 1rem;height:50px;background:#0f0f16;border-bottom:1px solid #222}
.logo{color:#ffc832;font-weight:bold;font-size:16px;text-decoration:none}
.map-wrap{position:relative;width:100%;max-width:1200px;margin:1rem auto;border:1px solid #1e1e2a;border-radius:12px;overflow:hidden}
.map-wrap img{display:block;width:100%;-webkit-user-drag:none;user-select:none;pointer-events:none}
.ctrl{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0f0f16;border-top:1px solid #1e1e2a;flex-wrap:wrap}
.ctrl button{background:#1e1e2a;border:none;color:#ccc;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.ctrl button:hover{background:#2a2a3a;color:#ffc832}
.ctrl button.mode{background:transparent;border:1px solid rgba(255,200,50,.2);color:#ffc832;margin-left:auto}
.ctrl input[type=range]{width:80px;accent-color:#ffc832}
.ctrl span{color:#888;font-size:12px;min-width:35px;text-align:center}
.ly-btn{position:absolute;top:8px;right:8px;z-index:10;background:rgba(0,0,0,.6);border:1px solid #333;color:#ddd;padding:16px 40px;border-radius:16px;cursor:pointer;font-size:52px}
.crosshair{display:none;position:fixed;z-index:9997;pointer-events:none;width:40px;height:40px;transform:translate(-50%,-50%)}
.crosshair.show{display:block}
.crosshair .ch-h,.crosshair .ch-v{position:absolute;background:rgba(255,200,50,.8)}
.crosshair .ch-h{top:50%;left:0;width:100%;height:2px;transform:translateY(-50%)}
.crosshair .ch-v{top:0;left:50%;width:2px;height:100%;transform:translateX(-50%)}
.crosshair .ch-dot{position:absolute;top:50%;left:50%;width:10px;height:10px;border:2px solid #ffc832;border-radius:50%;transform:translate(-50%,-50%);background:rgba(255,200,50,.15)}
.ly-btn:hover{background:rgba(0,0,0,.8);color:#ffc832}
.ly-pop{display:none;position:fixed;top:75px;right:16px;background:rgba(18,18,26,.96);border:1px solid #1e1e2a;border-radius:16px;padding:24px;max-height:80vh;overflow-y:auto;min-width:600px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.ly-pop.show{display:block}
.ly-pop label{display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer;font-size:28px;color:#ccc;border-radius:12px;margin-bottom:4px}
.ly-pop label:hover{background:rgba(255,200,50,.08)}
.ly-pop input{accent-color:#ffc832;margin:0;width:32px;height:32px}
.ly-pop .ly-icon{width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0;display:inline-block;vertical-align:middle}
.ly-pop .ly-icon.e{width:48px;text-align:center;font-size:36px;line-height:48px}
.ly-pop .all-label{justify-content:center;border:1px solid rgba(255,200,50,.3);border-radius:12px;padding:16px;margin-bottom:12px;font-size:28px}
.ly-pop .ly-card{background:rgba(255,255,255,.03);border:1px solid #1e1e2a;border-radius:12px;padding:12px;margin-bottom:10px}
.ly-pop .ly-card-hdr{display:flex;align-items:center;gap:10px;padding:6px 8px 10px;border-bottom:1px solid rgba(255,200,50,.15);margin-bottom:4px;font-size:22px;color:#ffc832;font-weight:600}
.ly-pop .ly-card-hdr input{width:24px;height:24px}
#vm{padding:8px 12px;background:#12121a;border:1px solid #1e1e2a;border-radius:10px;margin:0 0 1rem;display:flex;align-items:center;gap:8px}
#vm .coord{color:#ffc832;font-family:monospace;font-size:14px}
#vm .sel-btn{display:none;padding:5px 12px;background:#ffc832;color:#0a0a0f;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px}
/* ─── 容器详情弹窗 ─── */
.pd-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:9998;justify-content:center;align-items:center}
.pd-overlay.show{display:flex}
.pd-box{background:#12121a;border:1px solid #1e1e2a;border-radius:16px;width:90%;max-width:520px;max-height:85vh;overflow-y:auto;padding:24px;position:relative;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.pd-close{position:absolute;top:12px;right:16px;color:#666;font-size:22px;cursor:pointer;background:none;border:none}
.pd-close:hover{color:#ffc832}
.pd-title{font-size:22px;color:#ffc832;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.pd-coord{color:#888;font-size:13px;margin-bottom:16px;font-family:monospace}
.pd-section-title{color:#ffc832;font-size:15px;margin:16px 0 8px;font-weight:600;border-bottom:1px solid rgba(255,200,50,.15);padding-bottom:4px}
.pd-note{width:100%;min-height:80px;background:#0a0a10;border:1px solid #1e1e2a;border-radius:8px;color:#ddd;padding:10px;font-size:14px;resize:vertical;font-family:inherit}
.pd-note:focus{outline:none;border-color:#ffc832}
.pd-save-note{padding:6px 16px;background:#ffc832;color:#0a0a0f;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px;margin-top:6px}
.pd-save-note:hover{background:#e6b42e}
.pd-img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pd-img-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid #1e1e2a;cursor:pointer}
.pd-img-grid img:hover{border-color:#ffc832}
.pd-add-img{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border:2px dashed #333;border-radius:6px;cursor:pointer;color:#666;font-size:28px}
.pd-add-img:hover{border-color:#ffc832;color:#ffc832}
.pd-comments{margin-top:16px;border-top:1px solid #1e1e2a;padding-top:12px}
.pd-comments .pdc-title{color:#ffc832;font-size:15px;font-weight:600;margin-bottom:8px}
.pd-comments textarea{width:100%;min-height:40px;background:#0a0a10;border:1px solid #1e1e2a;border-radius:8px;color:#ddd;padding:8px;font-size:13px;resize:vertical;font-family:inherit}
.pd-comments textarea:focus{outline:none;border-color:#ffc832}
.pd-comments .pdc-btn{padding:4px 12px;background:#ffc832;color:#0a0a0f;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:12px;margin-top:4px}
.pd-comments .pdc-list{margin-top:8px;max-height:200px;overflow-y:auto}
.pd-comments .pdc-item{padding:6px 8px;background:#0a0a10;border-radius:6px;margin-bottom:4px;font-size:13px;color:#ccc}
.pd-comments .pdc-item .pdc-time{color:#666;font-size:11px;float:right}
/* ─── 地图全局评论区 ─── */
.map-comments{margin:1rem auto;max-width:1200px;background:#12121a;border:1px solid #1e1e2a;border-radius:12px;padding:16px}
.map-comments h3{color:#ffc832;font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.map-comments textarea{width:100%;min-height:60px;background:#0a0a10;border:1px solid #1e1e2a;border-radius:8px;color:#ddd;padding:10px;font-size:14px;resize:vertical;font-family:inherit}
.map-comments textarea:focus{outline:none;border-color:#ffc832}
.map-comments .mc-actions{display:flex;gap:8px;margin-top:6px;align-items:center}
.map-comments .mc-actions button{padding:6px 16px;background:#ffc832;color:#0a0a0f;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px}
.map-comments .mc-actions button:hover{background:#e6b42e}
.map-comments .mc-list{margin-top:12px}
.map-comments .mc-item{padding:8px 10px;background:#0a0a10;border-radius:8px;margin-bottom:6px;font-size:14px;color:#ccc}
.map-comments .mc-item .mc-time{color:#666;font-size:11px;float:right}
</style>
</head>

<style>
.navbar{display:flex;align-items:center;padding:0.5rem 1rem;background:#0a0a10;border-bottom:1px solid #1a1a28;position:relative;z-index:100;}

<div class="map-wrap">
  <button class="ly-btn" id="lbb">图层</button>
  <div id="mv" style="transform-origin:0 0;cursor:grab">
    <img src="../assets/maps/farm.png" draggable="false" id="mapImg" style="display:block;width:100%">
  </div>
  </div>
  <div class="ctrl">
    <button onclick="zoom(0.85)">-</button>
    <input type="range" id="zr" min="20" max="800" value="100" oninput="zoomTo(+this.value)">
    <button onclick="zoom(1.18)">+</button>
    <button onclick="resetView()">&#x27F2;</button>
    <span id="zl">100%</span>
    <button id="mdBtn" class="mode" onclick="toggleMode()">&#x1F441;&#xFE0F; 浏览</button>
  </div>
<div class="ly-pop" id="lp"></div>
<div class="crosshair" id="ch"><div class="ch-v"></div><div class="ch-h"></div><div class="ch-dot"></div></div>
<div id="vm"><span>当前位置：</span><span class="coord" id="cv">未选择</span><button class="sel-btn" id="ab">选择容器类型 →</button></div>

<!-- 容器详情弹窗 -->
<div class="pd-overlay" id="pd">
  <div class="pd-box">
    <button class="pd-close" onclick="closePinDetail()">✕</button>
    <div class="pd-title" id="pdTitle">容器名称</div>
    <div class="pd-coord" id="pdCoord">位置</div>

    <div class="pd-section-title">📝 备注</div>
    <textarea class="pd-note" id="pdNote" placeholder="写下关于这个容器的备注……"></textarea>
    <button class="pd-save-note" onclick="savePinNote()">保存备注</button>

    <div class="pd-section-title">🖼️ 图片</div>
    <div class="pd-img-grid" id="pdImgGrid"></div>
    <input type="file" id="pdImgInput" accept="image/*" style="display:none" multiple onchange="addPinImages(this.files)">

    <div style="margin-top:16px;display:flex;gap:8px">
      <button onclick="deleteCurrentPin()" style="padding:6px 14px;background:#4a1a1a;color:#e55;border:none;border-radius:6px;cursor:pointer;font-size:13px">🗑 删除此点位</button>
    </div>

<div class="map-comments">

  <div class="mc-actions">
    <button onclick="postMapComment()">发表评论</button>
  </div>

<script>



// ========== GLOBAL AUTH & NAV ==========
function loginGitHub(){
  var cb=window.location.origin+window.location.pathname;
  var u='https://hanrfbciinkhgcumvous.supabase.co/auth/v1/authorize?provider=github&redirect_to='+encodeURIComponent(cb);
  window.location.href=u;
}

(function initAuth(){
  var h=window.location.hash;
  if(h&&h.indexOf('access_token=')>=0){
    var p=new URLSearchParams(h.replace('#',''));
    var t=p.get('access_token');
    if(t){
      try{
        var payload=JSON.parse(atob(t.split('.')[1]));
        localStorage.setItem('abi_token',t);
        var email=payload.preferred_username||payload.user_metadata?.preferred_username||payload.email||p.get('email')||'';
        localStorage.setItem('abi_user',email);
        history.replaceState(null,'',window.location.pathname);
        location.reload();
      }catch(e){}
    }
  }
  var token=localStorage.getItem('abi_token');
  if(token){
    var u=document.getElementById('userName');
    var b=document.getElementById('loginBtn');
    if(u){u.style.display='';u.textContent=localStorage.getItem('abi_user')||'已登录';}
    if(b){b.style.display='none';}
  }
})();

function toggleMenu(){
  var m=document.getElementById('sideMenu');
  if(!m)return;
  m.style.display=m.style.display==='none'?'block':'none';
}

function logout(){
  localStorage.removeItem('abi_token');
  localStorage.removeItem('abi_user');
  location.reload();
}

function showUserCenter(){
  toggleMenu();
  var u=localStorage.getItem('abi_user');
  if(!u){alert('请先登录');return;}
  var info='[用户中心]\n用户名: '+u+'\n(更多功能开发中)';
  alert(info);
}



function supabase(t,m,b,q){
  var u=SUPABASE_URL+"/rest/v1/"+t;if(q)u+="?"+q;
  var tk=localStorage.getItem("abi_token");
  var token=SUPABASE_ANON_KEY;
  if(tk){
    try{
      var p=JSON.parse(atob(tk.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
      if(p.exp&&p.exp*1000>Date.now())token=tk;
    }catch(e){}
  }
  var o={method:m||"GET",headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+token,"Content-Type":"application/json"}};
  if(b&&m!=="GET")o.body=JSON.stringify(b);
  return fetch(u,o).then(function(r){
    if(!r.ok){throw new Error("HTTP "+r.status+" for "+t);}
    return r.json().catch(function(){return [];});
  });
}
var cloudPins=[],cloudComments=[];
function loadCloudPins(){
  var a=[];
  a.push(supabase("pins","GET",null,"map_name=eq.%E5%86%9C%E5%9C%BA").then(function(d){if(d&&d.length){cloudPins=d;cloudPins.forEach(function(p){delete p.created_at;});}}));
  a.push(supabase("map_comments","GET",null,"map_name=eq.%E5%86%9C%E5%9C%BA").then(function(d){if(d&&d.length){cloudComments=d;cloudComments.forEach(function(c){delete c.id;delete c.created_at;});}}));
  Promise.all(a).then(function(){
    pins=cloudPins.slice();
    mapComments=cloudComments.slice();
    savePins();
    renderMarkers();renderMapComments();
    // URL param jump after data ready
    jumpToFromUrl();
  }).catch(function(){
    try{var d=JSON.parse(localStorage.getItem("abi_farm_pins"));if(d){if(d.pins)pins=d.pins;if(d.mapComments)mapComments=d.mapComments;renderMarkers();renderMapComments();jumpToFromUrl();}}catch(e){}
  });
}

// ─── 容器详情弹窗 ───
function showPinDetail(idx){
  curPinIdx=idx;
  var p=pins[idx];
  document.getElementById("pdTitle").innerHTML="<img src='"+(p.ic||"")+"' style='width:28px;height:28px;border-radius:4px;object-fit:cover'> "+p.name;
  document.getElementById("pdCoord").textContent="位置： "+p.x+"%, "+p.y+"%";
  document.getElementById("pdNote").value=p.note||"";
  renderPinImages();
  renderPinComments();
  document.getElementById("pd").classList.add("show");
}
function closePinDetail(){document.getElementById("pd").classList.remove("show");curPinIdx=null;}
function savePinNote(){
  if(curPinIdx===null)return;
  pins[curPinIdx].note=document.getElementById("pdNote").value;
  savePins();
}
function renderPinImages(){
  var grid=document.getElementById("pdImgGrid");grid.innerHTML="";
  if(curPinIdx===null)return;
  var imgs=pins[curPinIdx].images||[];
  imgs.forEach(function(src,i){
    var img=document.createElement("img");img.src=src;
    img.onclick=function(){var r=confirm("删除此图片？");if(r){pins[curPinIdx].images.splice(i,1);savePins();renderPinImages();}};
    grid.appendChild(img);
  });
  var addBtn=document.createElement("div");addBtn.className="pd-add-img";addBtn.textContent="+";
  addBtn.onclick=function(){document.getElementById("pdImgInput").click();};
  grid.appendChild(addBtn);
}
function addPinImages(files){
  if(curPinIdx===null||!files.length)return;
  var done=0,total=files.length;
  for(var i=0;i<files.length;i++){
    (function(file){
      var reader=new FileReader();
      reader.onload=function(e){
        pins[curPinIdx].images.push(e.target.result);
        done++;
        if(done===total){savePins();renderPinImages();}
      };
      reader.readAsDataURL(file);
    })(files[i]);
  }
}
function deleteCurrentPin(){
  if(!localStorage.getItem('abi_token')){loginGitHub();return;}
  if(curPinIdx===null)return;
  var p=pins[curPinIdx];
  if(!confirm("确认提交删除申请？其他人将可以对此投票，审核通过后该点位才会被移除。"))return;
  if(p.id){
    supabase("deletion_requests","POST",{pin_id:p.id,name:p.name,x:p.x,y:p.y,submitted_by:(currentUser.user_metadata&&(currentUser.user_metadata.user_name||currentUser.user_metadata.name||currentUser.user_metadata.preferred_username||"匿名"))||"匿名",reason:"用户提交",votes:0}).then(function(){
      alert("删除申请已提交，等待审核投票。");
    }).catch(function(){
      alert("提交删除申请失败，请重试。");
    });
  }else{
    pins.splice(curPinIdx,1);curPinIdx=null;
    savePins();renderMarkers();closePinDetail();
  }
}

// ─── 容器点位评论区 ───
function renderPinComments(){
  var list=document.getElementById("pdcList");list.innerHTML="";
  if(curPinIdx===null)return;
  var comments=pins[curPinIdx].comments||[];
  comments.forEach(function(c){
    var item=document.createElement("div");item.className="pdc-item";
    var time=document.createElement("span");time.className="pdc-time";time.textContent=c.time;
    var user=c.user_name?"<strong style='color:#ffc832'>"+c.user_name+"<\/strong> ":"";
    item.innerHTML=user+c.text;
    item.appendChild(time);list.appendChild(item);
  });
}
function postPinComment(){
  if(curPinIdx===null)return;
  var input=document.getElementById("pdcInput");
  var text=input.value.trim();
  if(!text)return;
  var now=new Date();
  var tz=now.toLocaleString("zh-CN",{hour12:false,timeZone:"Asia/Shanghai"});
  var userName=currentUser&&currentUser.user_metadata&&(currentUser.user_metadata.user_name||currentUser.user_metadata.preferred_username||currentUser.user_metadata.name)||"匿名";
  var p=pins[curPinIdx];
  if(p.id){
    supabase("map_comments","POST",{text:text,time:tz,user_name:userName});
  }
  p.comments.push({text:text,time:tz,user_name:userName});
  savePins();renderPinComments();
  input.value="";
}

// ─── 地图评论区 ───
function renderMapComments(){
  var list=document.getElementById("mcList");list.innerHTML="";
  mapComments.forEach(function(c){
    var item=document.createElement("div");item.className="mc-item";

  var x=s.get("x"),y=s.get("y"),name=s.get("name"),type=s.get("type"),ic=s.get("ic");
  if(!x||!y)return;
  var xf=parseFloat(x),yf=parseFloat(y);
  // Zoom to 800% and center on the point
  scale=8;
  var container=document.querySelector(".map-wrap");
  var r=container.getBoundingClientRect();
  var centerX=r.width/2,centerY=r.height/2;
  var img=document.getElementById("mapImg");
  var iw=img.clientWidth,ih=img.clientHeight;
  panX=centerX-xf/100*iw*scale;
  panY=centerY-yf/100*ih*scale;
  updateTransform();
  document.getElementById("zr").value=800;
  document.getElementById("zl").textContent="800%";
  // Add a temporary marker pin at the target location
  addTempMarker(xf,yf,ic);
  // If we have name+type+ic, show floating info card (no pin detail popup)
  if(name){
    showPinInfo(xf,yf,name,type,ic);
    return;
  }
  // Try to find matching pin
  for(var i=0;i<pins.length;i++){
    var d=Math.abs(pins[i].x-xf)+Math.abs(pins[i].y-yf);
    if(d<3){showPinDetail(i);return;}
  }
  pp={x:xf,y:yf};
  showPicker();
}

function addTempMarker(x,y,ic){

function zoom(f,cx,cy){
  if(cx===void 0||cy===void 0){scaleM*=f;if(scaleM<0.2)scaleM=0.2;if(scaleM>8)scaleM=8;ut();return;}
  var prev=scaleM;scaleM*=f;
  if(scaleM<0.2)scaleM=0.2;if(scaleM>8)scaleM=8;
  var img=document.getElementById('mapImg');if(!img)return;
  var wrap=document.querySelector('.map-wrap');if(!wrap)return;
  var wr=wrap.getBoundingClientRect();
  // Mouse pos relative to map-wrap (fixed, no transform)
  var mx=cx-wr.left, my=cy-wr.top;
  // Convert to image coords: (mouse_in_wrap - panX) / prev_scale
  var imgX=(mx-panX)/prev, imgY=(my-panY)/prev;
  // New pan so image point stays under mouse
  panX=mx-imgX*scaleM; panY=my-imgY*scaleM;
  ut();
}

function zoomTo(v,cx,cy){
  v=v/100;if(v<0.2)v=0.2;if(v>8)v=8;
  if(cx!==void 0&&cy!==void 0){
    var wrap=document.querySelector('.map-wrap');if(!wrap)return;
    var wr=wrap.getBoundingClientRect();
    var mx=cx-wr.left, my=cy-wr.top;
    var imgX=(mx-panX)/scaleM, imgY=(my-panY)/scaleM;
    panX=mx-imgX*v; panY=my-imgY*v;
  }
  scaleM=v;ut();
}

  var cats={};pinTypes.forEach(function(t){if(!cats[t.c])cats[t.c]=[];cats[t.c].push(t);});
  var order=['物资','弹药','医疗','工具','文档','衣物','家具','贵重','容器','军备','武器','配件','钥匙','密室','敌人','BOSS','其他'];
  order.forEach(function(cat){if(!cats[cat])return;var s=document.createElement('div');s.style.cssText='margin-bottom:10px';var h=document.createElement('div');h.style.cssText='color:#888;font-size:12px;margin-bottom:4px;padding:0 4px';h.textContent=cat;s.appendChild(h);var g=document.createElement('div');g.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:6px';cats[cat].forEach(function(t){var b=document.createElement('button');b.style.cssText='padding:8px 4px;background:rgba(255,200,50,.08);border:1px solid rgba(255,200,50,.12);border-radius:8px;color:#ddd;cursor:pointer;font-size:13px;';b.textContent=t.n;b.onmouseenter=function(){this.style.background='rgba(255,200,50,.2)';};b.onmouseleave=function(){this.style.background='rgba(255,200,50,.08)';};b.onclick=function(){placePin(t);menu.remove();};g.appendChild(b);});s.appendChild(g);menu.appendChild(s);});
  var cb=document.createElement('button');cb.textContent='取消';cb.style.cssText='margin-top:12px;padding:8px 16px;background:rgba(255,255,255,.05);border:1px solid #333;border-radius:8px;color:#888;cursor:pointer;font-size:14px;width:100%';cb.onclick=function(){menu.remove();};menu.appendChild(cb);
  document.body.appendChild(menu);
}
function placePin(tp){if(!localStorage.getItem('abi_token')){loginGitHub();return;}var cv=document.getElementById('cv');if(!cv||cv.textContent==='未选择'){alert('请先在地图上点击选择位置');return;}var parts=cv.textContent.split(',');var x=parseFloat(parts[0]);var y=parseFloat(parts[1]);if(isNaN(x)||isNaN(y)){alert('位置无效');return;}var ic=iconM[tp.n]||'';var pin={name:tp.n,type:tp.n,x:x,y:y,ic:ic,note:'',images:[],comments:[],map_name:mapNameCN};supabase('pins','POST',pin).then(function(data){if(data&&data.id)pin.id=data.id;pins.push(pin);savePins();renderMarkers();cv.textContent='未选择';document.getElementById('ab').style.display='none';alert('投稿成功！');}).catch(function(){pins.push(pin);savePins();renderMarkers();cv.textContent='未选择';document.getElementById('ab').style.display='none';alert('本地保存成功');});}

function renderLayers(){var lp=document.getElementById('lp');if(!lp)return;var keys=Object.keys(layerData);if(keys.length===0){lp.innerHTML='<div style="color:#888;padding:20px;text-align:center;font-size:14px">暂无层级数据</div>';return;}var html='<label class="all-label"><input type="checkbox" checked onchange="toggleAllLayers(this.checked)"> 全部显示</label>';keys.forEach(function(k){html+='<div class="ly-card"><div class="ly-card-hdr"><input type="checkbox" checked onchange="toggleLayer("'+k.replace(/'/g,"\\'")+'\',this.checked)"> '+k+'</div>'+(layerData[k]||[]).map(function(item){return '<label><input type="checkbox" checked data-layer="'+k+'"> 📍 '+item+'</label>';}).join('')+'</div>';});lp.innerHTML=html;}
function toggleAllLayers(c){var lp=document.getElementById('lp');if(lp)lp.querySelectorAll('input[type=checkbox]').forEach(function(cb){cb.checked=c;});}
function toggleLayer(n,c){var lp=document.getElementById('lp');if(lp)lp.querySelectorAll('input[data-layer="'+n+'"]').forEach(function(cb){cb.checked=c;});}

(function initLayerBtn(){var b=document.getElementById('lbb');var lp=document.getElementById('lp');if(b&&lp){b.onclick=function(e){e.stopPropagation();lp.classList.toggle('show');renderLayers();};document.addEventListener('click',function(e){if(lp&&!lp.contains(e.target)&&e.target!==b)lp.classList.remove('show');});}})();

function jumpToFromUrl(){var s=new URLSearchParams(window.location.search);var x=s.get('x'),y=s.get('y'),name=s.get('name'),type=s.get('type'),ic=s.get('ic');if(!x||!y)return;var xf=parseFloat(x),yf=parseFloat(y);scaleM=8;var wrap=document.querySelector('.map-wrap');if(!wrap)return;var w=wrap.clientWidth,h=wrap.clientHeight;var cx=w/2,cy=h/2;var img=document.getElementById('mapImg');if(!img)return;panX=cx-xf/100*img.clientWidth*scaleM;panY=cy-yf/100*img.clientHeight*scaleM;ut();document.getElementById('zr').value=800;document.getElementById('zl').textContent='800%';var mv=document.getElementById('mv');if(!mv)return;var el=document.createElement('div');el.style.cssText='position:absolute;left:'+xf+'%;top:'+yf+'%;transform:translate(-50%,-50%);width:'+(24/scaleM)+'px;height:'+(24/scaleM)+'px;z-index:999;pointer-events:none;background:#ff4444;border:'+(3/scaleM)+'px solid #fff;border-radius:50%;box-shadow:0 0 '+(12/scaleM)+'px rgba(255,0,0,.6)';mv.appendChild(el);if(name){var card=document.createElement('div');card.id='pinInfoCard';card.innerHTML='<div style="background:rgba(18,18,26,.96);border:1px solid #1e1e2a;border-radius:12px;padding:16px;width:280px;box-shadow:0 8px 24px rgba(0,0,0,.5);position:relative"><button onclick="this.parentElement.parentElement.remove()" style="position:absolute;top:8px;right:10px;color:#666;font-size:16px;cursor:pointer;background:none;border:none">X</button><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><img src="'+(ic||'')+'" style="width:36px;height:36px;border-radius:6px;object-fit:cover"><div><div style="color:#ffc832;font-weight:600;font-size:15px">'+(name||'未知')+'</div><div style="color:#999;font-size:12px">位置: '+xf+'%, '+yf+'%</div></div></div><div style="color:#888;font-size:12px;border-top:1px solid #1e1e2a;padding-top:8px;margin-top:4px">审核中 - 此点位尚未公开</div></div>';card.style.cssText='position:fixed;top:12px;right:12px;z-index:9999';document.body.appendChild(card);return;}
  for(var i=0;i<pins.length;i++){if(Math.abs(pins[i].x-xf)+Math.abs(pins[i].y-yf)<3){showPinDetail(i);return;}}
  document.getElementById('cv').textContent=x+'%, '+y+'%';document.getElementById('ab').style.display='inline-block';}
