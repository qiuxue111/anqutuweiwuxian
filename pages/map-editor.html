<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="../favicon.ico" type="image/jpeg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地图编辑 - 暗区突围攻略</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #0a0a0f; color: #e0e0e0;
    }

    .editor-page { margin-top: 60px; padding: 1rem; max-width: 1400px; margin-left: auto; margin-right: auto; }

    .editor-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1rem;
    }
    .editor-header h1 { color: #ffc832; font-size: 1.4rem; }
    .editor-header .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .btn {
      padding: 0.5rem 1.2rem; border-radius: 8px; border: none;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: all 0.15s; display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .btn-primary { background: #ffc832; color: #0a0a0f; }
    .btn-primary:hover { background: #ffd950; }
    .btn-secondary { background: #1e1e2a; color: #ccc; }
    .btn-secondary:hover { background: #2a2a3a; }
    .btn-danger { background: #3a1a1a; color: #f66; }
    .btn-danger:hover { background: #4a2a2a; }
    .btn-success { background: #1a3a1a; color: #6f6; }
    .btn-success:hover { background: #2a4a2a; }
    .btn-sm { padding: 0.35rem 0.8rem; font-size: 0.78rem; }

    .editor-layout {
      display: grid; grid-template-columns: 1fr 320px; gap: 1rem;
    }
    @media (max-width: 860px) {
      .editor-layout { grid-template-columns: 1fr; }
    }

    /* 画布 */
    .canvas-area {
      background: #0a0a0f; border: 2px dashed #333;
      border-radius: 12px; overflow: hidden; position: relative;
      min-height: 500px; transition: border-color 0.2s;
    }
    .canvas-area.dragover { border-color: #ffc832; background: #0f0f16; }
    .canvas-area.has-image { border-style: solid; border-color: #1e1e2a; }

    .upload-prompt {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: #666; pointer-events: none;
    }
    .upload-prompt .icon { font-size: 3rem; display: block; margin-bottom: 0.5rem; }

    .canvas-viewport {
      width: 100%; overflow: hidden; cursor: grab; position: relative;
      max-height: 80vh; min-height: 500px;
    }
    .canvas-viewport:active { cursor: grabbing; }

    .canvas-layer { position: relative; transform-origin: 0 0; }
    .canvas-layer img {
      display: block; width: 100%; height: auto;
      pointer-events: none; user-select: none; -webkit-user-drag: none;
    }

    /* 标记 */
    .marker-el {
      position: absolute; transform: translate(-50%, -50%);
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; pointer-events: auto;
      border: 2px solid rgba(0,0,0,0.5);
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
      font-size: 0.8rem; z-index: 10;
      transition: transform 0.1s;
    }
    .marker-el:hover { transform: translate(-50%, -50%) scale(1.25); z-index: 100; }
    .marker-el.pending { border-color: #ffc832; border-style: dashed; animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 6px rgba(255,200,50,0.3); }
      50% { box-shadow: 0 0 14px rgba(255,200,50,0.6); }
    }

    .marker-tip {
      position: absolute; bottom: calc(100% + 6px); left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.9); color: #fff;
      padding: 0.25rem 0.7rem; border-radius: 5px;
      font-size: 0.78rem; white-space: nowrap;
      display: none; pointer-events: none;
      border: 1px solid rgba(255,200,50,0.3);
    }

    .canvas-toolbar {
      display: flex; justify-content: center; align-items: center;
      gap: 0.5rem; padding: 0.6rem 1rem;
      background: #0f0f16; border-top: 1px solid #1e1e2a; flex-wrap: wrap;
    }
    .canvas-toolbar button {
      width: 34px; height: 34px; border-radius: 50%; border: none;
      background: #1e1e2a; color: #ccc; cursor: pointer;
      font-size: 1rem; transition: 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .canvas-toolbar button:hover { background: #ffc832; color: #0a0a0f; }
    .canvas-toolbar .label { color: #888; font-size: 0.8rem; min-width: 40px; text-align: center; }
    .canvas-toolbar input[type="range"] { width: 100px; accent-color: #ffc832; }

    /* 侧面?*/
    .side-panel { display: flex; flex-direction: column; gap: 1rem; }
    .panel-box { background: #12121a; border: 1px solid #1e1e2a; border-radius: 12px; padding: 1rem; }
    .panel-box h3 { color: #ffc832; font-size: 0.95rem; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.4rem; }

    .form-group { margin-bottom: 0.6rem; }
    .form-group label { display: block; color: #999; font-size: 0.82rem; margin-bottom: 0.25rem; }
    .form-group input, .form-group select {
      width: 100%; padding: 0.45rem 0.7rem; border-radius: 6px;
      border: 1px solid #1e1e2a; background: #0f0f16; color: #fff; font-size: 0.85rem; outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: #ffc832; }
    .form-group select option { background: #12121a; }
    .form-hint { color: #555; font-size: 0.75rem; margin-top: 0.2rem; }

    .marker-list { display: flex; flex-direction: column; gap: 0.3rem; max-height: 250px; overflow-y: auto; }
    .marker-list::-webkit-scrollbar { width: 4px; }
    .marker-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .ml-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.4rem 0.6rem; border-radius: 6px;
      background: #0f0f16; font-size: 0.82rem; color: #ccc;
    }
    .ml-item .ml-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .ml-item .ml-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ml-item .ml-status { font-size: 0.7rem; padding: 0.1rem 0.4rem; border-radius: 3px; }
    .ml-status.approved { background: #1a3a1a; color: #6f6; }
    .ml-status.pending  { background: #3a3a1a; color: #ffc832; }
    .ml-item .ml-del { cursor: pointer; color: #555; padding: 0 0.2rem; }
    .ml-item .ml-del:hover { color: #f66; }

    .review-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.4rem 0.6rem; border-radius: 6px;
      background: #1a1a22; font-size: 0.82rem; color: #ccc; margin-bottom: 0.3rem;
    }
    .review-item .ri-info { flex: 1; }
    .review-item .ri-info .name { color: #fff; }
    .review-item .ri-info .meta { color: #666; font-size: 0.72rem; }
    .review-item .ri-actions { display: flex; gap: 0.3rem; }
    .review-empty { text-align: center; color: #555; font-size: 0.82rem; padding: 1rem 0; }

    .toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: #1e1e2a; color: #fff; padding: 0.6rem 1.5rem;
      border-radius: 8px; font-size: 0.85rem; z-index: 9999;
      border: 1px solid #333; opacity: 0; transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><a href="../index.html" style="color:#ffc832;text-decoration:none;">暗区无限</a> <span>攻略?/span></div>
    <ul class="nav-links">
      <li><a href="maps.html">地图</a></li>
      <li><a href="weapons.html">枪械</a></li>
      <li><a href="strategy.html">技?/a></li>
      <li><a href="gear.html">配装</a></li>
      <li><a href="../search.html">🔍</a></li>
    </ul>
  </nav>

  <div class="editor-page">
    <div class="editor-header">
      <div>
        <h1>🗺?地图标注编辑?/h1>
        <p style="color:#888;font-size:0.85rem;margin-top:0.2rem;">上传地图 ?点击打点 ?审核发布 ?导出使用</p>
      </div>
      <div class="actions">
        <button class="btn btn-secondary btn-sm" onclick="exportData()">📤 导出 JSON</button>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('importFile').click()">📥 导入 JSON</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      </div>
    </div>

    <div class="editor-layout">
      <!-- 左侧画布 -->
      <div>
        <div class="canvas-area" id="canvasArea">
          <div class="upload-prompt" id="uploadPrompt">
            <span class="icon">📂</span>
            <p>拖拽地图图片到此?/p>
            <p style="color:#444;font-size:0.82rem;">或点击下方按钮选择</p>
          </div>
          <div class="canvas-viewport" id="canvasViewport" style="display:none;">
            <div class="canvas-layer" id="canvasLayer">
              <img id="mapImage" src="" alt="地图" draggable="false">
              <div id="markerContainer" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
            </div>
          </div>
          <div class="canvas-toolbar" id="canvasToolbar" style="display:none;">
            <button onclick="zoomEdit(1/1.15)">?/button>
            <input type="range" id="zoomRange" min="15" max="400" value="100" oninput="zoomSliderEdit(this.value)">
            <button onclick="zoomEdit(1.15)">?/button>
            <button onclick="resetViewEdit()">?/button>
            <span class="label" id="zoomLabelEdit">100%</span>
            <span class="label" style="color:#ffc832;">✏️ 点击地图打点</span>
          </div>
        </div>
        <div style="margin-top:0.5rem;display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
          <button class="btn btn-secondary btn-sm" onclick="document.getElementById('fileInput').click()">📁 选择图片</button>
          <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="loadImage(event)">
          <span style="color:#555;font-size:0.78rem;" id="fileInfo">未选择图片</span>
        </div>
      </div>

      <!-- 右侧面板 -->
      <div class="side-panel">
        <!-- 添加 -->
        <div class="panel-box">
          <h3>📌 添加物资?/h3>
          <p style="color:#555;font-size:0.78rem;margin-bottom:0.8rem;">点击地图选位??填信??提交</p>
          <div class="form-group">
            <label>点位名称</label>
            <input type="text" id="markerName" placeholder="如：汽车旅馆保险?>
          </div>
          <div class="form-group">
            <label>类型</label>
            <select id="markerType">
              <option value="high">💎 高价值点</option>
              <option value="safe">💰 保险?/option>
              <option value="weapon">🔫 武器?/option>
              <option value="tool">🔧 工具?/option>
              <option value="filing">📁 文件?/option>
              <option value="loot">📦 普通搜?/option>
              <option value="extract">🚁 撤离?/option>
            </select>
          </div>
          <div class="form-group">
            <label>坐标 (点击地图自动填入)</label>
            <div style="display:flex;gap:0.4rem;">
              <input type="number" id="markerX" step="0.1" placeholder="X %" style="flex:1;">
              <input type="number" id="markerY" step="0.1" placeholder="Y %" style="flex:1;">
            </div>
          </div>
          <div style="display:flex;gap:0.4rem;margin-top:0.5rem;">
            <button class="btn btn-primary btn-sm" onclick="addFromForm(false)" style="flex:1;">?提交审核</button>
            <button class="btn btn-success btn-sm" onclick="addFromForm(true)" style="flex:1;">?直接发布</button>
          </div>
        </div>

        <!-- 列表 -->
        <div class="panel-box">
          <h3>📋 物资?<span style="color:#888;font-weight:400;font-size:0.8rem;" id="markerCount">(0)</span></h3>
          <div style="display:flex;gap:0.3rem;margin-bottom:0.5rem;flex-wrap:wrap;">
            <button class="btn btn-sm btn-secondary" onclick="renderList('all')">全部</button>
            <button class="btn btn-sm btn-secondary" onclick="renderList('approved')">已发?/button>
            <button class="btn btn-sm btn-secondary" onclick="renderList('pending')">待审?/button>
          </div>
          <div class="marker-list" id="markerList"></div>
        </div>

        <!-- 审核 -->
        <div class="panel-box">
          <h3>🛂 待审?<span style="color:#ffc832;font-weight:400;font-size:0.8rem;" id="pendingCount">(0)</span></h3>
          <div id="reviewList"><div class="review-empty">无待审核</div></div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script>
    // ===== 状?=====
    let markers = [];
    let mapImageData = null;
    let mapFileName = '';

    let scale = 1, panX = 0, panY = 0;
    let isDragging = false;
    let dragStartX, dragStartY, panStartX, panStartY;

    let pendingX = null, pendingY = null;
    let markerIdCounter = Date.now();

    const TYPE = {
      high:    { label: '高价值点',   color: '#ffc832', icon: '💎' },
      safe:    { label: '保险?,     color: '#ff6',    icon: '💰' },
      weapon:  { label: '武器?,     color: '#f66',    icon: '🔫' },
      tool:    { label: '工具?,     color: '#6f6',    icon: '🔧' },
      filing:  { label: '文件?,     color: '#66f',    icon: '📁' },
      loot:    { label: '普通搜?,   color: '#999',    icon: '📦' },
      extract: { label: '撤离?,     color: '#0f0',    icon: '🚁' },
    };

    // ===== 图片上传 =====
    function loadImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      mapFileName = file.name;
      document.getElementById('fileInfo').textContent = file.name;
      const r = new FileReader();
      r.onload = function(ev) { mapImageData = ev.target.result; showImage(); };
      r.readAsDataURL(file);
    }

    const ca = document.getElementById('canvasArea');
    ca.addEventListener('dragover', e => { e.preventDefault(); ca.classList.add('dragover'); });
    ca.addEventListener('dragleave', () => ca.classList.remove('dragover'));
    ca.addEventListener('drop', e => {
      e.preventDefault(); ca.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        mapFileName = file.name;
        document.getElementById('fileInfo').textContent = file.name;
        const r = new FileReader();
        r.onload = ev => { mapImageData = ev.target.result; showImage(); };
        r.readAsDataURL(file);
      }
    });

    function showImage() {
      document.getElementById('uploadPrompt').style.display = 'none';
      document.getElementById('canvasViewport').style.display = 'block';
      document.getElementById('canvasToolbar').style.display = 'flex';
      document.getElementById('mapImage').src = mapImageData;
      ca.classList.add('has-image');
      resetViewEdit();
      renderMarkers();
    }

    // ===== 缩放平移 =====
    const vp = document.getElementById('canvasViewport');
    const ly = document.getElementById('canvasLayer');

    function ut() { ly.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
      document.getElementById('zoomLabelEdit').textContent = Math.round(scale*100)+'%'; }

    function zoomEdit(f, cx, cy) {
      const os = scale; let ns = scale*f; ns = Math.max(0.15,Math.min(4,ns));
      if (ns===os) return;
      if (cx===undefined) { cx=vp.clientWidth/2; cy=vp.clientHeight/2; }
      const ix=(cx-panX)/os, iy=(cy-panY)/os;
      scale=ns; panX=cx-ix*scale; panY=cy-iy*scale;
      document.getElementById('zoomRange').value=Math.round(scale*100); ut();
    }
    function zoomSliderEdit(v) { zoomEdit(v/100/scale); }
    function resetViewEdit() { scale=1; panX=0; panY=0; document.getElementById('zoomRange').value=100; ut(); }

    vp.addEventListener('wheel', e => {
      e.preventDefault();
      const r=vp.getBoundingClientRect();
      zoomEdit(e.deltaY<0?1.12:1/1.12, e.clientX-r.left, e.clientY-r.top);
    }, {passive:false});

    vp.addEventListener('mousedown', e => {
      if (e.target.closest('.marker-el')) return;
      isDragging=true; dragStartX=e.clientX; dragStartY=e.clientY;
      panStartX=panX; panStartY=panY; vp.style.cursor='grabbing';
    });
    window.addEventListener('mousemove', e => {
      if(!isDragging) return;
      panX=panStartX+(e.clientX-dragStartX); panY=panStartY+(e.clientY-dragStartY); ut();
    });
    window.addEventListener('mouseup', () => { if(isDragging) { isDragging=false; vp.style.cursor='grab'; } });

    // 点击打点
    vp.addEventListener('click', e => {
      if (isDragging) return;
      if (e.target.closest('.marker-el')) return;
      const r=vp.getBoundingClientRect();
      const cx=e.clientX-r.left, cy=e.clientY-r.top;
      const ix=(cx-panX)/scale, iy=(cy-panY)/scale;
      const img=document.getElementById('mapImage');
      const dw=img.clientWidth, dh=img.clientHeight;
      pendingX=Math.round((ix/dw)*1000)/10;
      pendingY=Math.round((iy/dh)*1000)/10;
      document.getElementById('markerX').value=pendingX;
      document.getElementById('markerY').value=pendingY;
      document.getElementById('markerName').focus();
      showToast(`📍 位置 (${pendingX}%, ${pendingY}%)`);
    });
    vp.style.cursor='grab';

    // ===== 标记管理 =====
    function addMarker(x,y,name,type,status) {
      const t=TYPE[type]||TYPE.loot;
      const m={ id:++markerIdCounter, x, y, name, type, color:t.color, icon:t.icon, status:status||'pending',
        createdAt:new Date().toISOString() };
      markers.push(m); save(); renderMarkers(); updateUI(); return m;
    }
    function addFromForm(approved) {
      const n=document.getElementById('markerName').value.trim();
      const t=document.getElementById('markerType').value;
      const x=parseFloat(document.getElementById('markerX').value);
      const y=parseFloat(document.getElementById('markerY').value);
      if(!n){showToast('⚠️ 输入名称');return;}
      if(isNaN(x)||isNaN(y)){showToast('⚠️ 点击地图选位?);return;}
      addMarker(x,y,n,t,approved?'approved':'pending');
      document.getElementById('markerName').value='';
      document.getElementById('markerX').value='';
      document.getElementById('markerY').value='';
      showToast(approved?'?已发?:'🕐 已提交审?);
    }
    function deleteMarker(id) { markers=markers.filter(m=>m.id!==id); save(); renderMarkers(); updateUI(); }
    function approveMarker(id) {
      const m=markers.find(m=>m.id===id);
      if(m){m.status='approved'; save(); renderMarkers(); updateUI(); showToast('?已通过');}
    }
    function rejectMarker(id) { deleteMarker(id); showToast('?已拒?); }

    function renderMarkers() {
      const c=document.getElementById('markerContainer'); c.innerHTML='';
      markers.forEach(m=>{
        const el=document.createElement('div');
        el.className='marker-el'+(m.status==='pending'?' pending':'');
        el.style.left=m.x+'%'; el.style.top=m.y+'%'; el.style.background=m.color;
        el.innerHTML=m.icon;
        const tip=document.createElement('div'); tip.className='marker-tip';
        tip.textContent=m.name+(m.status==='pending'?' (待审?':'');
        el.appendChild(tip);
        el.addEventListener('mouseenter',()=>{tip.style.display='block';});
        el.addEventListener('mouseleave',()=>{tip.style.display='none';});
        c.appendChild(el);
      });
    }

    function updateUI() {
      document.getElementById('markerCount').textContent=`(${markers.length})`;
      const p=markers.filter(m=>m.status==='pending').length;
      document.getElementById('pendingCount').textContent=`(${p})`;
      renderList('all'); renderReview();
    }

    function renderList(filter) {
      const el=document.getElementById('markerList');
      let arr=markers;
      if(filter==='approved') arr=markers.filter(m=>m.status==='approved');
      if(filter==='pending') arr=markers.filter(m=>m.status==='pending');
      if(!arr.length){el.innerHTML='<div style="color:#555;padding:1rem 0;text-align:center;font-size:0.82rem;">?/div>';return;}
      el.innerHTML=arr.map(m=>`<div class="ml-item">
        <span class="ml-dot" style="background:${m.color}"></span>
        <span class="ml-label">${m.icon} ${m.name}</span>
        <span class="ml-status ${m.status}">${m.status==='approved'?'已发?:'待审?}</span>
        <span class="ml-del" onclick="deleteMarker(${m.id})">?/span>
      </div>`).join('');
    }

    function renderReview() {
      const el=document.getElementById('reviewList');
      const p=markers.filter(m=>m.status==='pending');
      if(!p.length){el.innerHTML='<div class="review-empty">无待审核</div>';return;}
      el.innerHTML=p.map(m=>`<div class="review-item">
        <span style="font-size:1.2rem;">${m.icon}</span>
        <div class="ri-info"><div class="name">${m.name}</div>
        <div class="meta">(${Math.round(m.x)}%,${Math.round(m.y)}%)</div></div>
        <div class="ri-actions">
          <button class="btn btn-sm btn-success" onclick="approveMarker(${m.id})">?/button>
          <button class="btn btn-sm btn-danger" onclick="rejectMarker(${m.id})">?/button>
        </div>
      </div>`).join('');
    }

    // ===== 存储 =====
    function save() {
      try { localStorage.setItem('abi_mapedit', JSON.stringify({markers,mapImageData,mapFileName})); } catch(e){}
    }
    function loadLocal() {
      try {
        const d=JSON.parse(localStorage.getItem('abi_mapedit'));
        if(d&&d.markers){markers=d.markers;updateUI();renderMarkers();}
        if(d&&d.mapImageData){mapImageData=d.mapImageData;mapFileName=d.mapFileName||'';
          document.getElementById('fileInfo').textContent=mapFileName||'已加?;showImage();}
      }catch(e){}
    }

    // ===== 导入导出 =====
    function exportData() {
      const d={markers,mapFileName,exportedAt:new Date().toISOString()};
      const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download=(mapFileName||'map')+'_markers.json'; a.click();
      showToast('📤 导出成功');
    }
    function importData(e) {
      const file=e.target.files[0]; if(!file)return;
      const r=new FileReader();
      r.onload=function(ev){
        try{
          const d=JSON.parse(ev.target.result);
          if(d.markers){markers=d.markers; save(); renderMarkers(); updateUI(); showToast('📥 导入成功');}
        }catch(e){showToast('⚠️ 文件格式错误');}
      };
      r.readAsText(file);
    }

    // ===== Toast =====
    let toastTimer;
    function showToast(msg) {
      const el=document.getElementById('toast');
      el.textContent=msg; el.classList.add('show');
      clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
    }

    // ===== 初始?=====
    loadLocal();
  </script>
</body>
</html>
