ng:6px 10px;color:#ccc;font-size:12px;cursor:pointer;border-radius:5px;display:flex;align-items:center;gap:6px} .cp-item:hover{background:rgba(255,255,255,0.06);color:#fff} .cp-item.active{color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, transparent)} .cp-del{cursor:pointer;color:#555;margin-left:auto;padding:0 4px;font-size:11px} .cp-del:hover{color:#f66} .cp-add{padding:6px 10px;color:#6f6;font-size:12px;cursor:pointer;border-radius:5px} .cp-add:hover{background:rgba(100,255,100,0.08)} .cp-rename{padding:6px 10px;color:var(--accent);font-size:12px;cursor:pointer;border-radius:5px} .cp-rename:hover{background:rgba(255,200,50,0.08)}  /* 瑙嗗彛 */ .viewport{position:fixed;top:48px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab} .viewport.dragging{cursor:grabbing} .canvas{position:absolute;top:0;left:0;transform-origin:0 0;width:200vw;height:200vh;background:#111;background-image:radial-gradient(circle at 25px 25px,#1a1a4a 2px,transparent 2px);background-size:40px 40px;min-width:100000px;min-height:100000px}  /* 鍗＄墖 - 鍥哄畾瀹介珮 300脳260 */ .card{position:absolute;width:300px;height:260px;background:var(--card-bg,rgba(20,20,30,.75));border:1.5px solid rgba(255,255,255,.08);border-radius:14px;cursor:pointer;z-index:2;overflow:hidden;transition:box-shadow .2s,border-color .2s;display:flex;flex-direction:column} .card:hover{box-shadow:0 0 20px color-mix(in srgb, var(--accent) 18%, transparent);border-color:color-mix(in srgb, var(--accent) 30%, transparent)} .card.selected{border-color:var(--accent)!important;box-shadow:0 0 30px color-mix(in srgb, var(--accent) 40%, transparent)!important}  /* 鍗＄墖鎿嶄綔鎸夐挳 */ .card-actions-bar{position:absolute;top:6px;right:6px;z-index:10;display:flex;gap:4px;opacity:0;transition:opacity .15s} .card:hover .card-actions-bar{opacity:1} .card.ca{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:5px;color:#aaa;cursor:pointer;padding:2px 6px;font-size:11px} .card.ca:hover{color:var(--accent);background:color-mix(in srgb, var(--accent) 15%, transparent)} .card.ca-del:hover{color:#f44;background:rgba(255,50,50,.15)}  /* 鍗＄墖鏍囬 */ .card-title{padding:12px 14px 6px;font-size:17px;font-weight:700;color:var(--text-body,#fff);text-align:center;letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}  /* 鍗＄墖瀛愬唴瀹?- 鍙崲琛屾粴鍔?*/ .card-body{flex:1;padding:6px 14px 8px;font-size:12px;color:var(--text-body,#999);line-height:1.6;overflow-y:auto;word-break:break-word;white-space:pre-wrap}   /* 瀛愪换鍔″崱鐗?*/ .card-subtask{padding:10px 14px;margin:4px 0;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04);border-radius:8px;cursor:pointer;font-size:14px;color:var(--text-body,#ccc);transition:all .15s;white-space:pre-wrap;word-break:break-word;line-height:1.4} .card-subtask:hover{background:rgba(255,255,255,.06);border-color:var(--accent);color:var(--accent)} .card-subtask:first-child{margin-top:0} .card-subtask:last-child{margin-bottom:0}  .card-body::-webkit-scrollbar{width:3px} .card-body::-webkit-scrollbar-thumb{background:#333;border-radius:2px}  /* 鍗＄墖搴曢儴 - 璇勮璁℃暟 */ .card-footer{padding:4px 14px 8px;border-top:1px solid rgba(255,255,255,.04);flex-shrink:0;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-body,#666)} .card-footer .comment-icon{font-size:12px} .card-footer .comment-count{font-size:11px;color:var(--text-body,#888)}  /* 椤舵爮搴曢儴宸ュ叿鏍?- 缂栬緫鏃舵樉绀?*/ .edit-toolbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:none;gap:8px;background:rgba(10,10,15,.92);border:1px solid #333;border-radius:12px;padding:8px 14px;backdrop-filter:blur(8px);white-space:nowrap} .edit-toolbar button{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;color:#ddd;transition:background .15s;white-space:nowrap} .edit-toolbar .et-add{background:#1a3a1a;color:#4f4} .edit-toolbar .et-del-batch{background:#3a1a1a;color:#f66} .edit-toolbar button:hover{filter:brightness( ght:1px;background:rgba(255,255,255,0.06);margin:4px 8px} .hm-group-wrap{margin-bottom:2px} .hm-group-label{padding:8px 12px;color:#ccc;font-size:13px;border-radius:6px} .hm-group-label:hover{background:rgba(255,255,255,0.06);color:#fff} .hm-group-label.active{color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, transparent)} .hm-sub{max-height:0;overflow:hidden;transition:max-height 0.2s ease} .hm-sub.open{max-height:300px} .hm-sub .hm-item{padding:6px 12px 6px 24px;font-size:12px}  .hamburger:active{cursor:grabbing} .hamburger:hover{background:color-mix(in srgb, var(--accent) 8%, transparent);border-color:var(--accent);color:var(--accent)} .hamburger-menu{display:none;position:fixed;top:92px;left:8px;z-index:9998;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:9px;padding:8px;min-width:220px;box-shadow:0 4px 24px rgba(0,0,0,0.5)} .hamburger-menu.show{display:block} .hm-item{padding:8px 12px;color:#ccc;font-size:13px;cursor:pointer;border-radius:6px} .hm-item:hover{background:rgba(255,255,255,0.06);color:#fff} .hm-item.active{color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, transparent)} .hm-sep{height:1px;background:rgba(255,255,255,0.06);margin:4px 8px} .loading{position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-page);z-index:9999;color:#666;font-size:14px}  /* 妗嗛€?*/ .selection-box{position:fixed;border:1.5px solid var(--accent);background:color-mix(in srgb, var(--accent) 8%, transparent);pointer-events:none;z-index:999;display:none}  /* 閫夋嫨璁℃暟 */ .sel-count{display:none;color:var(--accent);font-size:11px;margin-left:8px} .align-btn{background:#2a2a3a;color:#aaf!important} .space-btn{background:#2a3a2a;color:#6f6!important} .arrange-btn{background:#3a2a1a;color:#fc8!important} </style> </head> <body>  <div <div class="app-bar">   <div class="hamburger" id="hamburger">鈽?/div>   <span class="app-title" id="canvasLabel">榛樿</span>   <button class="btn btn-edit" id="editToggle" onclick="toggleEdit()">缂栬緫</button>   <button class="btn btn-save" id="saveBtn" style="display:none" onclick="saveData()">淇濆瓨</button>   <button class="btn btn-cancel" id="cancelBtn" style="display:none" onclick="cancelEdit()">鍙栨秷</button>   <button class="btn btn-add-card" id="addCardBtn" onclick="addCard()">+ 娣诲姞</button> </div>  <div class="canvas-panel" id="canvasPanel"></div>  <div class="viewport" id="viewport">   <div class="canvas" id="canvas">      </div> </div> <div class="selection-box" id="selectionBox"></div>  <div class="edit-toolbar" id="editToolbar">   <button class="et-add" onclick="addCard()">+ 娣诲姞鍗＄墖</button>   <button class="et-zone" onclick="toggleZoneMode()">馃帹 娣诲姞鍖哄煙</button>   <span class="sel-count" id="selCount"></span>   <button id="alignBtn" class="align-btn" style="display:none" onclick="alignCards('h')">鈬?姘村钩瀵归綈</button>   <button id="alignBtnV" class="align-btn" style="display:none" onclick="alignCards('v')">鈬?鍨傜洿瀵归綈</button>   <button id="spaceBtnH" class="space-btn" style="display:none" onclick="spaceEvenly('h')">鈮?绛夎窛姘村钩</button>   <button id="spaceBtnV" class="space-btn" style="display:none" onclick="spaceEvenly('v')">鈮?绛夎窛鍨傜洿</button>   <button id="arrangeBtn" class="arrange-btn" style="display:none" onclick="autoArrange()">鈯?鑷姩鎺掑垪</button>   <button onclick="undoLast()" style="background:color-mix(in srgb, var(--accent) 8%, #111);color:var(--text-body)">鈫?鎾ら攢</button>   <button onclick="clearConns()" style="background:color-mix(in srgb, var(--accent) 8%, #111);color:#f88">鉀?娓呯┖杩炵嚎</button>   <button id="saveCloudBtn" style="background:color-mix(in srgb, var(--accent) 15%, #111);color:var(--accent)" onclick="saveToCloud()">鈽?淇濆瓨</button>   <button class="et-del-batch" id="batchDelBtn" style="display:none" onclick="batchDelete()">馃棏 鎵归噺鍒犻櫎</button> </div>  <div class="zoom-info" id="zoomInfo">100%</div>  <div class="hamburger-menu" id="hamburgerMenu"></div> <div class="loading" id="loading">鍔犺浇涓?..</div>  <!-- 缂栬緫鍗＄墖寮圭獥 --> <div id="editModal" class="modal-overlay">   <div class="modal">     <h2>缂栬緫鍗＄墖</h2>     <label>鏍囬</label>     <input id="edTitle" placeholder="鍗＄墖鏍囬" maxlength="40">     <label>浠诲姟鍒楄〃锛堟瘡琛屼竴涓换鍔★紝鍥炶溅鎹㈣锛?/label>     <textarea id="edBody" placeholder="鍦ㄨ繖閲屽啓鍗＄墖鍐呭&#10;鏀寔澶氳鏂囧瓧" style="min-height:120px;resize:vertical"></textarea>     <div class="btn-row">       <button class="btn-cancel-m" onclick="closeEditModal()">鍙栨秷</button>       <button class="btn-save-m" onclick="saveCardEdit()">淇濆瓨</button>     </div>   </div> </div>  <!-- 璇勮鍖哄脊绐?--> <div id="commentModal" class="modal-overlay comment-modal">   <div class="modal">     <h2 id="commentModalTitle">璇勮</h2>     <div class="comment-list" id="commentList"></div>     <div class="cm-input-wrap">       <input id="cmInput" placeholder="鍐欒瘎璁?.." onkeydown="if(event.key==='Enter')addComment()">       <button onclick="addComment()">鍙戦€?/button>     </div>     <div class="btn-row" style="margin-top:10px">       <button class="btn-cancel-m" onclick="closeCommentModal()">鍏抽棴</button>     </div>   </div> </div>  <script> /* 涓婚鍚屾 - 璺熼殢涓婚〉璋冭壊鐩?*/ (function(){   var DEFAULTS={'--accent':'#ffc832','--bg-page':'#08080e','--text-body':'#ccc','--card-bg':'rgba(20,20,30,0.6)','--btn-blue-text':'#4a9eff','--btn-red-text':'#ff6b6b','--btn-green-text':'#51cf66','--btn-purple-text':'#cc5de8'};   function getVal(k){     var s;try{s=JSON.parse(localStorage.getItem('abi_palette'));}catch(e){}     return (s&&s[k]!==undefined)?s[k]:DEFAULTS[k];   }   var r=document.documentElement;   Object.keys(DEFAULTS).forEach(function(k){ r.style.setProperty(k, getVal(k)); }); })();  /* ====== Supabase ====== */ var SUPABASE_URL='https://hanrfbciinkhgcumvous.supabase.co'; var SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhbnJmYmNpaW5raGdjdW12b3VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTA4ODAsImV4cCI6MjA5NTM4Njg4MH0.Q7JBpwAqpYbEpwLq7werjtAtgjU4pIcHg4JbwFZ2vok'; function db(m,t,b,q){   var u=SUPABASE_URL+'/rest/v1/'+t;   var o={method:m||'GET',headers:{'apikey':SUPABASE_ANON,'Content-Type':'application/json'}};   if(b){o.body=JSON.stringify(b);var tk=localStorage.getItem('abi_token');if(tk) o.headers['Authorization']='Bearer '+tk;}   if(q) u+='?'+q;   return fetch(u,o).then(function(r){     if(r.status>=400) throw new Error(r.status);     return r.text().then(function(t2){       if(!t2||t2==='[]'||t2==='{}') return null;       try{return JSON.parse(t2)}catch(e){return null}     })   }).catch(function(e){     console.warn('Supabase '+m+' '+t+' failed, localStorage fallback',e);     if(m!='GET') throw e;     try{       var k='3x3_'+t.replace('task_','');       var d=localStorage.getItem(k);       if(d) return JSON.parse(d);     }catch(e2){}     return null;   }); }  /* ====== 鏁版嵁 ====== */ var cards = [];       // {id, title, body, x, y} var comments = {};    // {cardId: [{id, author, content, created_at}]} var editMode = false; var editingCardId = null; var commentCardId = null; var scale = 0.8, panX = 0, panY = 0; var isPanning = false, panStartX = 0, panStartY = 0, panOX = 0, panOY = 0; var isSelecting = false, selStartX = 0, selStartY = 0; var selectedCardIds = {}; var currentCanvas = null; var canvasList = []; var connections = [];  // {from, to} var zones = [];         // {id, label, color, left, top, width, height, cardIds} var isZoneDrawing = false, zoneStartX = 0, zoneStartY = 0; var connFrom = null; var connLine = null; var undoStack = [];  /* ====== 鐢诲竷鍒囨崲 ====== */ function renderCanvasPanel(){   var p = document.getElementById("canvasPanel");   if(!p.classList.contains("show")) return;   p.innerHTML = "";   var list = document.createElement("div");   list.className = "cp-list";   canvasList.forEach(function(cv){     var item = document.createElement("div");     item.className = "cp-item"+(cv.id===currentCanvas?" active":"");     item.textContent = cv.label;     if(cv.id!==currentCanvas) canvases?id=eq.'+encodeURIComponent(currentCanvas),{method:'PATCH',headers:{'apikey':SUPABASE_ANON,'Content-Type':'application/json'},body:JSON.stringify({label:name.trim()})}).catch(function(e){console.error(e)});       renderCanvasPanel();     };     p.appendChild(rnBtn);   } }  /* ====== 鐢诲竷鍒囨崲鎸夐挳 ====== */ function bindCanvasSwitch(){   document.getElementById("canvasLabel").addEventListener("click",function(e){     e.stopPropagation();     var p=document.getElementById("canvasPanel");     p.classList.toggle("show");     if(p.classList.contains("show")) renderCanvasPanel();   });   document.addEventListener("click",function(e){     if(!e.target.closest("#canvasLabel")&&!e.target.closest("#canvasPanel")) document.getElementById("canvasPanel").classList.remove("show");   }); }  function deleteCanvasDB(id){   var tk=localStorage.getItem('abi_token');if(!tk){if(confirm('闇€瑕佺櫥褰曘€傚幓鐧诲綍锛?))loginGitHub();return Promise.reject();}   var h={'apikey':SUPABASE_ANON,'Content-Type':'application/json'};   return Promise.all([     fetch(SUPABASE_URL+'/rest/v1/task_cards?canvas_id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:h}),     fetch(SUPABASE_URL+'/rest/v1/task_connections?canvas_id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:h}),     fetch(SUPABASE_URL+'/rest/v1/task_comments?card_id=in.('+cards.filter(function(c){return true}).map(function(c){return "'"+c.id+"'"}).join(',')+')',{method:'DELETE',headers:h}).catch(function(){}),     fetch(SUPABASE_URL+'/rest/v1/task_canvases?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:h})   ]); }  function switchCanvas(id){   if(id===currentCanvas) return;   currentCanvas = id;   document.getElementById("canvasLabel").textContent = "";   var cv = canvasList.find(function(x){return x.id===id});   if(cv) document.getElementById("canvasLabel").textContent = cv.label;   loadData(); }  /* ====== 鍒濆鍖?====== */ function init(){   bindCanvasSwitch();   document.getElementById("loading").style.display = "flex";   db('GET','task_canvases','','order=created_at').then(function(rows){     if(rows&&rows.length>0){       canvasList = rows.map(function(r){return{id:r.id,label:r.label||r.id,color:r.color||'#888'}});     } else {       canvasList = [{id:'default',label:'榛樿鐢诲竷',color:'var(--accent)'}];     }     currentCanvas = canvasList[0].id;     document.getElementById("canvasLabel").textContent = canvasList[0].label;     loadData();   }).catch(function(e){     console.error('Init error',e);     canvasList = [{id:'default',label:'榛樿鐢诲竷',color:'var(--accent)'}];     currentCanvas = 'default';     loadData();   }); }  /* ====== 鏁版嵁搴撴搷浣?====== */ function loadData(){   if(!currentCanvas){document.getElementById("loading").style.display="none";return;}   document.getElementById("loading").style.display = "flex";   var cid = encodeURIComponent(currentCanvas);   Promise.all([     db('GET','task_cards','','canvas_id=eq.'+cid+'&order=created_at'),     db('GET','task_connections','','canvas_id=eq.'+cid),     db('GET','task_comments','','order=created_at')   ]).then(function(results){     var cardRows = results[0] || [];     var connRows = results[1] || [];     var commentRows = results[2] || [];     if(cardRows.length > 0){       cards = cardRows.map(function(r){ return {id:r.id, title:r.name||'', body:r.description||'', x:r.x, y:r.y}; });     } else {       cards = [];     }     connections = connRows.map(function(r){ return {from:r.from_card, to:r.to_card}; });     comments = {};     commentRows.filter(function(cr){ return cards.some(function(c){ return c.id === cr.card_id }) }).forEach(function(cr){       if(!comments[cr.card_id]) comments[cr.card_id] = [];       comments[cr.card_id].push({id:cr.id, author:cr.author||'', content:cr.content||'', created_at:cr.created_at});     });     docscroll();     renderAll();     document.getElementById("loading").style.display = "none";   }).catch(function(e){     console.warn('Load error, using localStorage',e);     try{var lc=localStorage.getItem('3x3_cards');if(lc && lc!=='[]'){cards=JSON.parse(lc);} else {cards=[];var nid='c'+Date.now();cards.push({id:nid,title:'绀轰緥鍗＄墖',body:'鍙抽敭姝ゅ崱鐗囪瘯璇曡繛绾垮姛鑳?,x:100,y:100});}var lconn=localStorage.getItem('3x3_connections');if(lconn){connections=JSON.parse(lconn);}}catch(le){cards=[];}     docscroll();     renderAll();     document.getElementById("loading").style.display = "none";   }); }  /* ====== 淇濆瓨鍒颁簯绔?====== */ function saveToCloud(){   var tk = localStorage.getItem('abi_token');   if(!tk){ alert('闇€瑕?GitHub 鐧诲綍鎵嶈兘淇濆瓨鍒颁簯绔€傝鐐瑰嚮鍙充笂瑙?GitHub 鍥炬爣鐧诲綍銆?); return; }   var btn = document.getElementById('saveCloudBtn');   if(btn) btn.textContent = '鈴?淇濆瓨涓?..';   var cid = encodeURIComponent(currentCanvas);   var ah = {'apikey':SUPABASE_ANON,'Content-Type':'application/json'};   var task = Promise.resolve();   task = task.then(function(){ return fetch(SUPABASE_URL+'/rest/v1/task_cards?canvas_id=eq.'+cid, {method:'DELETE',headers:ah}).catch(function(){return null;}); });   task = task.then(function(){ return fetch(SUPABASE_URL+'/rest/v1/task_connections?canvas_id=eq.'+cid, {method:'DELETE',headers:ah}).catch(function(){return null;}); });   task = task.then(function(){     var ps = [];     cards.forEach(function(c){       ps.push(fetch(SUPABASE_URL+'/rest/v1/task_cards', {method:'POST',headers:ah, body:JSON.stringify({id:c.id,canvas_id:currentCanvas,name:c.title||'',description:c.body||'',x:c.x,y:c.y})}));     });     connections.forEach(function(cn){       ps.push(fetch(SUPABASE_URL+'/rest/v1/task_connections', {method:'POST',headers:ah, body:JSON.stringify({id:Date.now()+''+Math.random().toString(36).slice(2),canvas_id:currentCanvas,from_card:cn.from,to_card:cn.to})}));     });     return Promise.all(ps);   });   task.then(function(){     if(btn) btn.textContent = '鉁?宸蹭繚瀛?;     setTimeout(function(){ if(btn) btn.textContent = '鈽?淇濆瓨'; }, 2000);   }).catch(function(e){     console.error('Save failed',e);     if(btn) btn.textContent = '鉁?澶辫触';   }); }   /* ====== 妗嗛€?+ 鎺掑垪鍔熻兘 ====== */ function confirmSelection(){   var sb = document.getElementById("selectionBox");   var l = parseFloat(sb.style.left);   var t = parseFloat(sb.style.top);   var r = l + parseFloat(sb.style.width);   var b = t + parseFloat(sb.style.height);   if(isNaN(l) || r - l < 5) return;   selectedCardIds = {};   document.querySelectorAll(".card.selected").forEach(function(el){el.classList.remove("selected");});   var vpRect = document.getElementById("viewport").getBoundingClientRect();   cards.forEach(function(c){     var el = document.getElementById("card_"+c.id);     if(!el) return;     var corners = [       {x:c.x, y:c.y},       {x:c.x + el.offsetWidth, y:c.y},       {x:c.x, y:c.y + el.offsetHeight},       {x:c.x + el.offsetWidth, y:c.y + el.offsetHeight}     ];     var inSel = false;     for(var i = 0; i < 4; i++){       var sx = corners[i].x * scale + panX + vpRect.left;       var sy = corners[i].y * scale + panY + vpRect.top;       if(sx >= l && sx <= r && sy >= t && sy <= b){ inSel = true; break; }     }     if(inSel){ selectedCardIds[c.id] = true; el.classList.add("selected"); }   });   updateBatchBtn(); }  function alignCards(dir){   var ids = Object.keys(selectedCardIds);   if(ids.length < 2) return;   var selected = [];   ids.forEach(function(id){     var c = cards.find(function(x){ return x.id === id; });     if(c) selected.push(c);   });   if(dir === 'h'){     var sum = 0;     selected.forEach(function(c){ sum += c.y; });     var avg = sum / selected.length;     selected.forEach(function(c){ c.y = avg; });   } else {     var sum = 0;     selected.forEach(function(c){ sum += c.x; });     var avg = sum / selected.length;     selected.forEach(function(c){ c.x = avg; });   }   pushUndo();   renderAll(); }  function spaceEvenly(dir){   var ids = Object.keys(selectedCardIds);   if(ids.length < 3) return;   var sel = [];   ids.forEach(function(id){     var c = cards.find(function(x){ return x.id === id; });     if(c) sel.push(c);   });   if(dir === 'h'){     sel.sort(function(a,b){ return a.x - b.x; });     var min = sel[0].x, max = sel[sel.length-1].x;     var gap = (max - min) / (sel.length - 1);     sel.forEach(function(c, i){ c.x = min + gap * i; });   } else {     sel.sort(function(a,b){ return a.y - b.y; });     var min = sel[0].y, max = sel[sel.length-1].y;     var gap = (max - min) / (sel.length - 1);     sel.forEach(function(c, i){ c.y = min + gap * i; });   }   pushUndo();   renderAll(); }  function autoArrange(){   var ids = Object.keys(selectedCardIds);   if(ids.length < 2) return;   var sel = [];   ids.forEach(function(id){     var c = cards.find(function(x){ return x.id === id; });     if(c) sel.push(c);   });   sel.sort(function(a,b){     if(Math.abs(a.y - b.y) < 30) return b.x - a.x;     return a.y - b.y;   });   var startX = sel[0].x;   var startY = sel[0].y;   var cardW = 300, gap = 30;   var total = sel.length;   var cols = Math.min(Math.max(Math.ceil(Math.sqrt(total)), 2), 6);   var idx = 0;   for(var row = 0; idx < total; row++){     var remain = total - idx;     var thisCols = remain < cols ? remain : cols;     for(var col = 0; col < thisCols && idx < total; col++){       sel[idx].x = startX + col * (cardW + gap);       sel[idx].y = startY + row * (130 + gap);       idx++;     }   }   pushUndo();   renderAll(); }  function saveData(){   var tk = localStorage.getItem('abi_token');   if(!tk){ if(confirm('闇€瑕丟itHub鐧诲綍鎵嶈兘淇濆瓨銆傚幓鐧诲綍锛?)) loginGitHub(); return; }   var authHeaders = {'apikey':SUPABASE_ANON,'Content-Type':'application/json'};   var cid = encodeURIComponent(currentCanvas);   /* 缁熶竴鐨勫け璐ュ鐞?- 鏈櫥褰曟椂闈欓粯澶辫触 */   var safefetch = function(u,o){ return fetch(u,o).catch(function(){}); };   /* 1. 鍒犻櫎鏃ф暟鎹?*/   var deletes = [     safefetch(SUPABASE_URL+'/rest/v1/task_cards?canvas_id=eq.'+cid, {method:'DELETE', headers:authHeaders}),     safefetch(SUPABASE_URL+'/rest/v1/task_connections?canvas_id=eq.'+cid, {method:'DELETE', headers:authHeaders}),     safefetch(SUPABASE_URL+'/rest/v1/task_zones?canvas_id=eq.'
