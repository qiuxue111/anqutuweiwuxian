<!DOCTYPE html>
<html lang="zh-CN">
<head><meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索 — 暗区突围：无限攻略站</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .search-page { margin-top: 60px; max-width: 700px; margin-left: auto; margin-right: auto; padding: 2rem 1rem; }
    .search-page h1 { color: #ffc832; text-align: center; margin-bottom: 2rem; }
    .search-box {
      display: flex; gap: 0.5rem; margin-bottom: 2rem;
    }
    .search-box input {
      flex: 1; padding: 0.8rem 1.2rem; border-radius: 8px;
      border: 1px solid #1e1e2a; background: #12121a;
      color: #fff; font-size: 1rem; outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: #ffc832; }
    .search-box input::placeholder { color: #555; }
    .search-box button {
      padding: 0.8rem 1.5rem; background: #ffc832; color: #0a0a0f;
      border: none; border-radius: 8px; font-weight: 700; cursor: pointer;
      font-size: 0.95rem; transition: background 0.2s;
    }
    .search-box button:hover { background: #ffd950; }

    .search-result-item {
      display: flex; align-items: center; gap: 0.8rem;
      background: #12121a; border: 1px solid #1e1e2a;
      border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 0.8rem;
      text-decoration: none; transition: border-color 0.2s;
    }
    .search-result-item:hover { border-color: rgba(255,200,50,0.3); }
    .sr-type {
      display: inline-block; padding: 0.2rem 0.7rem; border-radius: 4px;
      font-size: 0.75rem; font-weight: 600; min-width: 42px; text-align: center;
      background: #2a2a3a; color: #aaa;
    }
    .sr-title { color: #fff; font-weight: 600; font-size: 0.95rem; flex-shrink: 0; }
    .sr-desc { color: #888; font-size: 0.82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-empty {
      text-align: center; color: #666; padding: 3rem 0;
    }
    .search-hint { text-align: center; color: #555; font-size: 0.85rem; margin-top: 2rem; }
  </style>
</head>
<body>
<button id="menuBtn" onclick="toggleMenu()">☰</button>
<div id="userArea"><span id="loginDot" style="display:none;width:8px;height:8px;border-radius:50%;background:#2ecc71;margin-right:2px;"></span><span id="userName" style="display:none;color:#ffc832;font-size:0.85rem;background:rgba(20,20,30,0.7);backdrop-filter:blur(6px);padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);"></span><button id="loginBtn" onclick="loginGitHub()" style="padding:6px 14px;background:rgba(255,200,50,0.12);color:#ffc832;border:1px solid rgba(255,200,50,0.15);border-radius:8px;font-size:0.85rem;cursor:pointer;">登录</button></div>
<div id="bubbleMenu"><a href="index.html">🏠 首页</a><a href="pages/maps.html">🗺 地图选图</a><a href="pages/weapons.html">🔧 改枪</a><a href="pages/strategy.html">💬 聊天</a><a href="pages/gear.html">📖 攻略</a><a href="search.html">🔍 搜索</a><div class="sep"></div><a href="#" onclick="showUserCenter()">👤 用户中心</a><a href="#" onclick="logout()">🚪 退出登录</a></div>


<style>
.navbar{display:flex;align-items:center;padding:0.5rem 1rem;background:#0a0a10;border-bottom:1px solid #1a1a28;position:relative;z-index:100;}
.navbar a{transition:color 0.2s;}
.navbar a:hover{color:#ffc832!important;}
#sideMenu a:hover{background:#1a1a28;}



#userArea{position:fixed;top:12px;right:12px;z-index:9999;display:flex;align-items:center;gap:8px;}
#userName{order:1;color:#ffc832;font-size:0.85rem;background:rgba(20,20,30,0.7);backdrop-filter:blur(6px);padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);}
#loginDot{order:2;width:8px;height:8px;border-radius:50%;display:none;margin-right:2px;}


#menuBtn{position:fixed;top:12px;left:12px;z-index:9999;width:38px;height:38px;border-radius:10px;background:rgba(20,20,30,0.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.08);color:#ccc;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
#menuBtn:hover{background:rgba(255,200,50,0.15);color:#ffc832;}
#bubbleMenu{display:block;position:fixed;top:56px;left:12px;z-index:9998;background:rgba(15,15,24,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:8px;min-width:180px;box-shadow:0 8px 40px rgba(0,0,0,0.6);overflow:hidden;opacity:0;pointer-events:none;transform:translateY(-8px);transition:opacity 0.2s ease,transform 0.2s ease;}
#menuBtn:hover + #bubbleMenu,#bubbleMenu:hover{opacity:1;pointer-events:all;transform:translateY(0);}
#bubbleMenu a{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#ccc;border-radius:8px;font-size:0.95rem;text-decoration:none;transition:all 0.15s;}
#bubbleMenu a:hover{background:rgba(255,200,50,0.08);color:#ffc832;}
#bubbleMenu .sep{height:1px;background:rgba(255,255,255,0.06);margin:4px 8px;}

</style>

  

  <div class="search-page">
    <h1>🔍 搜索攻略</h1>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="搜索地图、枪械、技巧、配装… 例如：北山、H416、跑刀" autofocus>
      <button onclick="doSearch(document.getElementById('search-input').value)">搜索</button>
    </div>
    <div id="search-results"></div>
    <div class="search-hint">
      支持模糊搜索 · 试试搜 "北山" "H416" "跑刀" "四级弹" "架枪"
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0">
(function(){
  var h=window.location.hash;
  if(h&&h.includes('access_token=')){
    var p=new URLSearchParams(h.replace('#',''));
    var t=p.get('access_token');
    if(t){
      try{
        var payload=JSON.parse(atob(t.split('.')[1]));
        localStorage.setItem('abi_token',t);
        localStorage.setItem('abi_user',p.get('email')||payload.email||'');location.reload();
        history.replaceState(null,'',window.location.pathname);
      }catch(err){}
    }
  }
})();

</script>
  <script src="js/search.js"></script>
  <script>

// ========== GLOBAL AUTH & NAV ==========
function normalizeUser(){try{var u=localStorage.getItem('abi_user');if(!u)return;var p=JSON.parse(u);if(typeof p==='string'){localStorage.setItem('abi_user',JSON.stringify({user_metadata:{preferred_username:p}}));}else if(!p.user_metadata){var name=p.preferred_username||p.email||'User';localStorage.setItem('abi_user',JSON.stringify({user_metadata:{preferred_username:name}}));}}catch(e){localStorage.setItem('abi_user',JSON.stringify({user_metadata:{preferred_username:u}}));}}
function getUserName(){try{var u=JSON.parse(localStorage.getItem('abi_user'));return u&&(u.user_metadata&&u.user_metadata.preferred_username||u.email||'已登录');}catch(e){return localStorage.getItem('abi_user')||'已登录';}}
function loginGitHub(){
  var p=window.location.pathname;var i=p.lastIndexOf('/pages/');var cb=window.location.origin+(i>=0?p.substring(0,i+1)+'index.html':p.replace(/index\.html$/,'')+'index.html');
  var u='https://hanrfbciinkhgcumvous.supabase.co/auth/v1/authorize?provider=github&redirect_to='+encodeURIComponent(cb);
  window.location.href=u;
}

(function initAuth(){
  var h=window.location.hash;
  if(h&&h.indexOf('access_token=')>=0){
    var p=new URLSearchParams(h.replace('#',''));
    var t=p.get('access_token');
    if(t){
      try{
        var payload=JSON.parse(atob(t.split('.')[1]));
        localStorage.setItem('abi_token',t);
        var email=payload.preferred_username||payload.user_metadata?.preferred_username||payload.email||p.get('email')||'';
        localStorage.setItem('abi_user',JSON.stringify(payload));
        history.replaceState(null,'',window.location.pathname+window.location.search);
        window.location.href=window.location.pathname+window.location.search;
      }catch(e){}
    }
  }
  var token=localStorage.getItem('abi_token');
  if(token){
    var u=document.getElementById('userName');
    var b=document.getElementById('loginBtn');
    if(u){u.style.display='';u.textContent=getUserName();}
    if(b){b.style.display='none';}
  }
})();

function toggleMenu(){
  var m=document.getElementById('bubbleMenu');
  if(!m)return;
  m.style.opacity=m.style.opacity==='1'||m.style.opacity===''?'0':'1';
  m.style.pointerEvents=m.style.opacity==='1'?'all':'none';
  m.style.transform=m.style.opacity==='1'?'translateY(0)':'translateY(-8px)';
}

function logout(){
  localStorage.removeItem('abi_token');
  localStorage.removeItem('abi_user');
  location.reload();
}

function showUserCenter(){
  toggleMenu();
  var u=localStorage.getItem('abi_user');
  if(!u){alert('请先登录');return;}
  var info='[用户中心]\n用户名: '+u+'\n(更多功能开发中)';
  alert(info);
}


</script>

  <footer>
    <p>暗区突围攻略站 · 持续更新中</p>
  </footer>

</body>
</html>
