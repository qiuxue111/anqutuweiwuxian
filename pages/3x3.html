<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3×3 一图流 - 暗区突围：无限</title>
<link rel="icon" href="../favicon.ico" type="image/jpeg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#ddd;font-family:-apple-system,"Microsoft YaHei",sans-serif;overflow:hidden}
.app-bar{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(10,10,15,.95);backdrop-filter:blur(8px);border-bottom:1px solid #222;display:flex;align-items:center;padding:8px 16px;gap:12px;height:48px}
.app-bar h1{color:#ffc832;font-size:18px;font-weight:600;flex:1}
.app-bar a{color:#888;text-decoration:none;font-size:13px}
.app-bar .btn{padding:4px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px}
.btn-edit{background:#2a2a3a;color:#88aaff}
.btn-save{background:#1a4a1a;color:#4f4}
.btn-cancel{background:#3a1a1a;color:#f44}

.canvas-wrap{position:fixed;top:48px;left:0;right:0;bottom:0;overflow:auto;background:#0f0f16}
.grid-container{display:grid;grid-template-columns:repeat(3,220px);grid-template-rows:repeat(3,280px);gap:60px 80px;padding:40px;justify-content:center;align-content:center;min-height:100%}
.card{position:relative;width:220px;height:280px;background:rgba(20,20,30,.95);border:1px solid #333;border-radius:14px;overflow:hidden;transition:box-shadow .2s,border-color .2s;user-select:none;z-index:2}
.card:hover{box-shadow:0 0 20px rgba(255,200,50,.15);border-color:#555}
.card.dragging{opacity:0.9;border-color:#ffc832;box-shadow:0 0 40px rgba(255,200,50,.4);z-index:100}
.card-swap-target{border-color:#ff8833!important;box-shadow:0 0 30px rgba(255,136,51,.5)!important}
.card-img-wrap{width:100%;height:140px;overflow:hidden;background:#0a0a12;display:flex;align-items:center;justify-content:center}
.card-img-wrap img{width:100%;height:100%;object-fit:cover}
.card-name{padding:8px 12px 4px;font-size:14px;font-weight:600;color:#ffc832;text-align:center}
.card-desc{padding:0 12px 8px;font-size:11px;color:#999;line-height:1.4;text-align:center;word-break:break-all}
.card-edit-btn{position:absolute;top:6px;right:6px;z-index:10;background:rgba(0,0,0,.6);border:none;border-radius:4px;color:#aaa;cursor:pointer;padding:3px 7px;font-size:11px;display:none}
.card.editing .card-edit-btn{display:block}
.card-edit-btn:hover{color:#ffc832}
.card-del-btn{position:absolute;top:6px;left:6px;z-index:10;background:rgba(0,0,0,.6);border:none;border-radius:4px;color:#f66;cursor:pointer;padding:3px 7px;font-size:11px;display:none}
.card.editing .card-del-btn{display:block}
.card-del-btn:hover{color:#ff3333}
.card-idx{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);color:#888;font-size:10px;padding:2px 8px;border-radius:4px;display:none}
.card.editing .card-idx{display:block}
.card-empty{position:relative;width:220px;height:280px;border:2px dashed #333;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#555;font-size:12px;z-index:2;background:transparent}

/* SVG 连线（放在 grid 上方绝对定位） */
.conn-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.conn-layer svg{width:100%;height:100%}
.conn-layer path{stroke:#ff8833;stroke-width:3.5;fill:none;stroke-linecap:round;opacity:0.8;filter:drop-shadow(0 0 4px rgba(255,136,51,.3))}
.conn-layer polygon{fill:#ff8833;opacity:0.8}

.edit-controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:none;gap:8px;background:rgba(10,10,15,.92);border:1px solid #333;border-radius:12px;padding:8px 14px;backdrop-filter:blur(8px);white-space:nowrap}
.edit-controls button{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;color:#ddd;transition:background .15s}
.edit-controls .add-btn{background:#1a3a1a;color:#4f4}
.edit-controls .conn-toggle{background:#2a3a2a;color:#aaf}
.edit-controls .undo-btn{background:#2a2a3a;color:#aaa}
.edit-controls .clear-conn{background:#3a1a1a;color:#f66}
.edit-controls button:hover{filter:brightness(1.2)}

.modal-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.8);z-index:9999;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#1a1a24;border:1px solid #333;border-radius:14px;padding:20px;width:380px;max-width:90vw;max-height:80vh;overflow-y:auto}
.modal h2{color:#ffc832;font-size:16px;margin-bottom:14px}
.modal label{display:block;color:#aaa;font-size:12px;margin:8px 0 4px}
.modal input,.modal textarea{width:100%;padding:7px 10px;background:rgba(255,255,255,.05);border:1px solid #333;border-radius:8px;color:#ddd;font-size:12px;outline:none}
.modal input:focus,.modal textarea:focus{border-color:#ffc832}
.modal textarea{min-height:80px;resize:vertical}
.modal .btn-row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.modal .btn-row button{padding:6px 16px;border:none;border-radius:6px;cursor:pointer;font-size:12px}
.modal .btn-save-m{background:#ffc832;color:#000;font-weight:600}
.modal .btn-cancel-m{background:rgba(255,255,255,.08);color:#aaa}
.loading{position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0f;z-index:9999;color:#666;font-size:14px}
</style>
</head>
<body>

<div class="app-bar">
  <a href="index.html">&larr; 返回</a>
  <h1>3&times;3 一图流</h1>
  <button id="editToggle" class="btn btn-edit" onclick="toggleEdit()">进入编辑</button>
  <button id="saveBtn" class="btn btn-save" style="display:none" onclick="saveData()">保存</button>
  <button id="cancelBtn" class="btn btn-cancel" style="display:none" onclick="cancelEdit()">取消</button>
</div>

<div id="canvas" class="canvas-wrap">
  <div class="grid-container" id="grid">
    <div class="conn-layer" id="connLayer">
      <svg id="connSvg"></svg>
    </div>
  </div>
</div>

<div class="edit-controls" id="editControls">
  <button class="add-btn" onclick="addCard()">+ 新建</button>
  <button class="conn-toggle" id="connToggle" onclick="toggleConn()">连线</button>
  <button class="undo-btn" onclick="undoLast()">撤销</button>
  <button class="clear-conn" onclick="clearConns()">清空连线</button>
</div>

<div id="modal" class="modal-overlay">
  <div class="modal">
    <h2 id="modalTitle">编辑任务</h2>
    <label>任务名称</label>
    <input id="edName" placeholder="例: 首轮搜索">
    <label>任务图片链接</label>
    <input id="edImg" placeholder="图片 URL（可选）">
    <label>任务内容</label>
    <textarea id="edDesc" placeholder="描述任务细节..."></textarea>
    <div class="btn-row">
      <button class="btn-cancel-m" onclick="closeModal()">取消</button>
      <button class="btn-save-m" onclick="saveCard()">保存</button>
    </div>
  </div>
</div>

<div class="loading" id="loading">加载中...</div>

<script>
var LS = "\\/";

var cards = [];        // {id, name, img, desc}
var connections = [];  // {from, to} 用卡片 id
var editMode = false;
var connMode = false;
var editingCardId = null;
var selectedConnFrom = null;
var undoStack = [];

/* ====== Load / Save ====== */
function loadData(){
  var saved = localStorage.getItem("abi_3x3_data");
  if(saved){
    try {
      var d = JSON.parse(saved);
      cards = d.cards || [];
      connections = d.connections || [];
    } catch(e) { cards = []; connections = []; }
  }
  renderAll();
  document.getElementById("loading").style.display = "none";
}

function saveData(){
  localStorage.setItem("abi_3x3_data", JSON.stringify({cards:cards, connections:connections}));
}

/* ====== Render ====== */
function escHtml(s){
  if(!s) return "";
  var d = document.createElement("div");
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderAll(){
  renderGrid();
  renderConns();
}

function renderGrid(){
  var grid = document.getElementById("grid");
  grid.querySelectorAll(".card, .card-empty").forEach(function(el){el.remove();});

  // 先渲染按位置排序
  for(var i = 0; i < 9; i++){
    var c = cards[i];
    var div;
    if(c){
      div = document.createElement("div");
      div.className = "card" + (editMode ? " editing" : "");
      div.id = "card_" + c.id;
      div.setAttribute("data-card-idx", i);

      var html = "";
      html += "<button class='card-edit-btn' onclick=\"event.stopPropagation();openEditCard('"+c.id+"')\">\\u270e<"+LS+"button>";
      html += "<button class='card-del-btn' onclick=\"event.stopPropagation();deleteCard('"+c.id+"')\">\\u2716<"+LS+"button>";
      html += "<div class='card-idx'>#" + (i+1) + "<"+LS+"div>";

      if(c.img){
        html += "<div class='card-img-wrap'><img src='"+c.img+"' style='width:100%;height:100%;object-fit:cover'><"+LS+"div>";
      } else {
        html += "<div class='card-img-wrap' style='background:#111;color:#555;font-size:28px;display:flex;align-items:center;justify-content:center'>?<"+LS+"div>";
      }
      html += "<div class='card-name'>" + escHtml(c.name || "") + "<"+LS+"div>";
      if(c.desc){
        html += "<div class='card-desc'>" + escHtml(c.desc) + "<"+LS+"div>";
      }
      div.innerHTML = html;

      // 编辑模式：拖拽交换
      if(editMode){
        div.draggable = true;
        div.addEventListener("dragstart", function(e){
          e.dataTransfer.setData("text/plain", this.getAttribute("data-card-idx"));
          this.classList.add("dragging");
        });
        div.addEventListener("dragend", function(){
          this.classList.remove("dragging");
          document.querySelectorAll(".card-swap-target").forEach(function(el){el.classList.remove("card-swap-target");});
        });
        div.addEventListener("dragover", function(e){
          e.preventDefault();
          document.querySelectorAll(".card-swap-target").forEach(function(el){el.classList.remove("card-swap-target");});
          this.classList.add("card-swap-target");
        });
        div.addEventListener("dragleave", function(){
          this.classList.remove("card-swap-target");
        });
        div.addEventListener("drop", function(e){
          e.preventDefault();
          this.classList.remove("card-swap-target");
          var fromIdx = parseInt(e.dataTransfer.getData("text/plain"));
          var toIdx = parseInt(this.getAttribute("data-card-idx"));
          if(fromIdx !== toIdx && fromIdx >= 0 && toIdx >= 0){
            swapCards(fromIdx, toIdx);
          }
        });
      }
    } else {
      div = document.createElement("div");
      div.className = "card-empty";
      div.textContent = "空";
      if(editMode){
        div.style.cursor = "pointer";
        div.onclick = function(){ addCardAt(i); };
      }
    }
    grid.appendChild(div);
  }
}

function renderConns(){
  var svg = document.getElementById("connSvg");
  svg.innerHTML = "";
  var grid = document.getElementById("grid");

  var gapX = 80, gapY = 60;
  var cardW = 220, cardH = 280;
  var padding = 40;
  var cols = 3;

  connections.forEach(function(conn){
    // 找到 from 和 to 的位置
    var fromIdx = -1, toIdx = -1;
    for(var i = 0; i < cards.length; i++){
      if(cards[i].id === conn.from){ fromIdx = i; }
      if(cards[i].id === conn.to){ toIdx = i; }
    }
    if(fromIdx < 0 || toIdx < 0) return;

    var fromRow = Math.floor(fromIdx / cols);
    var fromCol = fromIdx % cols;
    var toRow = Math.floor(toIdx / cols);
    var toCol = toIdx % cols;

    // 计算 SVG 坐标（相对于 grid 容器）
    var fx = padding + fromCol * (cardW + gapX) + cardW;
    var fy = padding + fromRow * (cardH + gapY) + cardH / 2;
    var tx = padding + toCol * (cardW + gapX);
    var ty = padding + toRow * (cardH + gapY) + cardH / 2;

    // 贝塞尔曲线
    var midX = (fx + tx) / 2;
    var d = "M " + fx + " " + fy + " C " + midX + " " + fy + ", " + midX + " " + ty + ", " + tx + " " + ty;

    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    svg.appendChild(path);

    // 箭头
    var angle = Math.atan2(ty - fy, tx - fx);
    var a = 12, w = 8;
    var p1x = tx - a * Math.cos(angle - w * Math.PI / 180);
    var p1y = ty - a * Math.sin(angle - w * Math.PI / 180);
    var p2x = tx - a * Math.cos(angle + w * Math.PI / 180);
    var p2y = ty - a * Math.sin(angle + w * Math.PI / 180);
    var arrow = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    arrow.setAttribute("points", tx + "," + ty + " " + p1x + "," + p1y + " " + p2x + "," + p2y);
    svg.appendChild(arrow);
  });
}

/* ====== Swap ====== */
function swapCards(fromIdx, toIdx){
  var temp = cards[fromIdx];
  cards[fromIdx] = cards[toIdx];
  cards[toIdx] = temp;
  pushUndo();
  renderAll();
}

/* ====== Edit Mode ====== */
function toggleEdit(){
  editMode = !editMode;
  document.getElementById("editToggle").style.display = editMode ? "none" : "inline-block";
  document.getElementById("saveBtn").style.display = editMode ? "inline-block" : "none";
  document.getElementById("cancelBtn").style.display = editMode ? "inline-block" : "none";
  document.getElementById("editControls").style.display = editMode ? "flex" : "none";
  if(!editMode){
    connMode = false; selectedConnFrom = null;
    saveData();
    document.getElementById("editToggle").textContent = "进入编辑";
  } else {
    document.getElementById("editToggle").textContent = "退出编辑";
  }
  renderAll();
}

function cancelEdit(){
  editMode = false;
  connMode = false; selectedConnFrom = null;
  document.getElementById("editToggle").style.display = "inline-block";
  document.getElementById("saveBtn").style.display = "none";
  document.getElementById("cancelBtn").style.display = "none";
  document.getElementById("editControls").style.display = "none";
  document.getElementById("editToggle").textContent = "进入编辑";
  loadData();
}

/* ====== Connect ====== */
function toggleConn(){
  connMode = !connMode;
  document.getElementById("connToggle").style.background = connMode ? "#3a3a1a" : "#2a3a2a";
  document.getElementById("connToggle").textContent = connMode ? "退出连线" : "连线";
  selectedConnFrom = null;
}

function onCardClick(cardId){
  if(!connMode || !editMode) return;
  if(!selectedConnFrom){
    selectedConnFrom = cardId;
  } else {
    if(selectedConnFrom !== cardId){
      var dup = connections.some(function(c){ return c.from === selectedConnFrom && c.to === cardId; });
      if(!dup){
        connections.push({from:selectedConnFrom, to:cardId});
        pushUndo();
        renderConns();
      }
    }
    selectedConnFrom = null;
  }
}

function clearConns(){
  if(!confirm("确定清空所有连线？")) return;
  connections = [];
  pushUndo();
  renderConns();
}

/* ====== Card CRUD ====== */
function addCard(){
  // 找空位
  var idx = -1;
  for(var i = 0; i < 9; i++){
    if(!cards[i]){ idx = i; break; }
  }
  if(idx < 0){
    alert("9 格已满，请先删除一个卡片再添加");
    return;
  }
  addCardAt(idx);
}

function addCardAt(idx){
  var id = "c" + Date.now() + Math.random().toString(36).slice(2,6);
  cards[idx] = {id:id, name:"新任务", img:"", desc:""};
  pushUndo();
  renderAll();
  openEditCard(id);
}

function deleteCard(id){
  if(!confirm("确定删除这张卡片？")) return;
  var idx = -1;
  for(var i = 0; i < cards.length; i++){
    if(cards[i] && cards[i].id === id){ idx = i; break; }
  }
  if(idx >= 0){
    cards[idx] = undefined;
    connections = connections.filter(function(c){ return c.from !== id && c.to !== id; });
  }
  // 压缩数组
  cards = cards.filter(function(c){ return c !== undefined; });
  pushUndo();
  renderAll();
}

function openEditCard(id){
  for(var i = 0; i < cards.length; i++){
    if(cards[i] && cards[i].id === id){
      var c = cards[i];
      editingCardId = id;
      document.getElementById("modalTitle").textContent = "编辑任务 " + (i+1);
      document.getElementById("edName").value = c.name || "";
      document.getElementById("edImg").value = c.img || "";
      document.getElementById("edDesc").value = c.desc || "";
      document.getElementById("modal").classList.add("show");
      return;
    }
  }
}

function saveCard(){
  for(var i = 0; i < cards.length; i++){
    if(cards[i] && cards[i].id === editingCardId){
      var c = cards[i];
      c.name = document.getElementById("edName").value;
      c.img = document.getElementById("edImg").value;
      c.desc = document.getElementById("edDesc").value;
      pushUndo();
      closeModal();
      renderAll();
      return;
    }
  }
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
  editingCardId = null;
}

/* ====== Undo ====== */
function pushUndo(){
  undoStack.push(JSON.stringify({cards:cards, connections:connections}));
  if(undoStack.length > 20) undoStack.shift();
}

function undoLast(){
  if(undoStack.length < 2) return;
  undoStack.pop();
  var prev = JSON.parse(undoStack[undoStack.length - 1]);
  cards = prev.cards;
  connections = prev.connections;
  renderAll();
}

/* ====== Card Click (connect mode) ====== */
document.getElementById("grid").addEventListener("click", function(e){
  var cardEl = e.target.closest(".card");
  if(!cardEl) return;
  var id = cardEl.id.replace("card_", "");
  onCardClick(id);
});

/* ====== Init ====== */
document.getElementById("editToggle").style.display = "inline-block";
loadData();
window.addEventListener("resize", function(){ renderConns(); });
</script>
</body>
</html>
