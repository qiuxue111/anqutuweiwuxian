<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3×3 一图流 - 暗区突围：无限</title>
<link rel="icon" href="../favicon.ico" type="image/jpeg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#ddd;font-family:-apple-system,"Microsoft YaHei",sans-serif;overflow:hidden}
.app-bar{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(10,10,15,.95);backdrop-filter:blur(8px);border-bottom:1px solid #222;display:flex;align-items:center;padding:8px 16px;gap:12px;height:48px}
.app-bar h1{color:#ffc832;font-size:18px;font-weight:600;flex:1}
.app-bar a{color:#888;text-decoration:none;font-size:13px}
.app-bar .btn{padding:4px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px}
.btn-edit{background:#2a2a3a;color:#88aaff}
.btn-save{background:#1a4a1a;color:#4f4}
.btn-cancel{background:#3a1a1a;color:#f44}

.canvas-wrap{position:fixed;top:48px;left:0;right:0;bottom:0;overflow:hidden;background:#0f0f16;cursor:grab}
.canvas-wrap.dragging{cursor:grabbing}
.canvas-inner{position:absolute;top:0;left:0;transform-origin:0 0}

#connSvg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
#connSvg path{stroke:#ff8833;stroke-width:3.5;fill:none;stroke-linecap:round;opacity:0.85;filter:drop-shadow(0 0 4px rgba(255,136,51,.3))}
#connSvg polygon{fill:#ff8833;opacity:0.85}

.card{position:absolute;width:240px;min-height:130px;background:rgba(18,18,28,.96);border:1.5px solid rgba(255,255,255,.08);border-radius:14px;cursor:pointer;z-index:2;overflow:hidden;transition:box-shadow .2s,border-color .2s;user-select:none}
.card:hover{box-shadow:0 0 20px rgba(255,200,50,.18);border-color:rgba(255,200,50,.3)}
.card.editing{border-color:#ffc832;box-shadow:0 0 30px rgba(255,200,50,.35)}

.card-title{padding:12px 14px 4px;font-size:15px;font-weight:600;color:#fff;text-align:center;letter-spacing:1px}
.card-desc{padding:0 14px 14px;font-size:12px;color:#999;line-height:1.5;text-align:left;word-break:break-all;min-height:24px}

.card-actions{position:absolute;bottom:0;left:0;right:0;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 4px;z-index:5}
.card-dot{width:22px;height:22px;border-radius:50%;border:3px solid #111;cursor:crosshair;display:none;transition:transform .15s,box-shadow .15s;z-index:6}
.card.editing .card-dot{display:block}
.card-dot:hover{transform:scale(1.2);box-shadow:0 0 10px currentColor}
.dot-blue{background:#4488ff;margin-left:6px}
.dot-green{background:#22cc66;margin-right:6px}

.card-edit-btn{position:absolute;top:6px;right:6px;z-index:10;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:5px;color:#aaa;cursor:pointer;padding:3px 7px;font-size:11px;display:none}
.card.editing .card-edit-btn{display:block}
.card-edit-btn:hover{color:#ffc832;background:rgba(255,200,50,.15)}
.card-del-btn{position:absolute;top:6px;left:6px;z-index:10;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:5px;color:#f66;cursor:pointer;padding:3px 7px;font-size:11px;display:none}
.card.editing .card-del-btn{display:block}
.card-del-btn:hover{color:#ff3333;background:rgba(255,50,50,.15)}

.toolbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:none;gap:8px;background:rgba(10,10,15,.92);border:1px solid #333;border-radius:12px;padding:8px 14px;backdrop-filter:blur(8px);white-space:nowrap}
.toolbar button{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;color:#ddd;transition:background .15s}
.toolbar .add-btn{background:#1a3a1a;color:#4f4}
.toolbar .conn-toggle{background:#2a3a2a;color:#aaf}
.toolbar .undo-btn{background:#2a2a3a;color:#aaa}
.toolbar .clear-btn{background:#3a1a1a;color:#f66}
.toolbar button:hover{filter:brightness(1.2)}

.modal-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.8);z-index:9999;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#1a1a24;border:1px solid #333;border-radius:14px;padding:20px;width:380px;max-width:90vw;max-height:80vh;overflow-y:auto}
.modal h2{color:#ffc832;font-size:16px;margin-bottom:14px}
.modal label{display:block;color:#aaa;font-size:12px;margin:8px 0 4px}
.modal input,.modal textarea{width:100%;padding:7px 10px;background:rgba(255,255,255,.05);border:1px solid #333;border-radius:8px;color:#ddd;font-size:12px;outline:none}
.modal input:focus,.modal textarea:focus{border-color:#ffc832}
.modal textarea{min-height:60px;resize:vertical}
.modal .btn-row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.modal .btn-row button{padding:6px 16px;border:none;border-radius:6px;cursor:pointer;font-size:12px}
.modal .btn-save-m{background:#ffc832;color:#000;font-weight:600}
.modal .btn-cancel-m{background:rgba(255,255,255,.08);color:#aaa}
.loading{position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0f;z-index:9999;color:#666;font-size:14px}
</style>
</head>
<body>

<div class="app-bar">
  <a href="index.html">&larr; 返回</a>
  <h1>3&times;3 一图流</h1>
  <button id="editToggle" class="btn btn-edit" onclick="toggleEdit()">进入编辑</button>
  <button id="saveBtn" class="btn btn-save" style="display:none" onclick="saveData()">保存</button>
  <button id="cancelBtn" class="btn btn-cancel" style="display:none" onclick="cancelEdit()">取消</button>
</div>

<div id="canvas" class="canvas-wrap">
  <div id="canvasInner" class="canvas-inner">
    <svg id="connSvg"></svg>
  </div>
</div>

<div id="toolbar" class="toolbar">
  <button class="add-btn" onclick="addCard()">+ 新建</button>
  <button class="conn-toggle" id="connToggle" onclick="toggleConn()">连线</button>
  <button class="undo-btn" onclick="undoLast()">撤销</button>
  <button class="clear-btn" onclick="clearConns()">清空连线</button>
</div>

<div id="modal" class="modal-overlay">
  <div class="modal">
    <h2 id="modalTitle">编辑任务</h2>
    <label>任务名称（居中显示）</label>
    <input id="edName" placeholder="例: 第一波清理">
    <label>任务描述</label>
    <textarea id="edDesc" placeholder="任务细节描述" style="min-height:60px"></textarea>
    <div class="btn-row">
      <button class="btn-cancel-m" onclick="closeModal()">取消</button>
      <button class="btn-save-m" onclick="saveCard()">保存</button>
    </div>
  </div>
</div>

<div class="loading" id="loading">加载中...</div>

<script>
var cards = [];
var connections = [];
var editMode = false;
var connMode = false;
var editingCardId = null;
var selectedConnFrom = null;
var undoStack = [];

var panX = 0, panY = 0;
var isPanning = false, panStartX = 0, panStartY = 0, panOX = 0, panOY = 0;

function loadData(){
  var saved = localStorage.getItem("abi_3x3_data");
  if(saved){
    try {
      var d = JSON.parse(saved);
      cards = d.cards || [];
      connections = d.connections || [];
    } catch(e) { cards = []; connections = []; }
  }
  renderAll();
  document.getElementById("loading").style.display = "none";
}

function saveData(){
  localStorage.setItem("abi_3x3_data", JSON.stringify({cards:cards, connections:connections}));
}

function escHtml(s){
  if(!s) return "";
  var d = document.createElement("div");
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderAll(){
  var inner = document.getElementById("canvasInner");
  inner.querySelectorAll(".card").forEach(function(el){el.remove();});
  cards.forEach(function(c){ renderCard(c); });
  renderConns();
  updatePan();
}

function renderCard(c){
  var inner = document.getElementById("canvasInner");
  var div = document.createElement("div");
  div.className = "card" + (editMode ? " editing" : "");
  div.id = "card_" + c.id;
  div.style.left = c.x + "px";
  div.style.top = c.y + "px";

  // Edit button
  var editBtn = document.createElement("button");
  editBtn.className = "card-edit-btn";
  editBtn.textContent = "\u270e";
  editBtn.addEventListener("click", function(e){ e.stopPropagation(); openEditCard(c.id); });
  div.appendChild(editBtn);

  // Delete button
  var delBtn = document.createElement("button");
  delBtn.className = "card-del-btn";
  delBtn.textContent = "\u2716";
  delBtn.addEventListener("click", function(e){ e.stopPropagation(); deleteCard(c.id); });
  div.appendChild(delBtn);

  // Title
  var title = document.createElement("div");
  title.className = "card-title";
  title.textContent = c.name || "";
  div.appendChild(title);

  // Description
  if(c.desc){
    var descEl = document.createElement("div");
    descEl.className = "card-desc";
    descEl.textContent = c.desc;
    div.appendChild(descEl);
  }

  // Actions bar
  var actions = document.createElement("div");
  actions.className = "card-actions";

  var blueDot = document.createElement("div");
  blueDot.className = "card-dot dot-blue";
  blueDot.title = "\u8fde\u7ebf\u7ec8\u70b9";
  var self = c;
  blueDot.addEventListener("click", function(e){ e.stopPropagation(); onDotClick(self.id, "in"); });
  actions.appendChild(blueDot);

  var greenDot = document.createElement("div");
  greenDot.className = "card-dot dot-green";
  greenDot.title = "\u8fde\u7ebf\u8d77\u70b9";
  greenDot.addEventListener("click", function(e){ e.stopPropagation(); onDotClick(self.id, "out"); });
  actions.appendChild(greenDot);

  div.appendChild(actions);

  // Drag
  if(editMode){
    (function(card, cardData){
      div.addEventListener("mousedown", function(e){
        if(e.target.closest(".card-edit-btn,.card-del-btn,.card-dot")) return;
        if(e.button !== 0) return;
        var sx = e.clientX, sy = e.clientY;
        var ox = cardData.x, oy = cardData.y;
        var moved = false;
        function mm(ev){
          cardData.x = Math.max(0, ox + ev.clientX - sx);
          cardData.y = Math.max(0, oy + ev.clientY - sy);
          card.style.left = cardData.x + "px";
          card.style.top = cardData.y + "px";
          moved = true;
          renderConns();
        }
        function mu(){
          document.removeEventListener("mousemove", mm);
          document.removeEventListener("mouseup", mu);
          if(moved) pushUndo();
        }
        document.addEventListener("mousemove", mm);
        document.addEventListener("mouseup", mu);
        e.preventDefault();
      });
    })(div, c);
  }

  inner.appendChild(div);
}

function renderConns(){
  var svg = document.getElementById("connSvg");
  svg.innerHTML = "";
  connections.forEach(function(conn){
    var fromEl = document.getElementById("card_" + conn.from);
    var toEl = document.getElementById("card_" + conn.to);
    if(!fromEl || !toEl) return;

    var fromH = fromEl.offsetHeight;
    var fx = parseFloat(fromEl.style.left) + fromEl.offsetWidth;
    var fy = parseFloat(fromEl.style.top) + fromH - 15;
    var tx = parseFloat(toEl.style.left);
    var ty = parseFloat(toEl.style.top) + toEl.offsetHeight - 15;

    var midX = (fx + tx) / 2;
    var d = "M " + fx + " " + fy + " C " + midX + " " + fy + ", " + midX + " " + ty + ", " + tx + " " + ty;

    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    svg.appendChild(path);

    var angle = Math.atan2(ty - fy, tx - fx);
    var a = 12, w = 8;
    var p1x = tx - a * Math.cos(angle - w * Math.PI / 180);
    var p1y = ty - a * Math.sin(angle - w * Math.PI / 180);
    var p2x = tx - a * Math.cos(angle + w * Math.PI / 180);
    var p2y = ty - a * Math.sin(angle + w * Math.PI / 180);
    var arrow = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    arrow.setAttribute("points", tx + "," + ty + " " + p1x + "," + p1y + " " + p2x + "," + p2y);
    svg.appendChild(arrow);
  });
}

function updatePan(){
  var inner = document.getElementById("canvasInner");
  inner.style.transform = "translate(" + panX + "px," + panY + "px)";
}

function toggleEdit(){
  editMode = !editMode;
  document.getElementById("editToggle").style.display = editMode ? "none" : "inline-block";
  document.getElementById("saveBtn").style.display = editMode ? "inline-block" : "none";
  document.getElementById("cancelBtn").style.display = editMode ? "inline-block" : "none";
  document.getElementById("toolbar").style.display = editMode ? "flex" : "none";
  document.getElementById("canvas").style.cursor = editMode ? "default" : "grab";
  if(!editMode){
    connMode = false; selectedConnFrom = null;
    saveData();
    document.getElementById("editToggle").textContent = "\u8fdb\u5165\u7f16\u8f91";
  } else {
    document.getElementById("editToggle").textContent = "\u9000\u51fa\u7f16\u8f91";
  }
  renderAll();
}

function cancelEdit(){
  editMode = false;
  connMode = false; selectedConnFrom = null;
  document.getElementById("editToggle").style.display = "inline-block";
  document.getElementById("saveBtn").style.display = "none";
  document.getElementById("cancelBtn").style.display = "none";
  document.getElementById("toolbar").style.display = "none";
  document.getElementById("canvas").style.cursor = "grab";
  document.getElementById("editToggle").textContent = "\u8fdb\u5165\u7f16\u8f91";
  loadData();
}

function toggleConn(){
  connMode = !connMode;
  if(connMode && !editMode){ editMode = true; renderAll(); }
  document.getElementById("editToggle").style.display = editMode ? "none" : "inline-block";
  document.getElementById("saveBtn").style.display = editMode ? "inline-block" : "none";
  document.getElementById("cancelBtn").style.display = editMode ? "inline-block" : "none";
  document.getElementById("toolbar").style.display = editMode ? "flex" : "none";
  document.getElementById("connToggle").style.background = connMode ? "#3a3a1a" : "#2a3a2a";
  document.getElementById("connToggle").textContent = connMode ? "\u9000\u51fa\u8fde\u7ebf" : "\u8fde\u7ebf";
  selectedConnFrom = null;
  document.querySelectorAll(".dot-green").forEach(function(el){el.classList.remove("active");});
}

function onDotClick(cardId, type){
  if(!connMode) return;
  if(type === "out"){
    selectedConnFrom = cardId;
    document.querySelectorAll(".dot-green").forEach(function(el){el.classList.remove("active");});
    var el = document.querySelector("#card_" + cardId + " .dot-green");
    if(el) el.classList.add("active");
  } else if(type === "in" && selectedConnFrom){
    if(selectedConnFrom !== cardId){
      var dup = connections.some(function(c){ return c.from === selectedConnFrom && c.to === cardId; });
      if(!dup){
        connections.push({from:selectedConnFrom, to:cardId});
        pushUndo();
        renderConns();
      }
    }
    selectedConnFrom = null;
    document.querySelectorAll(".dot-green").forEach(function(el){el.classList.remove("active");});
  }
}

function clearConns(){
  if(!confirm("\u786e\u5b9a\u6e05\u7a7a\u6240\u6709\u8fde\u7ebf\uff1f")) return;
  connections = [];
  pushUndo();
  renderConns();
}

function addCard(){
  var id = "c" + Date.now() + Math.random().toString(36).slice(2,6);
  var x = (window.innerWidth - 240) / 2;
  var y = (window.innerHeight - 130) / 2;
  cards.push({id:id, name:"\u65b0\u4efb\u52a1", desc:"", x:x, y:y});
  pushUndo();
  renderAll();
  openEditCard(id);
}

function deleteCard(id){
  if(!confirm("\u786e\u5b9a\u5220\u9664\u8fd9\u5f20\u5361\u7247\uff1f")) return;
  var idx = cards.findIndex(function(c){ return c.id === id; });
  if(idx >= 0) cards.splice(idx, 1);
  connections = connections.filter(function(c){ return c.from !== id && c.to !== id; });
  pushUndo();
  renderAll();
}

function openEditCard(id){
  var c = cards.find(function(card){ return card.id === id; });
  if(!c) return;
  editingCardId = id;
  document.getElementById("modalTitle").textContent = "\u7f16\u8f91\u4efb\u52a1";
  document.getElementById("edName").value = c.name || "";
  document.getElementById("edDesc").value = c.desc || "";
  document.getElementById("modal").classList.add("show");
}

function saveCard(){
  var c = cards.find(function(card){ return card.id === editingCardId; });
  if(!c) return;
  c.name = document.getElementById("edName").value;
  c.desc = document.getElementById("edDesc").value;
  pushUndo();
  closeModal();
  renderAll();
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
  editingCardId = null;
}

function pushUndo(){
  undoStack.push(JSON.stringify({cards:cards, connections:connections}));
  if(undoStack.length > 20) undoStack.shift();
}

function undoLast(){
  if(undoStack.length < 2) return;
  undoStack.pop();
  var prev = JSON.parse(undoStack[undoStack.length - 1]);
  cards = prev.cards;
  connections = prev.connections;
  renderAll();
}

document.getElementById("canvas").addEventListener("contextmenu", function(e){
  if(!editMode) return;
  e.preventDefault();
  var id = "c" + Date.now() + Math.random().toString(36).slice(2,6);
  var inner = document.getElementById("canvasInner");
  var rect = inner.getBoundingClientRect();
  var ix = e.clientX - rect.left - 120;
  var iy = e.clientY - rect.top - 65;
  cards.push({id:id, name:"\u65b0\u4efb\u52a1", desc:"", x:ix, y:iy});
  pushUndo();
  renderAll();
  openEditCard(id);
});

document.getElementById("canvas").addEventListener("mousedown", function(e){
  if(editMode) return;
  if(e.button !== 0) return;
  if(e.target.closest(".card")) return;
  isPanning = true;
  panStartX = e.clientX;
  panStartY = e.clientY;
  panOX = panX;
  panOY = panY;
  this.classList.add("dragging");
});

document.addEventListener("mousemove", function(e){
  if(!isPanning) return;
  panX = panOX + e.clientX - panStartX;
  panY = panOY + e.clientY - panStartY;
  updatePan();
});

document.addEventListener("mouseup", function(){
  if(isPanning){
    isPanning = false;
    document.getElementById("canvas").classList.remove("dragging");
  }
});

document.getElementById("editToggle").style.display = "inline-block";
loadData();
window.addEventListener("resize", function(){ renderConns(); });
</script>
</body>
</html>
