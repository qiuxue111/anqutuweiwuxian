<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<title>暗区突围 - 地图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a14;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#ccc;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

.map-wrap{position:fixed;top:0;left:0;width:100%;height:100%;overflow:hidden}
#mv{position:absolute;top:0;left:0;transform-origin:0 0;width:100%;height:100%}
#mapImg{display:block;width:100%;height:auto;pointer-events:none}
#mv .pin-marker{position:absolute;cursor:pointer;transition:opacity .15s;z-index:2}
#mv .pin-marker .pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid #ffc832;background:rgba(255,200,50,0.3);transform:translate(-50%,-50%)}
#mv .pin-marker .pin-icon{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,0.9);color:#eee;background:rgba(0,0,0,0.4);padding:1px 5px;border-radius:4px}
#mv .pin-marker.active .pin-dot{background:#ffc832;box-shadow:0 0 12px rgba(255,200,50,0.6)}
#mv .pin-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}

.top-bar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0));background:linear-gradient(180deg,rgba(0,0,0,0.7) 0%,transparent 100%);pointer-events:none}
.top-bar>*{pointer-events:auto}
.top-bar .back-btn,.top-bar .hamburger{width:36px;height:36px;border-radius:8px;border:none;background:rgba(0,0,0,0.5);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.top-bar .map-title{font-size:15px;font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.6)}

.hamburger-menu{display:none;position:fixed;top:0;right:0;width:280px;max-width:85vw;height:100%;z-index:200;background:rgba(10,10,20,0.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow-y:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0));transition:transform .25s ease;transform:translateX(100%);border-left:1px solid rgba(255,255,255,0.06)}
.hamburger-menu.open{display:block;transform:translateX(0)}
.hamburger-menu .hm-close{position:absolute;top:calc(8px + env(safe-area-inset-top,0));right:8px;width:32px;height:32px;border-radius:6px;border:none;background:rgba(255,255,255,0.08);color:#aaa;font-size:18px;cursor:pointer}
.hamburger-menu .hm-section{margin-top:16px}
.hamburger-menu .hm-section-title{color:#ffc832;font-size:13px;font-weight:600;padding:8px 0 4px;border-bottom:1px solid rgba(255,255,255,0.06)}
.hamburger-menu .hm-item{display:block;padding:10px 8px;color:#aaa;text-decoration:none;font-size:14px;border-radius:6px;transition:background .15s}
.hamburger-menu .hm-item:hover{background:rgba(255,255,255,0.06);color:#fff}
.hamburger-menu .hm-logout{margin-top:24px;width:100%;padding:10px;background:rgba(255,50,50,0.1);border:1px solid rgba(255,50,50,0.3);border-radius:8px;color:#ff6666;text-align:center;font-size:13px;cursor:pointer}

.bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0));background:linear-gradient(0deg,rgba(0,0,0,0.75) 0%,transparent 100%);pointer-events:none}
.bottom-bar>*{pointer-events:auto}
.bottom-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 10px;border-radius:8px;border:none;background:rgba(20,20,35,0.8);color:#ccc;font-size:10px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-width:60px;transition:transform .1s}
.bottom-btn:active{background:rgba(40,40,60,0.9);transform:scale(0.93)}
.bottom-btn.active{background:rgba(255,200,50,0.2);color:#ffc832}
.bottom-btn .icon{font-size:18px}

.zoom-group{position:fixed;right:10px;bottom:65px;z-index:99;display:flex;flex-direction:column;gap:4px}
.zoom-group button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.55);color:#ccc;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.zoom-group button:active{background:rgba(40,40,60,0.8)}

.floor-selector{display:none;position:fixed;left:10px;bottom:60px;z-index:99;background:rgba(10,10,20,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:4px;min-width:100px}
.floor-selector.open{display:block}
.floor-selector .floor-item{padding:10px 14px;border-radius:6px;color:#aaa;font-size:13px;cursor:pointer}
.floor-selector .floor-item:active{background:rgba(255,200,50,0.15)}
.floor-selector .floor-item.active{background:rgba(255,200,50,0.2);color:#ffc832}

.layer-selector{display:none;position:fixed;right:10px;bottom:60px;z-index:99;background:rgba(10,10,20,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:4px;min-width:130px;max-height:50vh;overflow-y:auto}
.layer-selector.open{display:block}
.layer-selector .layer-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;color:#aaa;font-size:13px;cursor:pointer}
.layer-selector .layer-item:active{background:rgba(255,255,255,0.06)}
.layer-selector .layer-item .lchk{width:18px;height:18px;border-radius:4px;border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.layer-selector .layer-item.active .lchk{background:#ffc832;border-color:#ffc832;color:#111}

.pin-detail{display:none;position:fixed;bottom:60px;left:0;right:0;z-index:150;margin:0 10px;background:rgba(15,15,28,0.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0));max-height:45vh;overflow-y:auto}
.pin-detail.open{display:block}
.pin-detail .pd-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pin-detail .pd-name{font-size:16px;font-weight:600;color:#ffc832}
.pin-detail .pd-close{width:28px;height:28px;border-radius:6px;border:none;background:rgba(255,255,255,0.06);color:#888;font-size:16px;cursor:pointer}
.pin-detail .pd-info{font-size:12px;color:#888;margin-bottom:8px}
.pin-detail .pd-note{font-size:13px;color:#ccc;padding:8px;background:rgba(255,255,255,0.03);border-radius:6px;margin-bottom:8px}
.pin-detail .pd-images{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pin-detail .pd-images img{width:60px;height:60px;border-radius:6px;object-fit:cover;border:1px solid rgba(255,255,255,0.06)}
.pin-detail .pd-actions{display:flex;gap:8px;margin-top:8px}
.pin-detail .pd-actions button{flex:1;padding:10px;border-radius:8px;border:none;font-size:12px;cursor:pointer}
.pin-detail .pd-actions .pd-delete{background:rgba(255,50,50,0.1);color:#ff6666}
.pin-detail .pd-actions .pd-report{background:rgba(136,170,255,0.1);color:#88aaff}

.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:90;background:rgba(0,0,0,0.35)}
.overlay.open{display:block}

.loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:999;color:#888;font-size:14px}
</style>
</head>
<body>

<div class="map-wrap" id="mapWrap">
  <div id="mv">
    <img id="mapImg" alt="地图" draggable="false">
    <div id="pinsLayer" class="pin-layer"></div>
  </div>
</div>

<div class="top-bar">
  <button class="back-btn" id="backBtn">←</button>
  <span class="map-title" id="mapTitle">加载中...</span>
  <button class="hamburger" id="hamburgerBtn">☰</button>
</div>

<div class="zoom-group">
  <button id="zoomIn">＋</button>
  <button id="zoomOut">−</button>
</div>

<div class="floor-selector" id="floorSelector"></div>
<div class="layer-selector" id="layerSelector"></div>

<div class="bottom-bar" id="bottomBar">
  <button class="bottom-btn" id="floorBtn"><span class="icon">🏢</span>楼层</button>
  <button class="bottom-btn" id="layerBtn"><span class="icon">📋</span>图层</button>
  <button class="bottom-btn" id="addPinBtn"><span class="icon">📍</span>报点</button>
  <button class="bottom-btn" id="resetViewBtn"><span class="icon">🔄</span>复位</button>
</div>

<div class="pin-detail" id="pinDetail">
  <div class="pd-header">
    <span class="pd-name" id="pdName"></span>
    <button class="pd-close" id="pdClose">✕</button>
  </div>
  <div class="pd-info" id="pdInfo"></div>
  <div class="pd-note" id="pdNote" style="display:none"></div>
  <div class="pd-images" id="pdImages"></div>
  <div class="pd-actions">
    <button class="pd-delete" id="pdDelete">🗑 删除</button>
  </div>
</div>

<div class="overlay" id="overlay"></div>

// ====== 状态 ======
var mapData = null, currentFloor = 0, pins = [], mapComments = [];
var scaleM = 1, panX = 0, panY = 0, selectedLayers = {}, curPinIdx = null;
var touchStartDist = 0, touchStartScale = 1, touchStartX = 0, touchStartY = 0;
var touchPanX = 0, touchPanY = 0, _touchMoved = false, mode = 'browse';

// ====== 初始化 ======
function init(){
  var params = new URLSearchParams(window.location.search);
  var map = params.get('map') || 'tvstation';
  mapData = MAPS[map];
  if(!mapData) { alert('未知地图: '+map); return; }

  document.getElementById('mapTitle').textContent = mapData.cn + ' - 暗区突围';
  document.title = mapData.cn + ' - 暗区突围地图';

  // 加载初始图层（全选）
  for(var cat in mapData.layerData) selectedLayers[cat] = true;

  loadPins();
  loadMapImg();
  renderFloorSelector();
  renderLayerSelector();
  setupEvents();
}

function loadMapImg(){
  var img = document.getElementById('mapImg');
  img.src = mapData.floors[currentFloor].img;
  img.onload = function(){ fitMap(); };
}

function fitMap(){
  var wrap = document.getElementById('mapWrap');
  var img = document.getElementById('mapImg');
  if(!img.complete || !img.naturalWidth) return;
  var wr = wrap.getBoundingClientRect();
  scaleM = Math.min(wr.width / img.naturalWidth, wr.height / img.naturalHeight);
  panX = 0; panY = 0;
  updateTransform();
}

function updateTransform(){
  var el = document.getElementById('mv');
  if(!el) return;
  el.style.transform = 'translate('+panX+'px,'+panY+'px) scale('+scaleM+')';
}

// ====== 触控事件 ======
function setupEvents(){
  var mv = document.getElementById('mv');
  if(!mv) return;

  // 单指拖拽
  mv.addEventListener('touchstart', function(e){
    if(e.touches.length === 1){
      _touchMoved = false;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchPanX = panX;
      touchPanY = panY;
    } else if(e.touches.length === 2){
      touchStartDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      touchStartScale = scaleM;
    }
  }, {passive: true});

  mv.addEventListener('touchmove', function(e){
    if(e.touches.length === 1 && !_touchMoved){
      var dx = e.touches[0].clientX - touchStartX;
      var dy = e.touches[0].clientY - touchStartY;
      if(Math.abs(dx) > 8 || Math.abs(dy) > 8) _touchMoved = true;
    }
    if(e.touches.length === 1 && _touchMoved){
      var dx = e.touches[0].clientX - touchStartX;
      var dy = e.touches[0].clientY - touchStartY;
      panX = touchPanX + dx;
      panY = touchPanY + dy;
      updateTransform();
      e.preventDefault();
    } else if(e.touches.length === 2){
      e.preventDefault();
      var dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      scaleM = touchStartScale * dist / touchStartDist;
      if(scaleM < 0.3) scaleM = 0.3;
      if(scaleM > 10) scaleM = 10;
      updateTransform();
    }
  }, {passive: false});

  // 点击标记
  mv.addEventListener('click', function(e){
    var marker = e.target.closest('.pin-marker');
    if(marker){
      var idx = parseInt(marker.getAttribute('data-idx'));
      if(!isNaN(idx)) openPinDetail(idx);
      return;
    }
    closePinDetail();
  });

  // 缩放按钮
  document.getElementById('zoomIn').addEventListener('click', function(){
    scaleM *= 1.3;
    if(scaleM > 10) scaleM = 10;
    updateTransform();
  });
  document.getElementById('zoomOut').addEventListener('click', function(){
    scaleM *= 0.7;
    if(scaleM < 0.3) scaleM = 0.3;
    updateTransform();
  });

  // 底部按钮
  document.getElementById('floorBtn').addEventListener('click', toggleFloorSelector);
  document.getElementById('layerBtn').addEventListener('click', toggleLayerSelector);
  document.getElementById('resetViewBtn').addEventListener('click', fitMap);

  // 返回
  document.getElementById('backBtn').addEventListener('click', function(){
    window.location.href = '../index.html';
  });

  // 弹窗关闭
  document.getElementById('pdClose').addEventListener('click', closePinDetail);

  // 遮罩关闭
  document.getElementById('overlay').addEventListener('click', function(){
    closeFloorSelector();
    closeLayerSelector();
    document.getElementById('hamburgerMenu').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  });

  // 注册
  setupHamburger();
}

// ====== 标记渲染 ======
function loadPins(){
  if(!mapData) return;
  try {
    var saved = localStorage.getItem('abi_'+mapData.eng+'_pins');
    if(saved) { var d = JSON.parse(saved); pins = d.pins || []; mapComments = d.mapComments || []; }
  } catch(e){}
  renderPins();
  loadCloudPins();
}

function loadCloudPins(){
  if(!SUPABASE_URL) return;
  setTimeout(function(){
    supabase('pending_pins','GET',null,'select=*&map_name=eq.'+encodeURIComponent(mapData.cn)+'&status=eq.approved')
      .then(function(rows){
        if(!rows || !rows.length) return;
        var localIds = {};
        pins.forEach(function(p){ if(p.id) localIds[p.id] = true; });
        var added = false;
        rows.forEach(function(r){
          if(!localIds[r.id]){
            pins.push({
              id: r.id, name: r.name, type: r.type, ic: r.ic||'', note: r.note||'',
              images: r.images||[], comments: r.comments||[], floor: r.floor||0,
              submitted_by: r.submitted_by||'', x: r.x, y: r.y
            });
            added = true;
          }
        });
        if(added) renderPins();
      })['catch'](function(){});
  }, 500);
}

function renderPins(){
  var layer = document.getElementById('pinsLayer');
  if(!layer) return;
  layer.innerHTML = '';

  pins.forEach(function(p, idx){
    if(p.floor !== undefined && p.floor !== null && p.floor !== currentFloor) return;

    // 图层过滤
    var cat = '';
    if(mapData){
      for(var c in mapData.layerData){
        if(mapData.layerData[c].indexOf(p.name) >= 0) { cat = c; break; }
      }
    }
    var keys = Object.keys(selectedLayers);
    if(cat && keys.length > 0 && !selectedLayers[cat]) return;

    var el = document.createElement('div');
    el.className = 'pin-marker' + (idx === curPinIdx ? ' active' : '');
    el.style.left = p.x + '%';
    el.style.top = p.y + '%';
    el.setAttribute('data-idx', idx);

    var dot = document.createElement('div');
    dot.className = 'pin-dot';
    el.appendChild(dot);

    if(p.name){
      var label = document.createElement('div');
      label.className = 'pin-icon';
      label.textContent = p.name;
      el.appendChild(label);
    }

    layer.appendChild(el);
  });
}

// ====== 弹窗 ======
function openPinDetail(idx){
  curPinIdx = idx;
  var p = pins[idx];
  if(!p) return;

  document.getElementById('pdName').textContent = p.name || '物资';
  document.getElementById('pdInfo').textContent = (p.submitted_by ? '提交: '+p.submitted_by : '') + (p.floor ? ' | 楼层: '+p.floor : '');

  var noteEl = document.getElementById('pdNote');
  if(p.note){ noteEl.style.display = 'block'; noteEl.textContent = p.note; }
  else { noteEl.style.display = 'none'; }

  var imgsEl = document.getElementById('pdImages');
  imgsEl.innerHTML = '';
  if(p.images && p.images.length){
    p.images.forEach(function(url){
      var img = document.createElement('img');
      img.src = url;
      img.onerror = function(){ this.style.display='none'; };
      imgsEl.appendChild(img);
    });
  }

  document.getElementById('pinDetail').classList.add('open');

  // 删除按钮
  document.getElementById('pdDelete').onclick = function(){
    if(!confirm('确定申请删除此标记？')) return;
    var ustr = localStorage.getItem('abi_user');
    var uname = 'Anon';
    try{ var uj=JSON.parse(ustr); uname=uj.user_metadata&&uj.user_metadata.preferred_username||uj.user_metadata&&uj.user_metadata.user_name||'Anon'; }catch(e){}
    if(p.id && SUPABASE_URL){
      supabase('deletion_requests','POST',{pin_id:p.id,name:p.name,x:p.x,y:p.y,submitted_by:uname,type:p.type||'',ic:p.ic||'',note:p.note||'',images:p.images||[],floor:p.floor||0,map_name:mapData.cn||''})
        .then(function(){ alert('已提交删除请求'); })['catch'](function(e){ alert('提交失败: '+e.message); });
    } else {
      pins.splice(idx, 1);
      closePinDetail();
      renderPins();
    }
  };

  renderPins();
}

function closePinDetail(){
  curPinIdx = null;
  document.getElementById('pinDetail').classList.remove('open');
  renderPins();
}

// ====== 楼层 ======
function renderFloorSelector(){
  var el = document.getElementById('floorSelector');
  el.innerHTML = '';
  if(!mapData) return;
  mapData.floors.forEach(function(f, idx){
    var item = document.createElement('div');
    item.className = 'floor-item' + (idx === currentFloor ? ' active' : '');
    item.textContent = f.label;
    (function(i){ item.addEventListener('click', function(){ switchFloor(i); }); })(idx);
    el.appendChild(item);
  });
}

function switchFloor(idx){
  if(idx === currentFloor) { closeFloorSelector(); return; }
  currentFloor = idx;
  var img = document.getElementById('mapImg');
  img.src = mapData.floors[idx].img;
  img.onload = function(){
    fitMap();
    renderPins();
    renderFloorSelector();
    closeFloorSelector();
    closeLayerSelector();
  };
}

// ====== 图层 ======
function renderLayerSelector(){
  var el = document.getElementById('layerSelector');
  el.innerHTML = '';
  if(!mapData) return;

  var allSelected = true;
  for(var cat in mapData.layerData){
    if(!selectedLayers[cat]) { allSelected = false; break; }
  }

  var allItem = document.createElement('div');
  allItem.className = 'layer-item';
  allItem.innerHTML = '<span class="lchk">' + (allSelected ? '✓' : '') + '</span><span>全部</span>';
  allItem.addEventListener('click', function(){
    if(allSelected){
      selectedLayers = {};
    } else {
      for(var c in mapData.layerData) selectedLayers[c] = true;
    }
    renderLayerSelector();
    renderPins();
  });
  el.appendChild(allItem);

  for(var cat in mapData.layerData){
    var item = document.createElement('div');
    item.className = 'layer-item' + (selectedLayers[cat] ? ' active' : '');
    item.innerHTML = '<span class="lchk">' + (selectedLayers[cat] ? '✓' : '') + '</span><span>' + cat + '</span>';
    (function(c){ item.addEventListener('click', function(){
      if(selectedLayers[c]) delete selectedLayers[c];
      else selectedLayers[c] = true;
      renderLayerSelector();
      renderPins();
    });})(cat);
    el.appendChild(item);
  }
}

// ====== 面板开关 ======
function toggleFloorSelector(){
  closeLayerSelector();
  var el = document.getElementById('floorSelector');
  el.classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open', el.classList.contains('open'));
}
function closeFloorSelector(){
  document.getElementById('floorSelector').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}
function toggleLayerSelector(){
  closeFloorSelector();
  var el = document.getElementById('layerSelector');
  el.classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open', el.classList.contains('open'));
}
function closeLayerSelector(){
  document.getElementById('layerSelector').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// ====== 汉堡菜单 ======
function setupHamburger(){
  var hm = document.getElementById('hamburgerMenu');
  if(!hm) return;

  document.getElementById('hamburgerBtn').addEventListener('click', function(){
    hm.classList.add('open');
    document.getElementById('overlay').classList.add('open');
  });

  document.getElementById('hmClose').addEventListener('click', function(){
    hm.classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  });

  hm.querySelector('.hm-logout').addEventListener('click', function(){
    localStorage.removeItem('abi_token');
    localStorage.removeItem('abi_user');
    alert('已退出');
    window.location.reload();
  });
}

// ====== 启动 ======
document.addEventListener('DOMContentLoaded', init);
