(function initAuth(){

  if(h&&h.indexOf('access_token=')>=0){

    var t=p.get('access_token');
    if(t){
      try{
        var payload=JSON.parse(atob(t.split('.')[1]));
        localStorage.setItem('abi_token',t);
        var email=payload.preferred_username||payload.user_metadata?.preferred_username||payload.email||p.get('email')||'';

function db(method,table,body,query){
  var token=localStorage.getItem('abi_token');
  var useToken=(method==='POST'||method==='PATCH');
  var auth=useToken&&token?'Bearer '+token:'Bearer '+SUPABASE_ANON;
  return fetch(SUPABASE_URL+'/rest/v1/'+table+(query?'?'+query:''),{
    method:method,
    headers:{'Authorization':auth,'apiKey':SUPABASE_ANON,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:body?JSON.stringify(body):null
  });
}

function esc(s){
  if(!s)return'';
  var d=document.createElement('div');
  d.appendChild(document.createTextNode(s||''));
  return d.innerHTML;
}

async function previewFiles(input){
  var preview=document.getElementById('filePreview');
  var count=document.getElementById('fileCount');
  if(!input.files||!input.files.length){
    preview.innerHTML='';
    if(count)count.textContent='未选择图片';
    return;
  }
  preview.innerHTML='';
  for(var i=0;i<input.files.length;i++){
    (function(file){
      var reader=new FileReader();
      reader.onload=function(e){
        var img=document.createElement('img');
        img.src=e.target.result;
        preview.appendChild(img);
      };
      reader.readAsDataURL(file);
    })(input.files[i]);
  }
  if(count)count.textContent='已选择 '+input.files.length+' 张图片';
}

async function loadPosts(){
  try{
    var r=await db('GET','map_posts',null,'category=eq.general&order=likes_count.desc.nullslast,created_at.desc&limit=50');
    if(!r.ok)throw new Error(r.status);
    var posts=await r.json();
    var el=document.getElementById('postList');
    if(!posts||posts.length===0){
      el.innerHTML='<div class="no-posts">暂无帖子，快点来发第一条吧！</div>';
      return;
    }
    el.innerHTML=posts.map(function(p){
      var prev=(p.content||'').substring(0,150);
      var cat=p.category||'general';
      var catNames={'general':'杂谈','question':'问答','guide':'攻略','showoff':'炫耀'};
      var cn=catNames[cat]||'杂谈';
      var hue=cat==='guide'?'#4a9eff':cat==='question'?'#ff6b6b':cat==='showoff'?'#ffc832':'#888';
      var imgs = p.images && typeof p.images === 'string' ? JSON.parse(p.images) : [];
      var imgHTML = imgs.length ? '<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">'+imgs.map(function(url){
        return '<img src="'+url+'" style="max-width:200px;max-height:150px;border-radius:6px;object-fit:cover;cursor:pointer;" onclick="window.open(this.src)">';
      }).join('')+'</div>' : '';
      var pId=p.id;
      var token=localStorage.getItem('abi_token');
      var delBtn='';
      
      return '<div class="post-card" id="post_'+pId+'" style="cursor:pointer;" onclick="openPostModal('+pId+')"><h3><a href="javascript:void(0)" href="javascript:void(0)">'+esc(p.title||'无标题')+'</a></h3>'+
        '<div class="meta"><span style="font-size:0.7rem;padding:2px 6px;border-radius:4px;background:'+hue+'22;color:'+hue+';">'+cn+'</span>'+
        '<span>'+esc(p.author||'匿名')+'</span>'+
        '<span>'+(p.created_at?new Date(p.created_at).toLocaleDateString('zh-CN'):'')+'</span>'+
        delBtn+'</div>'+'<div style="margin-top:4px;display:flex;gap:8px;align-items:center;">'+(p.likes_count!==undefined?'<span style="font-size:0.7rem;color:#888;">❤️ '+(p.likes_count||0)+'</span>':'')+'</div>'+
        '<div class="preview">'+esc(prev)+(prev.length>=150?'...':'')+'</div>'+
        imgHTML+
        // comments in modal only
        
        '</div>';
    }).join('');

  }catch(e){
    console.error('loadPosts error:',e);
    var el2=document.getElementById('postList');
    if(el2)el2.innerHTML='<div class="no-posts">加载失败: '+e.message+'</div>';
  }
}

async function submitPost(){
  var title=document.getElementById('postTitle').value.trim();
  var content=document.getElementById('postContent').value.trim();
  if(!title||!content){alert('标题和内容不能为空');return;}
  var token=localStorage.getItem('abi_token');
  if(!token){alert('请先登录');return;}
  var user=localStorage.getItem('abi_user');
  var author='匿名';
  try{author=JSON.parse(user).user_metadata.preferred_username||JSON.parse(user).email||'匿名';}catch(e){}
  
  // Upload images if any
  var fileInput=document.getElementById('postImages');
  var images=[];
  if(fileInput&&fileInput.files.length>0){
    for(var i=0;i<fileInput.files.length;i++){
      var f=fileInput.files[i];
      if(!f.type.startsWith('image/')){alert('只支持图片文件');return;}
      if(f.size>5*1024*1024){alert('单张图片不能超过5MB');return;}
      var imgName=Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.jpg';
      var formData=new FormData();
      formData.append('file',f);
      try{
        var uploadRes=await fetch(SUPABASE_URL+'/storage/v1/object/post_images/'+imgName,{
          method:'POST',
          headers:{'apiKey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'x-upsert':'false'},
          body:formData
        });
        if(uploadRes.ok){
          images.push(SUPABASE_URL+'/storage/v1/object/public/post_images/'+imgName);
        }
      }catch(e){console.error('Upload failed',e);}
    }
  }
  
  try{
    var cat=document.getElementById('postCategory');
    var category=cat?cat.value:'general';
    var r=await fetch(SUPABASE_URL+'/rest/v1/map_posts',{
      method:'POST',
      headers:{'Authorization':'Bearer '+token,'apiKey':SUPABASE_ANON,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:(function(){
        var body={title:title,content:content,category:category,author:author};
        if(images.length)body.images=JSON.stringify(images);
        return JSON.stringify(body);
      })()
    });
    console.log('POST status:',r.status,'response:',await r.text().catch(function(){}));
    if(!r.ok){var err;try{err=await r.json();}catch(e){err={message:await r.text()}};alert('发布失败('+r.status+'): '+(err.message||err));return;}
    alert('✅ 发布成功！');
    document.getElementById('postTitle').value='';
    document.getElementById('postContent').value='';
    if(fileInput)fileInput.value='';
    var pf=document.getElementById('postForm');
    if(pf)pf.style.display='none';
    loadPosts();
  }catch(e){alert('发布失败: '+e.message);}
}

async function loadComments(postId, containerId){
  try{
    var r=await db('GET','post_comments',null,'post_id=eq.'+postId+'&order=created_at.asc');
    if(!r.ok)return;
    var comments=await r.json();
    var el=document.getElementById(containerId);
    if(!el)return;
    if(!comments||comments.length===0){
      el.innerHTML='<div style="color:#555;font-size:0.8rem;padding:4px 0;">暂无评论</div>';
      return;
    }
    var userName=getUserName();
    var token=localStorage.getItem('abi_token');
    el.innerHTML=comments.map(function(c){
      var delBtn=(token&&c.author===userName)?'<button style="background:none;border:none;color:#f55;font-size:0.65rem;cursor:pointer;margin-left:8px;" onclick="deleteComment('+c.id+',\''+containerId+'\','+postId+')">删除</button>':'';
      var cimgs=(c.images&&typeof c.images==='string')?JSON.parse(c.images):[];
      var cimgHTML=cimgs.length?'<div style="display:flex;gap:4px;margin-top:2px;">'+cimgs.map(function(u){return '<img src="'+u+'" style="max-width:80px;max-height:60px;border-radius:4px;object-fit:cover;cursor:pointer;border:1px solid #1e1e2a;" onclick="window.open(this.src)">';}).join('')+'</div>':'';
      return '<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);">'+
        '<span style="color:#ffc832;font-size:0.8rem;white-space:nowrap;">'+esc(c.author)+'</span>'+
        '<div style="flex:1;"><span style="color:#ccc;font-size:0.85rem;">'+esc(c.content)+'</span>'+cimgHTML+'</div>'+
        '<span style="color:#555;font-size:0.65rem;">'+(c.created_at?new Date(c.created_at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'')+'</span>'+
        delBtn+'</div>';
    }).join('');
  }catch(e){}
}

async function addComment(postId, inputId, containerId){
  var input=document.getElementById(inputId);
  var content=input?input.value.trim():'';
  if(!content){alert('请输入评论内容');return;}
  var token=localStorage.getItem('abi_token');
  if(!token){alert('请先登录');return;}
  var author=getUserName();
  try{
    var r=await fetch(SUPABASE_URL+'/rest/v1/post_comments',{
      method:'POST',
      headers:{'Authorization':'Bearer '+token,'apiKey':SUPABASE_ANON,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({post_id:postId,content:content,author:author})
    });
    if(!r.ok){var err=await r.json().catch(function(){});alert('评论失败: '+(err&&err.message||r.status));return;}
    alert('✅ 评论成功');
    input.value='';
    loadComments(postId, containerId);
  }catch(e){alert('评论失败: '+e.message);}
}

async function deleteComment(commentId, containerId, postId){
  if(!confirm('确定删除这条评论？'))return;
  var token=localStorage.getItem('abi_token');
  if(!token){alert('请先登录');return;}
  try{
    var r=await fetch(SUPABASE_URL+'/rest/v1/post_comments?id=eq.'+commentId,{
      method:'DELETE',
      headers:{'Authorization':'Bearer '+token,'apiKey':SUPABASE_ANON}
    });
    if(!r.ok){alert('删除失败');return;}
    alert('🗑 评论已删除');
    loadComments(postId, containerId);
  }catch(e){alert('删除失败: '+e.message);}
}

async function openPostModal(postId){
  var token=localStorage.getItem('abi_token');
  try{
    var r=await db('GET','map_posts',null,'id=eq.'+postId+'&limit=1');
    if(!r.ok){alert('\u52a0\u8f7d\u5931\u8d25');return;}
    var posts=await r.json();
    var p=posts&&posts[0];
    if(!p){alert('\u5e16\u5b50\u4e0d\u5b58\u5728');return;}
    currentModalPostId=postId;
    document.getElementById('modalTitle').textContent=p.title||'\u65e0\u6807\u9898';
    document.getElementById('modalBody').textContent=p.content||'';
    document.getElementById('modalAuthor').textContent=(p.author||'\u533f\u540d');
    document.getElementById('modalDate').textContent=p.created_at?new Date(p.created_at).toLocaleDateString('zh-CN'):'';
    var cat=p.category||'general';
    var catNames={'general':'\u6742\u8c08','question':'\u95ee\u7b54','guide':'\u653b\u7565','showoff':'\u70ab\u8000'};
    var cn=catNames[cat]||'\u6742\u8c08';
    var hue=cat==='guide'?'#4a9eff':cat==='question'?'#ff6b6b':cat==='showoff'?'#ffc832':'#888';
    var catEl=document.getElementById('modalCategory');
    catEl.textContent=cn;
    catEl.style.background=hue+'22';
    catEl.style.color=hue;
    try{
      var un=getUserName();
      if(un&&token){
        var lr=await db('GET','post_likes',null,'post_id=eq.'+postId+'&user_id=eq.'+encodeURIComponent(un)+'&limit=1');
        if(lr.ok){
          var likes=await lr.json();
          if(likes&&likes.length>0){
            var el=document.getElementById('modalLikes');
            if(el)el.classList.add('active');
          }
        }
      }
    }catch(e){}
    var imgEl=document.getElementById('modalImages');
    var imgs=((p.images&&typeof p.images==='string')?JSON.parse(p.images):[])||[];
    imgEl.innerHTML=imgs.length?imgs.map(function(u){return '<img src="'+u+'" onclick="window.open(this.src)">';}).join(''):'';
    var delBtn=document.getElementById('modalDelBtn');
    var userName=getUserName();
    delBtn.style.display=(token&&p.author===userName)?'inline':'none';
    loadComments(postId,'modalComments');
    document.getElementById('postModal').style.display='block';
    document.body.style.overflow='hidden';
  }catch(e){alert('\u52a0\u8f7d\u5931\u8d25: '+e.message);}
}
function closePostModal(){
  document.getElementById('postModal').style.display='none';
  document.body.style.overflow='';
}

async function addCommentFromModal(){
  var input=document.getElementById('modalCommentInput');
  var content=input?input.value.trim():'';
  if(!content){alert('请输入评论内容');return;}
  var token=localStorage.getItem('abi_token');
  if(!token){alert('请先登录');return;}
  var author=getUserName();
  try{
    var body={post_id:currentModalPostId,content:content,author:author};
    if(commentImages&&commentImages.length>0){
      var imgUrls=[];
      for(var i=0;i<commentImages.length;i++){
        var f=commentImages[i];
        var fn='comment_'+Date.now()+'_'+i+'.jpg';
        var ur=await fetch(SUPABASE_URL.replace('/rest/v1','')+'/storage/v1/object/post_images/'+fn,{
          method:'POST',
          headers:{'Authorization':'Bearer '+SUPABASE_ANON,'apiKey':SUPABASE_ANON},
          body:f
        });
        if(ur.ok){
          imgUrls.push(SUPABASE_URL.replace('/rest/v1','')+'/storage/v1/object/public/post_images/'+fn);
        }
      }
      if(imgUrls.length>0)body.images=JSON.stringify(imgUrls);
    }
    var r=await fetch(SUPABASE_URL+'/rest/v1/post_comments',{
      method:'POST',
      headers:{'Authorization':'Bearer '+SUPABASE_ANON,'apiKey':SUPABASE_ANON,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(body)
    });
    if(!r.ok){var err=await r.json().catch(function(){});alert('评论失败: '+(err&&err.message?err.message:r.status));return;}
    if(r.ok||r.status===204||r.status===201){
      var ci=document.getElementById('modalCommentInput');
      if(ci)ci.value='';
      var fi=document.getElementById('commentImages');
      if(fi)fi.value='';
      var pp=document.getElementById('commentPreview');
      if(pp)pp.innerHTML='';
      commentImages=[];
      loadComments(currentModalPostId,'modalComments');
    }
  }catch(e){
    alert('发布失败:'+e.message);
  }
}

async function deletePostFromModal(){
  if(!confirm('确定删除这条帖子？'))return;
  var token=localStorage.getItem('abi_token');
  if(!token){alert('请先登录');return;}
  console.log('Deleting post via RPC:', currentModalPostId);
  try{
    var r=await fetch(SUPABASE_URL+'/rest/v1/rpc/delete_my_post',{
      method:'POST',
      headers:{
        'Authorization':'Bearer '+SUPABASE_ANON,
        'apiKey':SUPABASE_ANON,
        'Content-Type':'application/json'
      },
      body:JSON.stringify({post_id:currentModalPostId})
    });
    console.log('RPC DELETE status:', r.status);
    if(r.status===200||r.status===204){
      var result=await r.text();
      console.log('RPC result:', result);
      if(result==='true'||result===''){
        alert('\uD83D\uDDD1 帖子已删除');
        closePostModal();
        loadPosts();
      }else{
        alert('删除失败：可能没有权限');
      }
    }else{
      var txt=await r.text();
      console.error('RPC DELETE failed:', txt);
      alert('删除失败 ('+r.status+'): '+(txt||'无响应'));
    }
  }catch(e){alert('删除失败: '+e.message);}
}



function closePostFormModal(){
  document.getElementById('postModalForm').style.display='none';
}

function openPostFormModal(){
  var token=localStorage.getItem('abi_token');
  if(!token){alert('请先登录');return;}
  document.getElementById('postModalForm').style.display='block';
}

function previewFilesModal(input){
  var preview=document.getElementById('filePreviewModal');
  var count=document.getElementById('fileCountModal');
  if(!input.files||!input.files.length){preview.innerHTML='';if(count)count.textContent='未选择图片';return;}
  preview.innerHTML='';
  for(var i=0;i<input.files.length;i++){
    (function(file){
      var reader=new FileReader();
      reader.onload=function(e){
        var img=document.createElement('img');
        img.style.cssText='width:60px;height:60px;border-radius:6px;object-fit:cover;border:1px solid #1e1e2a;';
        img.src=e.target.result;
        preview.appendChild(img);
      };
      reader.readAsDataURL(file);
    })(input.files[i]);
  }
  if(count)count.textContent='已选择 '+input.files.length+' 张图片';
}

async function submitPostModal(){
  var title=document.getElementById('postTitleModal').value.trim();
  var content=document.getElementById('postContentModal').value.trim();
  if(!title||!content){alert('标题和内容不能为空');return;}
  var author=getUserName();
  var cat=document.getElementById('postCategoryModal');
  var category=cat?cat.value:'general';
  var fileInput=document.getElementById('postImagesModal');
  var images=[];
  if(fileInput&&fileInput.files.length>0){
    for(var i=0;i<fileInput.files.length;i++){
      var f=fileInput.files[i];
      if(!f.type.startsWith('image/')){alert('只支持图片文件');return;}
      if(f.size>5*1024*1024){alert('单张图片不能超过5MB');return;}
      var imgName=Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.jpg';
      var formData=new FormData();
      formData.append('file',f);
      try{
        var uploadRes=await fetch(SUPABASE_URL+'/storage/v1/object/post_images/'+imgName,{
          method:'POST',
          headers:{'apiKey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'x-upsert':'false'},
          body:formData
        });
        if(uploadRes.ok){
          images.push(SUPABASE_URL+'/storage/v1/object/public/post_images/'+imgName);
        }
      }catch(e){console.error('Upload failed',e);}
    }
  }
  try{
    var body={title:title,content:content,category:category,author:author};
    if(images.length)body.images=JSON.stringify(images);
    // Use anon key instead of token to avoid JWT expiry
    var r=await fetch(SUPABASE_URL+'/rest/v1/map_posts',{
      method:'POST',
      headers:{'apiKey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(body)
    });
    console.log('POST status:',r.status);
    if(r.status===201||r.ok){
      alert('\u2705 发布成功！');
      closePostFormModal();
      document.getElementById('postTitleModal').value='';
      document.getElementById('postContentModal').value='';
      if(fileInput){fileInput.value='';}
      document.getElementById('filePreviewModal').innerHTML='';
      document.getElementById('fileCountModal').textContent='未选择图片';
      loadPosts();
    }else{
      var err;try{err=await r.json();}catch(e){err={message:await r.text()}};alert('发布失败('+r.status+'): '+(err.message||err));
    }
  }catch(e){alert('发布失败: '+e.message);}
}

</script>

<div id="postModal">

    </div>

</div>


<div id="postModalForm" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:10001;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow-y:auto;">
  <div style="max-width:550px;margin:60px auto;background:#12121a;border:1px solid #1e1e2a;border-radius:14px;padding:1.5rem;position:relative;">
    <button style="position:absolute;top:12px;right:14px;background:none;border:none;color:#888;font-size:1.5rem;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;" onclick="closePostFormModal()">✕</button>
    <h3 style="color:#ffc832;margin:0 0 1rem 0;font-size:1.1rem;">📝 发布帖子</h3>
    <input id="postTitleModal" type="text" placeholder="标题" style="width:100%;padding:0.6rem;background:#1a1a22;color:#fff;border:1px solid #333;border-radius:8px;font-size:0.9rem;margin-bottom:0.6rem;box-sizing:border-box;">
    <select id="postCategoryModal" style="width:100%;padding:0.6rem;background:#1a1a22;color:#fff;border:1px solid #333;border-radius:8px;font-size:0.9rem;margin-bottom:0.6rem;">
      <option value="general">杂谈</option>
      <option value="question">问答</option>
      <option value="guide">攻略</option>
      <option value="showoff">炫耀</option>
    </select>
    <textarea id="postContentModal" placeholder="内容..." style="width:100%;padding:0.6rem;background:#1a1a22;color:#fff;border:1px solid #333;border-radius:8px;font-size:0.9rem;min-height:120px;resize:vertical;margin-bottom:0.6rem;box-sizing:border-box;" oninput="document.getElementById('pcCount').textContent=this.value.length"></textarea>
    <div id="filePreviewModal" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0.6rem;"></div>
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:0.8rem;">
      <button style="width:36px;height:36px;border-radius:50%;background:rgba(255,200,50,0.12);color:#ffc832;border:1px solid rgba(255,200,50,0.15);font-size:1.3rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;" onclick="document.getElementById('postImagesModal').click()" title="添加图片">+</button>
      <input id="postImagesModal" type="file" accept="image/*" multiple style="display:none;" onchange="previewFilesModal(this)">
      <span style="color:#666;font-size:0.75rem;" id="fileCountModal">未选择图片</span>
    </div>
    <div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;">
      <span style="color:#555;font-size:0.75rem;" id="pcCount">0</span>
      <button style="padding:0.5rem 1.5rem;background:#ffc832;color:#0a0a0f;border:none;border-radius:8px;cursor:pointer;font-weight:600;" onclick="submitPostModal()">发布</button>
    </div>
  </div>
</div>
