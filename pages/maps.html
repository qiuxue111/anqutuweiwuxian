    /* 页面专属样式 */
    .map-header { text-align: center; padding: 2rem 0 1rem; }
    .map-header h1 { font-size: 2rem; color: #ffc832; }
    .map-header p { color: #888; margin-top: 0.3rem; }

    .map-detail {
      background: #12121a; border: 1px solid #1e1e2a; border-radius: 12px;
      padding: 2rem; margin-bottom: 2rem;
    }
    .map-detail:target { border-color: #ffc832; }

    .map-detail h2 { color: #fff; font-size: 1.4rem; margin-bottom: 1rem; }
    .map-detail h2 .badge {
      display: inline-block; font-size: 0.7rem; padding: 0.15rem 0.6rem;
      border-radius: 20px; margin-left: 0.5rem; vertical-align: middle;
    }
    .badge-easy { background: #1a3a1a; color: #6f6; }
    .badge-med  { background: #3a3a1a; color: #ffc832; }
    .badge-hard { background: #3a1a1a; color: #f66; }

    .map-meta { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
    .map-meta .meta-item { font-size: 0.85rem; color: #999; }
    .map-meta .meta-item strong { color: #ccc; }

    .map-section { margin-top: 1.5rem; }
    .map-section h3 { color: #ffc832; font-size: 1rem; margin-bottom: 0.5rem; }
    .map-section ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .map-section ul li {
      background: #1a1a22; padding: 0.4rem 0.8rem; border-radius: 6px;
      font-size: 0.85rem; color: #ccc;
    }
    .map-section ul li .loot { color: #ffc832; font-weight: 600; }

    .extract-points { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    @media (max-width: 640px) { .extract-points { grid-template-columns: 1fr; } }
    .extract-item {
      background: #1a1a22; border-radius: 8px; padding: 0.8rem 1rem;
    }
    .extract-item .name { color: #fff; font-weight: 600; }
    .extract-item .cond { color: #999; font-size: 0.82rem; margin-top: 0.2rem; }
    .extract-item .cond.conditional { color: #ffc832; }
  </style>
</head>
